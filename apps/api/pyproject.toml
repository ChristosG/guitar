[project]
name = "guitar-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "openai>=1.54",
  "anthropic>=0.69",
  "httpx>=0.27",
  "pymupdf>=1.24",
  # The password gate (Plan 13 Task 3.1) and the at-rest encryption of the
  # tutor's Anthropic key (3.4). Two SEPARATE secrets, hence two libraries:
  # itsdangerous signs the session cookie with APP_SECRET, cryptography's
  # Fernet encrypts the API key with ENCRYPTION_SECRET — rotating the session
  # key must not brick the stored key.
  "itsdangerous>=2.2",
  "cryptography>=43",
  "trafilatura>=1.8",
  "python-multipart>=0.0.9",
  # Local CPU embeddings (multilingual-e5-small, 384-dim). NOT torch: the ONNX
  # runtime plus the tokenizer is ~60MB of wheel against torch's ~800MB, and the
  # end state is a bundled desktop app. Weights are baked into the image at
  # build time (see Dockerfile) — never downloaded at first run.
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "numpy>=2.0",
  # Snowball, for the BM25 arm's stemmer (app/brain/lexical.py). PyStemmer, not
  # NLTK: NLTK's SnowballStemmer does not carry GREEK, and the tutor's default
  # locale is Greek. PyStemmer wraps libstemmer, which does — verified:
  # κιθάρας/κιθάρα both stem to κιθαρ. It is also a C extension with no data
  # files to download at runtime, which matters for a bundled desktop app.
  "PyStemmer>=2.2",
  # Candidate blocking for the canon's reconcile pass (app/canon/reconcile.py).
  # It NEVER decides a merge — measured, real synonyms and real distinctions share
  # one score range ("pickup adjustment"/"adjusting pickup height" scores 45;
  # "6th chord"/"9th chord" scores 88.9), so no threshold separates them and a
  # model adjudicates every surviving pair. What this buys is the ~1M pairwise
  # comparisons that shrink 1,000 names to a handful of clusters, in C, for free.
  "rapidfuzz>=3.9",
  # DOCX export (spec 2026-07-20 §4) — pure Python, no native deps, works in
  # the future bundled desktop app. Backend-side on purpose: one source of
  # truth for the document, testable with pytest, identical output in Tauri.
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "numpy>=2.0"]

# Package only `app`. Without this, the editable install's flat-layout auto-discovery
# sees both `app/` and the `alembic/` migrations dir and errors with
# "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
# Also exempts the test from conftest's autouse `_fake_embedder`: an `integration`
# test gets the REAL embedder (the e5 weights baked into the image), which is the
# whole reason it is marked.
markers = ["integration: needs a live model — vLLM at :6888/:8090, or the real local e5 weights"]
asyncio_mode = "auto"
