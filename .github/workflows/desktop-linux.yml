# GuitarTutor desktop — Linux x64 (deb + AppImage), plus the API pytest gate.
#
# The pytest gate lives HERE (not in desktop-macos.yml): apps/api/tests/conftest.py
# hardcodes DATABASE_URL to localhost:5434 and needs a pgvector Postgres — a
# service container provides exactly that, mapped to host port 5434.
name: desktop-linux

on:
  push:
    branches: [desktop]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: linux-x64

jobs:
  test-api:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: guitar
          POSTGRES_PASSWORD: guitar
          POSTGRES_DB: guitar_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U guitar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API (dev)
        run: pip install -e "apps/api[dev]"

      - name: pytest (integration tests excluded — they need live model weights)
        working-directory: apps/api
        env:
          HF_HUB_OFFLINE: '1'
        run: pytest -q -m "not integration"

  build:
    needs: test-api
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          # libfuse2: appimagetool is itself an AppImage and needs FUSE on 22.04.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install tauri-cli
        # rust-cache caches ~/.cargo/bin, so this is a no-op after the first run.
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version '^2' --locked

      - name: Stage web (Next standalone)
        run: bash desktop/scripts/stage-web.sh

      - name: Cache node dist
        uses: actions/cache@v4
        with:
          path: desktop/.cache/node
          key: node-dist-22.14.0-${{ env.TARGET }}

      - name: Stage node
        run: bash desktop/scripts/stage-node.sh

      - name: Cache staged python
        id: pycache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/python
          key: python-${{ env.TARGET }}-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Stage python + api
        # On a cache hit the script skips fetch+install via its marker file and
        # only restages resources/api (source changes need no cache bust).
        run: bash desktop/scripts/stage-python.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache model download
        uses: actions/cache@v4
        with:
          path: desktop/.cache/model
          key: model-e5-small-fp32-v1

      - name: Stage model
        run: bash desktop/scripts/stage-model.sh

      - name: Cache staged postgres (acceptance-proven only)
        id: pgcache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/pg
          key: pg-theseus16.9.0-pgvector0.8.0-${{ env.TARGET }}-v1

      # No PGDG needed: pgvector builds against the bundled tree's own
      # relocatable pg_config (see stage-postgres.sh).
      - name: Stage postgres + pgvector (with acceptance test)
        # The script FAILS on any acceptance miss, which fails the job, which
        # prevents actions/cache from saving an unproven tree.
        if: steps.pgcache.outputs.cache-hit != 'true'
        run: bash desktop/scripts/stage-postgres.sh

      - name: Fetch seed snapshot (optional)
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/seed
          if gh release download seed-data -p seed.tar.gz -D /tmp/seed; then
            mkdir -p desktop/src-tauri/resources/seed
            tar xzf /tmp/seed/seed.tar.gz -C desktop/src-tauri/resources/seed
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "no seed-data release — building without seed"
            echo "suffix=-noseed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deb + AppImage
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles deb,appimage

      - name: Smoke test the resources embedded in the AppImage
        # The staged tree passing smoke says nothing about what tauri COPIED
        # into the bundle (a bad resources glob once shipped an empty app), so
        # extract the AppImage and boot THAT tree: probe the heavy pieces for a
        # fast clear failure, then run the full pg->alembic->uvicorn smoke.
        run: |
          ./desktop/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          RES=$(find squashfs-root -type d -name resources | head -1)
          test -n "$RES" || { echo "no resources dir in AppImage"; exit 1; }
          for probe in models/e5-small/model.onnx pg/bin/postgres python/bin/python3.12 web/server.js api/alembic.ini; do
            test -e "$RES/$probe" || { echo "MISSING from bundle: $probe"; exit 1; }
          done
          du -sh "$RES"
          bash desktop/scripts/smoke.sh "$RES"
          rm -rf squashfs-root

      - name: Collect bundles
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarTutor-linux-x64${{ steps.seed.outputs.suffix }}
          path: dist/*
          retention-days: 3

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
