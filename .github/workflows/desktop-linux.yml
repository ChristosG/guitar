# GuitarTutor desktop — Linux x64 (.deb), plus every test gate this repo has.
#
# The gates live HERE, not in desktop-macos.yml:
#   test-api  apps/api/tests/conftest.py hardcodes DATABASE_URL to
#             localhost:5434 and needs a pgvector Postgres — a service
#             container provides exactly that. macOS runners have no Docker.
#   test-web  the Rust<->TypeScript API-base contract gate + the hermetic
#             Playwright suite. Platform-independent, so it runs once, here.
#   build     `cargo test` for the shell before the heavy staging.
# Duplicating any of them on macOS would only double the failure surface.
name: desktop-linux

on:
  push:
    branches: [desktop]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: linux-x64

jobs:
  test-api:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: guitar
          POSTGRES_PASSWORD: guitar
          POSTGRES_DB: guitar_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U guitar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API (dev)
        run: pip install -e "apps/api[dev]"

      - name: pytest (integration tests excluded — they need live model weights)
        working-directory: apps/api
        env:
          HF_HUB_OFFLINE: '1'
        run: pytest -q -m "not integration"

  test-web:
    # The web half of the desktop port design, on its OWN runner on purpose:
    # apps/web/playwright.config.ts boots `next dev` on port 3100 with
    # reuseExistingServer:false, and this job has no service containers and
    # starts no other server (every API call in that suite is page.route-mocked
    # — no database, no API, no network), so 3100 cannot collide with anything.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Contract gate — window.__GT_API_BASE__ exists on BOTH sides
        # The desktop shell picks free ports at boot, so the page can no longer
        # derive the API port from its own origin: main.rs injects the base as
        # `window.__GT_API_BASE__` (initialization_script, before any page
        # script) and api.ts reads it. That name is a string contract across
        # two languages and NOTHING type-checks it — renaming one side alone
        # compiles, ships, and silently falls back to :8791. So: grep both.
        run: |
          set -euo pipefail
          symbol='__GT_API_BASE__'
          rust='desktop/src-tauri/src/main.rs'
          web='apps/web/src/lib/api.ts'
          missing=0
          for f in "$rust" "$web"; do
            test -f "$f" || { echo "::error::$f does not exist"; missing=1; continue; }
            grep -qF -- "$symbol" "$f" || { echo "::error file=$f::$symbol not found in $f"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "BROKEN CONTRACT: the desktop API base is passed BY NAME, not by type." >&2
            echo "  $rust  must inject window.$symbol before any page script runs" >&2
            echo "  $web   must prefer it over deriving the API port from the origin" >&2
            echo "The desktop shell picks FREE ports at boot, so the page origin no" >&2
            echo "longer implies the API port. With one side renamed or removed the" >&2
            echo "build still succeeds and the app silently talks to :8791 — a port it" >&2
            echo "does not own. Rename BOTH sides together (and apps/web/tests/api-base.spec.ts)." >&2
            exit 1
          fi
          echo "contract ok: $symbol present in $rust and $web"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        # chromium only: playwright.config.ts declares no `projects`, so the
        # suite runs on the default browser and nothing else is downloaded.
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Playwright (hermetic suite — mocked API, self-booted next dev)
        # Includes tests/api-base.spec.ts: the behavioural half of the contract
        # gate above (injected global wins / absent falls back to :8791 /
        # malformed falls back rather than fetching `undefined/...`).
        working-directory: apps/web
        run: npm test

  build:
    needs: [test-api, test-web]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the tag
        # See desktop/scripts/stamp-version.sh — one script, both runners, and
        # the reason the `desktop-v0.2.0` tag used to ship a 0.1.0 artifact that
        # apt then refused to install over the old one.
        run: |
          V="$(bash desktop/scripts/stamp-version.sh)"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          # libfuse2 is gone with AppImage: this workflow bundles deb-only and
          # tauri.conf.json no longer lists the appimage target at all.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Unit-test the shell (cargo test)
        # Runs BEFORE the ~40 minutes of staging: the port scan, the literal
        # `localhost` origin spelling and the CORS_ORIGINS string are pure
        # logic with unit tests in firstrun.rs, and a regression there should
        # cost seconds, not a full bundle build. Dev profile deliberately —
        # the release profile is fat-LTO'd for the shipped binary. Needs no
        # staged resources (resources/.gitkeep and desktop/ui/splash.html are
        # committed, which is all the tauri build script reads at compile time)
        # but does need the webkit2gtk deps installed above.
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Install tauri-cli
        # rust-cache caches ~/.cargo/bin, so this is a no-op after the first run.
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version '^2' --locked

      - name: Stage web (Next standalone)
        run: bash desktop/scripts/stage-web.sh

      - name: Cache node dist
        uses: actions/cache@v4
        with:
          path: desktop/.cache/node
          key: node-dist-22.14.0-${{ env.TARGET }}

      - name: Stage node
        run: bash desktop/scripts/stage-node.sh

      - name: Cache staged python
        id: pycache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/python
          key: python-${{ env.TARGET }}-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Stage python + api
        # On a cache hit the script skips fetch+install via its marker file and
        # only restages resources/api (source changes need no cache bust).
        run: bash desktop/scripts/stage-python.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache model download
        uses: actions/cache@v4
        with:
          path: desktop/.cache/model
          key: model-e5-small-fp32-v1

      - name: Stage model
        run: bash desktop/scripts/stage-model.sh

      - name: Cache staged postgres (acceptance-proven only)
        id: pgcache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/pg
          key: pg-theseus16.9.0-pgvector0.8.0-${{ env.TARGET }}-v1

      # No PGDG needed: pgvector builds against the bundled tree's own
      # relocatable pg_config (see stage-postgres.sh).
      - name: Stage postgres + pgvector (with acceptance test)
        # The script FAILS on any acceptance miss, which fails the job, which
        # prevents actions/cache from saving an unproven tree.
        if: steps.pgcache.outputs.cache-hit != 'true'
        run: bash desktop/scripts/stage-postgres.sh

      - name: Fetch seed snapshot (optional)
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/seed
          if gh release download seed-data -p seed.tar.gz -D /tmp/seed; then
            mkdir -p desktop/src-tauri/resources/seed
            tar xzf /tmp/seed/seed.tar.gz -C desktop/src-tauri/resources/seed
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "no seed-data release — building without seed"
            echo "suffix=-noseed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deb
        # deb only: linuxdeploy (the AppImage packer) chokes opaquely on the
        # 1.3GB runtime payload, and the Linux artifact exists for local
        # testing — dpkg-deb -x installs it anywhere without root.
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles deb

      - name: Smoke test the resources embedded in the deb
        # The staged tree passing smoke says nothing about what tauri COPIED
        # into the bundle (a bad resources glob once shipped an empty app), so
        # extract the deb and boot THAT tree: probe the heavy pieces for a
        # fast clear failure, then run the full pg->alembic->uvicorn smoke.
        # No app port is assumed anywhere here: smoke scans its own high ranges
        # (pg 54410-54430, api 18791-18811) and boots its own postgres, so it
        # collides with nothing on this runner — and it stays correct however
        # the shell's own derived pair lands on the tutor's machine.
        run: |
          set -euo pipefail
          # ARRAY, NOT A BARE GLOB. `productName` is "Angel OS", so the file is
          # `Angel OS_<v>_amd64.deb` — an unquoted glob word-splits on that
          # space and hands dpkg-deb two nonexistent paths. The old line worked
          # only because the old name had no space in it.
          shopt -s nullglob
          debs=(desktop/src-tauri/target/release/bundle/deb/*.deb)
          [ "${#debs[@]}" -gt 0 ] || { echo "no .deb was produced"; exit 1; }
          dpkg-deb -x "${debs[0]}" debtree
          RES=$(find debtree -type d -name resources | grep -v icons | head -1)
          test -n "$RES" || { echo "no resources dir in deb"; exit 1; }
          for probe in models/e5-small/model.onnx pg/bin/postgres python/bin/python3.12 web/server.js api/alembic.ini; do
            test -e "$RES/$probe" || { echo "MISSING from bundle: $probe"; exit 1; }
          done
          du -sh "$RES"
          bash desktop/scripts/smoke.sh "$RES"
          rm -rf debtree

      - name: Collect bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          # Spaces out of the delivered filename. `productName` is "Angel OS"
          # because that is what belongs in the launcher and the window title,
          # but a space in a downloaded file is something the tutor — and
          # everyone typing `apt install ./…` for him over the phone — then has
          # to quote forever. Renamed once, here, at the last moment.
          shopt -s nullglob
          for f in desktop/src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "dist/$(basename "$f" | tr ' ' '_')"
          done
          ls -lh dist/

      # NO upload-artifact — same reasoning as desktop-macos.yml: the ~800MB
      # deb per branch push is what exhausted the 500MB artifact quota.
      # Branch pushes prove build+smoke; the tag Release below is the one
      # delivery channel (Release assets don't count against the quota).

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
