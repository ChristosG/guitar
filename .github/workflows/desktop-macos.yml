# GuitarTutor desktop — macOS (Apple Silicon) bundle.
#
# NOTE: the only test in this workflow is the bundle smoke test, which HAS to
# run per-platform. Every other gate lives in desktop-linux.yml, which this job
# does not wait for (the two workflows are independent; a red gate there blocks
# the Linux artifact and is meant to be read as "this commit is broken", macOS
# .dmg included).
#   - pytest: apps/api/tests/conftest.py hardcodes DATABASE_URL to postgres at
#     localhost:5434 and rebuilds the schema per run — it HARD-REQUIRES a
#     pgvector Postgres, and macOS runners have no Docker.
#   - cargo test, the `__GT_API_BASE__` Rust<->TypeScript contract gate and the
#     hermetic Playwright suite are all platform-independent; running them a
#     second time here would only double the failure surface.
name: desktop-macos

on:
  push:
    branches: [desktop]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: darwin-arm64

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the tag
        # Same script as desktop-linux.yml, deliberately: the portable-sed trap
        # (`-i` vs `-i ''`, GNU-only `0,/re/`) is exactly the kind of thing that
        # gets written twice and only works once, and macOS is the half nobody
        # here can try by hand.
        run: |
          V="$(bash desktop/scripts/stamp-version.sh)"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install tauri-cli
        # rust-cache caches ~/.cargo/bin, so this is a no-op after the first run.
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version '^2' --locked

      - name: Stage web (Next standalone)
        run: bash desktop/scripts/stage-web.sh

      - name: Cache node dist
        uses: actions/cache@v4
        with:
          path: desktop/.cache/node
          key: node-dist-22.14.0-${{ env.TARGET }}

      - name: Stage node
        run: bash desktop/scripts/stage-node.sh

      - name: Cache staged python
        id: pycache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/python
          key: python-${{ env.TARGET }}-${{ hashFiles('apps/api/pyproject.toml') }}

      - name: Stage python + api
        # On a cache hit the script skips fetch+install via its marker file and
        # only restages resources/api (source changes need no cache bust).
        run: bash desktop/scripts/stage-python.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache model download
        uses: actions/cache@v4
        with:
          path: desktop/.cache/model
          key: model-e5-small-fp32-v1

      - name: Stage model
        run: bash desktop/scripts/stage-model.sh

      - name: Cache staged postgres (acceptance-proven only)
        id: pgcache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/pg
          key: pg-theseus16.9.0-pgvector0.8.0-${{ env.TARGET }}-v1

      # No host postgres needed: pgvector builds against the bundled tree's own
      # relocatable pg_config (see stage-postgres.sh).
      - name: Stage postgres + pgvector (with acceptance test)
        # The script FAILS on any acceptance miss, which fails the job, which
        # prevents actions/cache from saving an unproven tree.
        if: steps.pgcache.outputs.cache-hit != 'true'
        run: bash desktop/scripts/stage-postgres.sh

      - name: Fetch seed snapshot (optional)
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/seed
          if gh release download seed-data -p seed.tar.gz -D /tmp/seed; then
            mkdir -p desktop/src-tauri/resources/seed
            tar xzf /tmp/seed/seed.tar.gz -C desktop/src-tauri/resources/seed
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "no seed-data release — building without seed"
            echo "suffix=-noseed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app bundle
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles app

      - name: Ad-hoc codesign (inside-out)
        run: |
          APP="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          find "$APP" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 codesign -f -s -
          codesign -f -s - "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Verify the signature before it leaves the runner
        # THE FAILURE THIS CATCHES IS SILENT AND REMOTE. There is no Apple
        # Developer account here, so the bundle is ad-hoc signed — which is
        # fine, and INSTALL.txt explains the one-time "Open Anyway". What is
        # NOT fine is an ad-hoc signature that is internally BROKEN: macOS then
        # kills the app on launch, or kills it later when it spawns
        # postgres/python3.12/node, and the tutor sees a bounce-and-quit with
        # nothing written anywhere. That is unreportable from 2,000km away.
        #
        # This app is unusually exposed to it: `--deep` has to cover three
        # whole embedded runtimes, and a single unsigned Mach-O among the
        # thousands of files in resources/ is enough. Verifying here turns a
        # mystery on his Mac into a red X on a build nobody has shipped yet.
        #
        # NOT a notarization check — that needs the paid account we do not
        # have. It is a structural one: is what we signed actually valid.
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          # And prove it really is ad-hoc, so a future signing change cannot
          # quietly ship unsigned while this step still passes.
          codesign -dv "$APP" 2>&1 | grep -q 'Signature=adhoc' \
            || { echo "expected an ad-hoc signature"; codesign -dv "$APP"; exit 1; }
          echo "ad-hoc signature verified across the whole bundle"

      - name: Smoke test the bundled resources
        # Boots what the bundler actually copied, not the staged tree. It needs
        # no app port: smoke scans its own high ranges (pg 54410-54430, api
        # 18791-18811), so the pair the shell derives at boot — whatever it
        # turns out to be — is never involved.
        run: bash desktop/scripts/smoke.sh "$APP/Contents/Resources/resources"

      - name: Package dmg
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cp desktop/INSTALL.txt "$STAGE/"
          # The version is IN the filename now. Two downloads called
          # `GuitarTutor-macos-arm64.dmg` in a Downloads folder are
          # indistinguishable, and "which one did you install?" is the first
          # question any support call has to answer. Underscores, no spaces:
          # `productName` is "Angel OS" because that is what belongs in the
          # launcher, but nobody should have to quote a filename.
          DMG="Angel_OS_${APP_VERSION}_macos-arm64.dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          # XProtect/Spotlight scan the freshly-signed .app and hdiutil then
          # flakes with "Resource busy" — retry a few times before giving up.
          for attempt in 1 2 3 4; do
            if hdiutil create -volname "Angel OS" -srcfolder "$STAGE" -ov -format UDZO \
              "$DMG"; then break; fi
            echo "hdiutil attempt $attempt failed; retrying in 15s"; sleep 15
            [ "$attempt" = 4 ] && exit 1
          done
          ls -lh "$DMG"

      # NO upload-artifact: a ~750MB dmg per branch push against the private
      # repo's 500MB artifact allowance is how the quota died on 2026-08-03
      # (2.2GB stored, every CreateArtifact failing). Branch pushes exist to
      # prove build+smoke; the deliverable ships ONLY via the tag Release
      # below — Release assets are free and don't count against Actions
      # artifact storage.

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG }}
