services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guitar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guitar}
      POSTGRES_DB: ${POSTGRES_DB:-guitar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guitar} -d ${POSTGRES_DB:-guitar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  api:
    build: { context: ./apps/api }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${API_PORT:-8791}:8000"
    volumes:
      - media:/media
    # platform-net → reach the qwen-vllm CHAT box. NOT the embed box any more:
    # since Plan 13 Stage 4 the embeddings run on this container's own CPU
    # (multilingual-e5-small, baked into the image — see apps/api/Dockerfile), so
    # `qwen-emb-vllm` is gone from the app's dependency graph entirely. That is
    # the point: the end state is a bundle on the tutor's iMac, and an iMac has
    # no shared GPU box to reach.
    networks: [appnet, platform-net]

  worker:
    build: { context: ./apps/api }
    env_file: .env
    command: ["python", "-c", "print('worker stub — ingestion lands in the Brain plan'); import time; time.sleep(1e9)"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [appnet, platform-net]

  # LLM_PROVIDER=claude_cli ONLY. Claude on the tutor's Max SUBSCRIPTION, via the
  # `claude` CLI — no API key, no per-token bill. Idle and harmless under
  # LLM_PROVIDER=qwen/claude, which never dial it.
  #
  # WHY A SEPARATE CONTAINER AND NOT `claude` INSIDE `api`. The mounted
  # ~/.claude/.credentials.json is not one token — alongside the Claude OAuth token it
  # holds live access AND refresh tokens for every MCP server you have ever authorised
  # (Linear, GitLab, Postman, HuggingFace, ...). The `api` container is the web-facing
  # one: it parses uploads, serves a chat box, and runs an agent loop over text a user
  # typed. It is the thing worth attacking, and it gets none of this. THIS container
  # runs one thing — `claude -p` with every tool disabled — and publishes no port.
  claude-bridge:
    build: { context: ./tools/claude_bridge }
    env_file: .env            # CLAUDE_BRIDGE_TOKEN — must match the api's copy
    environment:
      CLAUDE_BRIDGE_HOST: "0.0.0.0"     # inside the container; see the missing `ports:` below
      CLAUDE_BRIDGE_PORT: "8799"
      CLAUDE_BRIDGE_MAX_CONCURRENCY: "3"
    # NO `ports:` — DELIBERATELY. Reachable only from `api` over the internal appnet.
    # (The earlier host-run version of this bridge had to bind 0.0.0.0 on a real host
    # port, because a container cannot reach the host's loopback — which left a
    # subscription-spending endpoint exposed to the LAN. Running it in compose is what
    # lets it have no host-facing surface at all.)
    #
    # THE REAL ~/.claude DIRECTORY, read-write. Not a copy, and not the single
    # .credentials.json file:
    #   - a COPY gives you two independent OAuth sessions off one refresh token; the
    #     first to refresh can invalidate the other, and the symptom is your own
    #     terminal `claude` demanding a re-login for no visible reason.
    #   - a single-FILE bind mount breaks the moment the CLI does an atomic
    #     write-and-rename on refresh: the host gets a new inode, the container stays
    #     bound to the old one, and they silently diverge.
    # The directory mount means container and host share ONE file — exactly what two
    # `claude` terminals already do, which is normal and supported.
    volumes:
      - ${HOME}/.claude:/home/node/.claude
    # uid 1000 = the human on the host. Without it the CLI's first token refresh writes
    # a root-owned .credentials.json into your home directory and your own `claude`
    # can no longer update it.
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      # Zero-cost: reads the OAuth token's own expiry. NEVER a `claude -p` ping — a
      # health probe that spends a real call burns a 5-hour rate limit to answer
      # "are we up".
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8799/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [appnet]

  web:
    build:
      context: ./apps/web
      args:
        # EMPTY by default, on purpose. lib/api.ts resolves the API base in the
        # BROWSER, from window.location — one image works on localhost AND on
        # guitar.cgrigoriadis.online. Baking a value here pins the bundle to one
        # of them and silently breaks the other. Set it only for a deployment
        # whose API is not at guitar-api.<domain>.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
        # Inlined at BUILD time (it is a NEXT_PUBLIC_*), so flipping the gate on
        # is a rebuild of `web`, not a restart. Same as NEXT_PUBLIC_API_BASE.
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-0}
    env_file: .env
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-8790}:3000"
    networks: [appnet]

volumes:
  pgdata:
  media:

networks:
  appnet:
  platform-net:
    external: true
