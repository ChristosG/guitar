                                  - button "Προσθήκη υλικού" [ref=f1e256]
                                  - button "Διαγραφή" [ref=f1e257]
                              - generic [ref=f1e258]:
                                - paragraph [ref=f1e259]: "Η ιδέα του tone, όπως τη θέσαμε ως βάση όλου του μαθήματος, είναι μια αλυσίδα κρίκων: δάχτυλα, κιθάρα, καλώδιο, effects, ενισχυτής, ηχείο, δωμάτιο — κάθε κρίκος χρωματίζει το σήμα προτού φτάσει στο αυτί του ακροατή. Η κιθάρα είναι ο πρώτος κρίκος αυτής της αλυσίδας, και σήμερα μένουμε αποκλειστικά σε αυτόν: στο πώς ο τύπος του σώματος και το ξύλο επηρεάζουν την αντήχηση (resonance) και το sustain πριν καν συνδέσουμε καλώδιο. Ο Michael Ross ξεκινάει το βιβλίο του με μια πρόταση που αξίζει να την κρατήσουμε: είναι κοινή παρανόηση να πιστεύουμε ότι μια ηλεκτρική κιθάρα είναι απλώς ένα πλαίσιο που κρατάει pickups, και ότι «τα pickups φτιάχνουν τον ήχο». Στην πραγματικότητα, μια κιθάρα που δεν ακούγεται καλά ξεβυσμένη δεν θα ακουστεί ποτέ πραγματικά καλά μέσα από ενισχυτή — τα pickups μεταφέρουν, δεν εφευρίσκουν. Το vibrating string μεταδίδει όχι μόνο το pitch αλλά και ολόκληρη την τονική ταυτότητα της ίδιας της κατασκευής: αν μια κιθάρα ακούγεται λεπτή και οι νότες σβήνουν γρήγορα ξεβυσμένη, αυτό θα μεταφερθεί κι όταν μπει στον ενισχυτή. Αντίθετα, αν αντηχεί γεμάτη με νότες που μοιάζει να κρατάνε για πάντα, αυτό το χαρακτηριστικό περνάει κι εκείνο στον τελικό ήχο. Ο τύπος κατασκευής του σώματος είναι η πρώτη μεγάλη διαφοροποίηση. Ένα solid-body σώμα (από alder, ash, mahogany) έχει πολύ πιο συγκρατημένη, λεπτή αντήχηση σε σχέση με ένα semi-hollow ή hollow-body όργανο. Αυτό δεν είναι τυχαίο: τα χαρακτηριστικά που κάνουν ένα σώμα να ακούγεται πλούσιο ακουστικά —λεπτό, συμπαγές πάνω μέρος, οπές F, πολύς αέρας μέσα— είναι ακριβώς τα ίδια χαρακτηριστικά που το κάνουν να μπαίνει σε feedback σε σχετικά χαμηλές εντάσεις. Ένα μεγάλο hollow-body τζαζ όργανο έχει πολύ μεγαλύτερη ακουστική αντήχηση από ένα Flying V, αλλά ακριβώς γι' αυτό δεν αντέχει σε δυνατό ήχο χωρίς να ουρλιάζει. Το semi-hollow (τύπου ES-335) είναι ο συμβιβασμός: έχει λεπτότερο κούφιο σώμα, συχνά με ένα συμπαγές κομμάτι ξύλου να διατρέχει τη μέση του σώματος, που προσφέρει sustain χωρίς την πλήρη ευαισθησία σε feedback του πλήρως κούφιου οργάνου. Το ίδιο το ξύλο, ανεξάρτητα από τον τύπο κατασκευής, έχει τη δική του φωνή. Τα πιο βαριά, πυκνά ξύλα (mahogany, βαρύ ash) ακούγονται πιο γεμάτα και κρατάνε καλύτερα σε χαμηλότερες εντάσεις — αλλά όταν ανεβάζεις ένταση, αυτή η πληρότητα μπορεί να γίνει θολούρα (muddiness). Τα πιο ελαφριά ξύλα —swamp ash, alder, poplar— δίνουν καθαρότερο tone σε δυνατές εντάσεις, κάτι που εξηγεί γιατί, καθώς τα group ανέβαζαν decibels μέσα στις δεκαετίες, η τάση μετατοπίστηκε προς πιο ελαφριά σώματα. Ένα solid-body σώμα, επιπλέον, αντηχεί καλύτερα όταν είναι φτιαγμένο από ένα κομμάτι ξύλου παρά από πολλά κολλημένα μαζί — αν και δύο ή τρία κομμάτια μπορούν κάλλιστα να ακουστούν εξίσου καλά. Και επειδή, όπως λέει χαρακτηριστικά ο Ross, «κανένα δέντρο δεν μοιάζει με άλλο», δύο κιθάρες φτιαγμένες από τον ίδιο κατασκευαστή με το ίδιο ξύλο θα ακούγονται πάντα ελαφρώς διαφορετικά μεταξύ τους. Εδώ χρειάζεται μια σημαντική ισορροπία. Στο ηλεκτρικό όργανο, το ξύλο και το σχήμα του σώματος παίζουν σαφώς μικρότερο ρόλο απ' ό,τι σε μια ακουστική κιθάρα, όπου το ξύλο είναι σχεδόν το μοναδικό μέσο παραγωγής ήχου· εδώ τα pickups και η ενίσχυση κυριαρχούν πολύ περισσότερο. Το σχήμα του σώματος καθαυτό έχει ελάχιστη επίδραση στο tone — είναι πρακτικά αμελητέο αν το σώμα είναι Stratocaster ή Flying V σχήμα. Αυτό όμως δεν ακυρώνει όσα είπαμε: ο τύπος κατασκευής (solid/semi-hollow/hollow) και η πυκνότητα του ξύλου παραμένουν πραγματικοί παράγοντες που διαμορφώνουν sustain και αντήχηση, ακόμα κι αν δεν είναι ο μεγαλύτερος κρίκος της αλυσίδας."
