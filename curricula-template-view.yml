                              - generic [ref=f1e3574]:
                                - paragraph [ref=f1e3575]: "Σήμερα περάσαμε έξι εμβληματικά rigs — Hendrix (Strat, cranked Marshall, Fuzz Face, wah), Clapton (Les Paul, cranked Marshall, tone knob κλειστό για το 'woman tone'), Stevie Ray Vaughan (βαριές χορδές, στοίβα overdrive, δυνατό tweed-style Fender, και πάνω απ' όλα δυνατά χέρια), Gilmour (Strat, Big Muff-style fuzz, εκτεταμένο delay), The Edge (dotted-eighth delay πάνω σε καθαρό/ελαφρύ ήχο) και Van Halen ('brown sound': τροποποιημένος high-gain ενισχυτής + flanger, αλλά κυρίως δάχτυλα). Το μάθημα-κλειδί είναι ότι κανένα από αυτά τα rigs δεν ήταν πολύπλοκο — ήταν λίγα στοιχεία πιεσμένα σωστά, μέσα στο σωστό μουσικό context."
