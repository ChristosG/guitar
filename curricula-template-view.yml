                              - generic [ref=f1e3026]:
                                - paragraph [ref=f1e3027]: "Ανοίγουμε τη συζήτηση ρωτώντας τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά ανάμεσα στους τρεις τύπους reverb, και μετά περνάμε σε πρακτικά σενάρια χώρου και context. Q: Ποια είναι η βασική διαφορά στον μηχανισμό παραγωγής ήχου ανάμεσα σε spring και plate reverb; A: Το spring στέλνει το σήμα μέσα από φυσικό ελατήριο μέσω transducers, με ανομοιόμορφη αλλοίωση συχνοτήτων που το κάνει να ακούγεται πιο φυσικό αλλά και να παράγει το 'boing' σε δυνατό attack· το plate δονεί μια μεταλλική πλάκα για πυκνό, λείο decay χωρίς αυτή την ανωμαλία. Q: Γιατί το αλγοριθμικό reverb λέγεται κατάλληλο για τον 'αέρινο' ήχο των ECM jazz δίσκων; A: Γιατί επιτρέπει προσομοίωση οποιουδήποτε μεγέθους ή τύπου χώρου ψηφιακά, και μπορεί να τοποθετήσει τον ήχο σε οποιοδήποτε σημείο μέσα σε αυτόν τον εικονικό χώρο, δίνοντας μια ανοιχτή, ατμοσφαιρική αίσθηση. Q: Αν παίζεις soundcheck σε άδεια αίθουσα και μετά γεμίζει κόσμος, τι πρέπει να κάνεις με το reverb σου και γιατί; A: Συνήθως πρέπει να αυξήσεις το reverb, γιατί τα σώματα των θεατών απορροφούν τον φυσικό ήχο του χώρου και ο ήχος σου γίνεται πιο 'στεγνός' απ' όσο ήταν στο soundcheck. Q: Γιατί το reverb δεν κινδυνεύει να χαλάσει τον ρυθμό όσο αυξάνεται, σε αντίθεση με το delay; A: Επειδή δεν έχει διακριτές, ισόχρονες επαναλήψεις όπως το delay — είναι μια συνεχής, πυκνή αντήχηση χωρίς ευδιάκριτο ρυθμικό pattern, οπότε δεν 'τραβάει' το tempo έξω από τον χρόνο."
