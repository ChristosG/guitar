                              - generic [ref=f1e4140]:
                                - paragraph [ref=f1e4141]: "Το πιο συνηθισμένο λάθος είναι να μπει ο μαθητής σε απόλυτη θέση — «το vintage είναι πάντα καλύτερο» ή «το modeling έχει λύσει τα πάντα». Και τα δύο άκρα αγνοούν αυτό που λέει ξεκάθαρα η θεωρία: κανένα από τα δύο δεν είναι κατηγορηματικά ανώτερο, είναι διαφορετικά εργαλεία με διαφορετικά πλεονεκτήματα ανάλογα με το context — στούντιο, ζωντανή εμφάνιση χαμηλής έντασης, ή σκηνή με πλήρη μπάντα. Ένα δεύτερο λάθος είναι να πιστεύει ο μαθητής ότι ένα ακριβό modeling preset ή ένα vintage pedal θα «διορθώσει» ένα αδύναμο touch· όπως δείξαμε στη Demonstration, ο Robben Ford ακούγεται σαν Robben Ford σχεδόν ανεξάρτητα από το rig, γιατί το tone είναι «largely in their fingers». Τρίτο λάθος, πιο τεχνικό: όταν δοκιμάζουν modeling συστήματα, πολλοί μαθητές αφήνουν τα presets στην πιο υπερβολική τους μορφή (πολλή παραμόρφωση, πολύ reverb) επειδή έτσι ακούγονται εντυπωσιακά σε δοκιμή μόνοι τους — ακριβώς το ίδιο λάθος με τα stock effects programs στα πολυ-εφέ που περιγράφει ο Ross, τα οποία ακούγονται υπερβολικά όταν τα δοκιμάζεις μόνος σου στο μαγαζί αλλά καταπίνονται μέσα σε μια μπάντα. Η διόρθωση είναι πάντα η ίδια: λιγότερο effect, περισσότερη προσοχή στο πώς χτυπάς τη χορδή."
