                              - generic [ref=f1e4197]:
                                - paragraph [ref=f1e4198]: "Άνοιξε το 10λεπτο block συζήτησης ζητώντας από τον μαθητή να υπερασπιστεί μία θέση (vintage ή modeling) και μετά να την ανατρέψει ο ίδιος, για να δεις αν κατάλαβε ότι δεν υπάρχει απόλυτη απάντηση. Q: Γιατί οι τιμές των vintage ενισχυτών δεν έχουν ανέβει τόσο όσο των vintage κιθαρών, σύμφωνα με το βιβλίο; A: Επειδή, όπως λέει ο Ross, 'aging does not improve the sound' στους ενισχυτές όσο στις κιθάρες, και πολλοί σύγχρονοι κατασκευαστές (mainstream και boutique) φτιάχνουν ενισχυτές που ακούγονται εξίσου καλά με τους παλιούς. Q: Ποια τεχνολογία εισήγαγε το 2011 το Kemper Profiler και πώς διαφέρει από το απλό amp modeling; A: Το 'profiling' ή 'capturing' — τη δυνατότητα να δημιουργείς ψηφιακό αντίγραφο ενός συγκεκριμένου φυσικού κομματιού εξοπλισμού που ήδη κατέχεις, αντί απλώς να επιλέγεις από προκαθορισμένα μοντέλα διάσημων ενισχυτών. Q: Τι εννοεί το βιβλίο όταν λέει ότι μια vintage κιθάρα μπορεί να μην 'έχει το magic' ακόμα κι αν κατασκευαστεί πανομοιότυπα με παλαιωμένο ξύλο και νιτροκυτταρινικό βερνίκι; A: Ότι δεν υπάρχει εγγύηση ότι ένα νέο instrument θα 'μιλήσει' (θα έχει εκείνη την ξεχωριστή απόκριση/χαρακτήρα) απλώς επειδή χρησιμοποιήθηκαν τα ίδια υλικά και μέθοδοι — κάτι υποκειμενικό και απρόβλεπτο παραμένει πέρα από τις τεχνικές προδιαγραφές. Q: Σύμφωνα με την ιστορία του Robben Ford στο βιβλίο, τι μας διδάσκει για τη σχέση εξοπλισμού και ήχου; A: Ότι το touch παίζει μεγαλύτερο ρόλο από το ίδιο το gear — ένας έμπειρος παίκτης μπορεί να κάνει ένα ξένο rig να ακουστεί εντυπωσιακά καλύτερο απλώς με το πώς παίζει, γεγονός που δείχνει πως ο ήχος 'is largely in their fingers'."
