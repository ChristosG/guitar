                          - generic [ref=f1e1420]:
                            - paragraph [ref=f1e1421]: Ο μαθητής μαθαίνει γιατί το cabinet και τα ηχεία διαμορφώνουν το tone εξίσου με τον ενισχυτή, πώς λειτουργεί η αντιστοίχιση σύνθετης αντίστασης (impedance matching) και πώς η τοποθέτηση μικροφώνου αλλάζει τον ήχο περισσότερο απ' όσο νομίζει κανείς. Η ώρα κλείνει με πρακτικές ασκήσεις ακρόασης και έναν οδηγό υπολογισμού αντίστασης για σειρά και παράλληλη καλωδίωση.
                            - button "Επέκταση με συνομιλία" [ref=f1e1424]
                          - generic [ref=f1e1425]:
