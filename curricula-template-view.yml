                              - generic [ref=f1e2960]:
                                - paragraph [ref=f1e2961]: "Το πιο συχνό λάθος είναι να μπερδεύεται ο μαθητής νομίζοντας ότι το 'sproi-oi-oiing' ενός spring reverb σε δυνατό attack είναι βλάβη του ενισχυτή — δεν είναι, είναι φυσιολογική συμπεριφορά του ελατηρίου, και πρέπει απλώς να ρυθμιστεί η ένταση του reverb ή το πόσο δυνατά χτυπάει η χορδή. Δεύτερο λάθος: να ρυθμίζεται το reverb σε άδεια αίθουσα κατά το soundcheck και μετά να μένει ίδιο όταν γεμίζει ο χώρος με κόσμο — τα σώματα απορροφούν ήχο, οπότε συχνά χρειάζεται περισσότερο reverb όταν γεμίζει η αίθουσα, ακριβώς το αντίθετο από αυτό που νιώθει διαισθητικά κανείς. Τρίτο λάθος: να χρησιμοποιείται μεγάλο hall reverb σε γρήγορο, ρυθμικό παίξιμο (π.χ. funk comping), όπου κάθε νότα πρέπει να είναι καθαρή και διακριτή — εκεί ταιριάζει πολύ μικρότερο decay ή καθόλου reverb. Τέλος, πολλοί μαθητές ξεχνούν ότι, σε αντίθεση με το delay, το reverb δεν επηρεάζει τον αντιληπτό ρυθμό όσο κι αν αυξηθεί η ποσότητά του, οπότε καταλήγουν να είναι υπερβολικά συντηρητικοί με το reverb ενώ θα μπορούσαν να το αφήσουν πιο ελεύθερα χωρίς να χαλάσουν το groove."
