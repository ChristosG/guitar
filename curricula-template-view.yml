                              - generic [ref=f1e1782]:
                                - paragraph [ref=f1e1783]: "Άνοιξε το 10λεπτο συζήτησης ζητώντας από τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά soft/hard clipping πριν του δώσεις την απάντηση-κλειδί, ώστε να δεις πού κολλάει η κατανόησή του. Q: Ποια είναι η βασική διαφορά ανάμεσα σε soft clipping και hard clipping; A: Το soft clipping (τυπικά από λυχνίες) στρογγυλεύει σταδιακά τις κορυφές του σήματος και παράγει αρμονικές που σχετίζονται αρμονικά με τον ήχο, ενώ το hard clipping (τυπικά από transistors) κόβει απότομα τις κορυφές παράγοντας πιο έντονες ανώτερες αρμονικές — γι' αυτό ακούγεται πιο 'σκληρό'. Q: Γιατί ένα ίδιο ποσοστό distortion ακούγεται διαφορετικό αν συμβαίνει στο preamp σε σχέση με το power amp; A: Το preamp distortion τείνει να είναι πιο συμπυκνωμένο και dynamic, ενώ το power amp distortion είναι πιο συμμετρικό, με κυρίως odd-order αρμονικές, και συνήθως απαιτεί πολύ μεγαλύτερη ένταση για να εμφανιστεί φυσικά. Q: Τι έκανε δυνατή την ύπαρξη distortion σε χαμηλή ένταση, μετά την εποχή του Marshall Super Lead με ένα μόνο volume knob; A: Η εισαγωγή του master volume, που ξεχώρισε το preamp gain (πόσο 'σπάει' ο ήχος) από τη συνολική ένταση εξόδου, και αργότερα τα cascading gain stages των high-gain ενισχυτών. Q: Τι διαφορά υπάρχει, στην πράξη, ανάμεσα σε overdrive, distortion και fuzz πεντάλ; A: Το overdrive μιμείται soft clipping λυχνίας και μένει ευαίσθητο στη δυναμική του χεριού· το distortion κόβει πιο σκληρά και συμμετρικά για πιο κορεσμένο, λιγότερο δυναμικό ήχο· το fuzz κόβει πιο σκληρά και ασύμμετρα απ' όλα, δίνοντας παχιά, μερικές φορές gated υφή."
