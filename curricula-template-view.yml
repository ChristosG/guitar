                                - paragraph [ref=f1e333]: "Το πιο συχνό λάθος είναι η υπόθεση ότι «ό,τι tone θέλω, το βρίσκω βάζοντας άλλα pickups» — παραβλέποντας ότι μια κιθάρα με κακή ακουστική βάση (choked νότες, γρήγορο decay) δεν διορθώνεται ποτέ πλήρως με pickups, effects και ενισχυτή· μπορεί να γίνει «καλή», όχι όμως «σπουδαία». Δεύτερο λάθος: η πεποίθηση ότι πιο βαρύ ξύλο είναι πάντα καλύτερο ξύλο — η αλήθεια είναι ότι το βαρύ, πυκνό ξύλο βοηθάει σε χαμηλή ένταση αλλά μπορεί να θολώσει το tone σε δυνατή ένταση, οπότε η επιλογή εξαρτάται από το πώς και πού θα παίξει κανείς. Τρίτο, πολύ συχνό λάθος αρχαρίων: να αποδίδουν σημασία στο σχήμα του σώματος (π.χ. «η Flying V ακούγεται πιο επιθετική επειδή έχει αιχμηρό σχήμα») — το σχήμα καθαυτό έχει ελάχιστη έως καμία επίδραση στο tone, είναι κατασκευαστική/αισθητική επιλογή, όχι τονική. Η διόρθωση πάντα είναι η ίδια: γύρνα στο ξεβυσμένο τεστ και άκου το ξύλο και τον τύπο κατασκευής, όχι το σχήμα."
