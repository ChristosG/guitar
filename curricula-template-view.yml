                              - generic [ref=f1e2744]:
                                - paragraph [ref=f1e2745]: Τώρα περνάμε το delay στα δικά σου χέρια. Θα δουλέψουμε τις τρεις εφαρμογές με τη σειρά που τις άκουσες, ξεκινώντας πάντα από το tap tempo ή το μέτρημα του χρόνου με το αυτί, γιατί χωρίς σωστό χρόνο καμία ρύθμιση δεν θα ακουστεί σωστά σε μπάντα. Ρύθμιση slapback με το αυτί (6 min) Παίξε ένα single-note lick σε 90 bpm και ρύθμισε το delay time γυρίζοντας το κουμπί μέχρι η επανάληψη να «κολλήσει» πάνω στη νότα χωρίς να ακούγεται σαν ξεχωριστή ηχώ. Κράτα μόνο μία επανάληψη. Tap tempo για dotted-eighth (8 min) Χρησιμοποίησε το tap tempo pedal (ή υπολόγισε χειροκίνητα) για να συγχρονίσεις το delay με το μετρονόμο στα 100 bpm, μετά παίξε απλές δίφωνες συγχορδίες αργά και άκουσε αν η επανάληψη πέφτει ανάμεσα στους παλμούς. Ping-pong σε στερεοφωνικό σετάρισμα (6 min) Σύνδεσε το delay σε δύο κανάλια (ή ακουστικά) και παίξε μια αργή μελωδία μίας νότας τη φορά, ακούγοντας πώς κάθε επανάληψη μετακινείται από τη μία πλευρά στην άλλη.
