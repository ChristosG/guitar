                          - generic [ref=f1e226]:
                            - paragraph [ref=f1e227]: Η κιθάρα είναι ο πρώτος κρίκος της αλυσίδας του ήχου, και πολύ πριν μπει στην εξίσωση οποιοδήποτε pickup ή amp, το ξύλο και ο τύπος του σώματος καθορίζουν sustain, αντήχηση και χαρακτήρα. Σε αυτό το μάθημα ακούμε και νιώθουμε γιατί ένα solid-body, ένα semi-hollow και ένα hollow-body «μιλάνε» τόσο διαφορετικά — ακόμα κι αν βρεθούν στο ίδιο ενισχυτή.
                            - button "Επέκταση με συνομιλία" [ref=f1e230]
                          - generic [ref=f1e231]:
