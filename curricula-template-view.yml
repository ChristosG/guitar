                              - generic [ref=f1e1871]:
                                - paragraph [ref=f1e1872]: "Στο προηγούμενο module είδαμε πώς ένα distorted amp ή ένα gain pedal προσθέτει αρμονικές και αλλάζει τον χαρακτήρα του ήχου. Ο compressor είναι διαφορετικό ζώο: δεν προσθέτει παραμόρφωση (τουλάχιστον όχι σκόπιμα), δεν αλλάζει τον χαρακτήρα της νότας — αλλάζει το πώς εξελίσσεται η ένταση της νότας μέσα στον χρόνο. Ο Michael Ross το εξηγεί με τον καλύτερο δυνατό τρόπο: φαντάσου τον compressor σαν ένα αυτόματο volume pedal. Όσο δυνατά κι αν χτυπήσεις τη χορδή, ο compressor κατεβάζει την ένταση στο amp σε ένα προκαθορισμένο επίπεδο. Μετά, καθώς η χορδή σβήνει φυσικά και η ένταση που στέλνει το pickup πέφτει, ένας μικρός εσωτερικός ενισχυτής μέσα στον compressor ανεβάζει σταδιακά την ένταση για να την κρατήσει σταθερή στο ίδιο επίπεδο με το αρχικό χτύπημα. Εδώ βρίσκεται η πιο σημαντική διάκριση του μαθήματος: distortion is a description of a type of sound, sustain refers to how long the note remains audible. Το distortion μπορεί μερικές φορές να αυξήσει το sustain, αλλά το sustain μπορεί να αυξηθεί και χωρίς καθόλου distortion — αυτό ακριβώς κάνει ο compressor. Και όπως έδειξε το πείραμα της προθέρμανσης: η νότα δεν κρατάει στην πραγματικότητα περισσότερο· απλώς παραμένει πιο δυνατή για περισσότερη ώρα. Γι' αυτό ο Ross μιλάει για «apparent» sustain — φαινομενικό, όχι πραγματικό. Το πραγματικό sustain είναι δουλειά της ίδιας της κιθάρας (κάτι που είδαμε στο πρώτο module του κύκλου — nut, frets, ξύλο, setup): κανένα ηλεκτρονικό εφέ δεν αναπληρώνει μια χορδή που «πνίγεται» ή ένα κακοκομμένο nut. Η δεύτερη λειτουργία του compressor, εξίσου σημαντική, είναι η εξομάλυνση της δυναμικής. Ακόμα και οι καλύτερα φτιαγμένες κιθάρες έχουν νότες που ακούγονται πιο δυνατές από άλλες. Ένας compressor κατεβάζει τις δυνατές νότες και/ή ανεβάζει τις πιο αδύναμες, εξισώνοντας τη γενική εικόνα. Αυτό είναι το concept του «evens out picking dynamics» που περιγράφεται και στο πρώτο μας module για τα gain effects: μια νότα που χτυπήθηκε διστακτικά βγαίνει εξίσου δυνατή με μια που χτυπήθηκε δυναμικά, κάνοντας το παίξιμο να ακούγεται πιο σίγουρο απ' όσο ίσως πραγματικά είναι. Αυτό είναι εξαιρετικό για funk και country picking, όπου θέλεις σφιχτή, ομοιόμορφη ένταση σε γρήγορα rhythm patterns, αλλά έχει και το τίμημά του: η προσωπικότητα ενός παίκτη βρίσκεται σε μεγάλο βαθμό στο πώς επιτίθεται στις χορδές — δυνατά, απαλά, με βεβαιότητα ή με δισταγμό. Η υπερβολική συμπίεση «ομογενοποιεί» αυτή τη δυναμική, γι' αυτό παίκτες με πολύ έντονο touch (π.χ. στιλ σαν του Robben Ford ή του Jeff Beck) συνήθως αποφεύγουν βαριά compression, ενώ παίκτες όπως ο Adrian Belew δουλεύουν σκόπιμα με compressor ανοιχτό στο μέγιστο, ώστε το «σφίξιμο» της επίθεσης να γίνει μέρος του ήχου τους. Πρακτικά, ένας compressor έχει συνήθως δύο ή τρία κουμπιά. Το «volume» ή «output» ελέγχει τη συνολική ενίσχυση που βγαίνει από τη συσκευή — μπορείς να το χρησιμοποιήσεις για να αναπληρώσεις απώλειες gain σε επόμενα εφέ, ή ακόμα και για να οδηγήσεις ελαφρώς το amp σε overdrive. Το «sustain», «compression» ή «effect» καθορίζει πόσο έντονη είναι η συμπίεση — και εδώ ισχύει πάντα το trade-off: περισσότερο sustain σημαίνει λιγότερη δυναμική. Μερικοί compressors έχουν και «attack», που σου επιτρέπει να ελέγξεις πόσο «σφίγγεται» η αρχική επίθεση ανεξάρτητα από το sustain."
