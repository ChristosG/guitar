                              - generic [ref=f1e3806]:
                                - paragraph [ref=f1e3807]: "Άνοιξε τη συζήτηση ζητώντας από τον μαθητή να σκεφτεί συγκεκριμένους ήχους που ξέρει από δίσκους και να μαντέψει αν ακούστηκαν έτσι και ζωντανά, χρησιμοποιώντας όσα είπαμε για context. Q: Γιατί ένα mid-scooped tone που ακούγεται τέλειο μόνο του στο δωμάτιο συχνά 'εξαφανίζεται' όταν παίζεις μέσα σε μπάντα; A: Επειδή τα mids είναι η συχνότητα που κάνει την κιθάρα να ξεχωρίζει μέσα σε ένα μείγμα με μπάσο, ντραμς και άλλα όργανα· σκουπίζοντάς τα, η κιθάρα χάνει την παρουσία της live, ενώ σε απομόνωση το scoop ακούγεται εντυπωσιακό [S1 p.1]. Q: Γιατί πολλοί κιθαρίστες μπαίνουν στο στούντιο νιώθοντας σίγουροι για το live tone τους και μετά απογοητεύονται ακούγοντας τα playback monitors; A: Επειδή στο στούντιο το σήμα συχνά απομονώνεται (baffles, χαμηλότερη ένταση, ή direct recording) και ακούγεται μέσα από διαφορετικά μεγάφωνα/monitors, με αποτέλεσμα να φαίνεται 'thin, lifeless' - κάτι κοινό και όχι απόδειξη κακής τεχνικής [S2 p.63]. Q: Ποια είναι η πρακτική συμβουλή για το πώς να μιλήσεις σε έναν μηχανικό στούντιο αν το tone σου δεν ακούγεται σωστά; A: Να μάθεις να περιγράφεις τι λείπει με όρους συχνοτήτων (πρίμα, μεσαία, μπάσα) και να προσπαθείς να διορθώσεις με mic placement πριν καταφύγεις σε EQ, αντί να δέχεσαι απλά 'θα το φτιάξουμε στο μείγμα' [S2 p.63]."
