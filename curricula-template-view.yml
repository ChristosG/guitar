                              - generic [ref=f1e2671]:
                                - paragraph [ref=f1e2672]: "Πριν ανοίξουμε καθόλου delay, παίξε πέντε λεπτά καθαρό ήχο (clean channel, χωρίς κανένα εφέ) πάνω σε ένα απλό I-IV-V σε 80 bpm, με μέτριο palm muting στις χαμηλές χορδές και πλήρη χτυπήματα στις ψηλές. Ο λόγος: το delay δεν προσθέτει τίποτα, απλώς επαναλαμβάνει ό,τι του δίνεις — αν το σήμα σου είναι ασταθές ρυθμικά, οι επαναλήψεις θα το τονίσουν αλύπητα. Θέλουμε τα αυτιά σου συγχρονισμένα με το μετρονόμο πριν αρχίσουμε να προσθέτουμε repeats πάνω σε αυτό που παίζεις, γιατί σήμερα η ακρίβεια του tempo θα είναι το μισό μάθημα."
                                - button "Επέκταση με συνομιλία" [ref=f1e2675]
