                                  - button "Διαγραφή" [ref=f1e3534]
                              - generic [ref=f1e3535]:
                                - paragraph [ref=f1e3536]: "Οι ασκήσεις εδώ δεν στοχεύουν στην τέλεια αντιγραφή ενός δίσκου, αλλά στο να νιώσεις με τα ίδια σου τα χέρια τι έκανε κάθε rig να λειτουργεί. Δούλεψε τις παρακάτω με μετρητή χρόνου και πρόσεξε τι αλλάζει όταν αλλάζεις μόνο τη δυναμική σου, όχι το gear. Woman Tone Roll-off (6 min) Σε κιθάρα με humbucker, παίξε μια απλή μπλουζ φράση με τον selector στο neck πικάπ και το tone knob πλήρως ανοιχτό. Μετά κλείσε σταδιακά το tone knob σε βήματα (10-7-4-1) παίζοντας την ίδια φράση κάθε φορά, με μέτριο crunch από τον ενισχυτή. Σημείωσε στο σημείο που ο ήχος γίνεται 'φωνητικός' χωρίς να χάνει εντελώς την ένταση. Δυναμική επίθεση χωρίς pedal (6 min) Παίξε ένα riff μιας δωδεκάμετρης μπλουζ σε clean/ελαφρύ crunch ήχο τρεις φορές: μαλακή επαφή, μέτρια επαφή, δυνατή επαφή αποκλειστικά με downstrokes. Ηχογράφησε (κινητό αρκεί) και σύγκρινε — στόχος είναι να ακούσεις πόσο compression παράγει μόνο το χέρι σου. Dotted-eighth delay pattern (6 min) Ρύθμισε ένα delay στο dotted-eighth του tempo σου (χρησιμοποίησε tap tempo αν έχεις). Παίξε μια απλή τετράφθογγη αρπέζ συγχορδία αργά, αφήνοντας τις επαναλήψεις να γεμίσουν τα κενά, όπως στο παράδειγμα του The Edge. Ear-training: ποιος είναι; (5 min) Άκουσε τρία σύντομα αποσπάσματα που θα σου παίξω (ή διάλεξε από τις προτεινόμενες ηχογραφήσεις στην ενότητα homework) και προσπάθησε να αναγνωρίσεις ποιο από τα έξι rigs ακούς, δικαιολογώντας την επιλογή σου με συγκεκριμένα χαρακτηριστικά (π.χ. 'wah + fuzz = Hendrix', 'πολλαπλές επαναλήψεις σε καθαρό ήχο = Edge')."
                                - button "Επέκταση με συνομιλία" [ref=f1e3539]
