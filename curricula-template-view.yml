                                  - button "Διαγραφή" [ref=f1e652]
                              - generic [ref=f1e653]:
                                - paragraph [ref=f1e654]: "Ξεκινάμε από τη βάση: ένα pickup είναι, στην ουσία, ένας ηλεκτρομαγνήτης. Σύρμα τυλιγμένο γύρω από μόνιμο μαγνήτη (ή μαγνήτες), και όταν η μεταλλική χορδή δονείται μέσα στο μαγνητικό του πεδίο, παράγεται ρεύμα που ταξιδεύει μέσα από το καλώδιο ως το amp — αυτό μεταφέρει όχι μόνο το ύψος της νότας αλλά attack, sustain, ένταση και τον χαρακτήρα του κάθε παίκτη. Όσο περισσότερες σπείρες σύρματος (windings) και όσο μεγαλύτερος ο μαγνήτης, τόσο μεγαλύτερο το output — αλλά αυτό δεν σημαίνει απαραίτητα καλύτερο ήχο, γιατί περισσότερα windings σημαίνουν λιγότερο treble. Ο τύπος μαγνήτη παίζει επίσης ρόλο: τα alnico magnets (κράμα αλουμινίου-νικελίου-κοβαλτίου) δίνουν πιο ζεστό ήχο, ενώ τα ceramic magnets είναι φθηνότερα στην παραγωγή και δίνουν περισσότερο treble, αλλά με μια πιο σκληρή, εύθραυστη ποιότητα. Το single coil pickup —αυτό που βρίσκουμε σε Stratocaster και Telecaster— είναι απλά ένα μπομπίνο τυλιγμένο μία φορά γύρω από τον μαγνήτη. Ο ήχος του είναι φωτεινός, αρθρωτός (articulate), λίγο πιο λεπτός σε σχέση με έναν humbucker, αλλά έχει ένα γνωστό πρόβλημα: έναν ακουστό βόμβο 60Hz (60-cycle hum) που προέρχεται από ηλεκτρομαγνητική παρεμβολή γύρω μας — καλωδιώσεις, φωτισμό, transformers. Αυτό δεν είναι ελάττωμα κατασκευής· είναι η φύση ενός ενιαίου πηνίου που λειτουργεί σαν κεραία. Ο humbucker λύνει ακριβώς αυτό το πρόβλημα. Εφευρέθηκε το 1955 από τον Seth Lover στη Gibson, ουσιαστικά ταυτόχρονα με το Filter'Tron του Ray Butts για τη Gretsch, και η λύση είναι κομψή: δύο πηνία, side-by-side, τυλιγμένα σε αντίθετη φορά (reverse-wound) και με αντίθετη πολικότητα μαγνήτη (reverse-polarity), συνδεδεμένα σε σειρά. Ο θόρυβος που «ακούν» και τα δύο πηνία από το περιβάλλον είναι ίδιος και σε αντίθετη φάση, οπότε ακυρώνεται — εξ ου και το όνομα «humbucker», γιατί κυριολεκτικά «σταματά το hum». Το σήμα της ίδιας της χορδής, όμως, δεν ακυρώνεται αλλά προστίθεται, γιατί τα δύο πηνία «βλέπουν» τη χορδή από διαφορετικά σημεία μήκους της. Το αποτέλεσμα είναι πιο χοντρός, πιο ζεστός, υψηλότερου output ήχος, ιδανικός για overdrive και distortion — αλλά και κάπως λιγότερο treble σε σχέση με ένα single coil, λόγω και της διπλάσιας ποσότητας windings και της phase cancellation ανάμεσα στα δύο πηνία. Αξίζει να θυμόμαστε επίσης κάτι που αναφέρει ο Michael Ross: η τοποθεσία του pickup πάνω στην κιθάρα παίζει εξίσου μεγάλο ρόλο με τον τύπο του. Αν παίξεις μια ανοιχτή χορδή ακουστικά και πικάρεις κοντά στο bridge, μετά στη μέση, μετά κοντά στο λαιμό, θα ακούσεις τρεις εντελώς διαφορετικούς χαρακτήρες — φωτεινό, μεσαίο, ζεστό. Το ίδιο ακριβώς pickup, μετακινημένο, δίνει διαφορετικό ήχο, επειδή απλώς «μαζεύει» ό,τι κάνει η χορδή σε εκείνο το σημείο."
