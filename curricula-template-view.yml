                                - paragraph [ref=f1e528]: Οι ασκήσεις κινούνται από το γενικό (νιώσε ολόκληρο τον λαιμό) στο συγκεκριμένο (μέτρησε με tuner το intonation μίας χορδής), ώστε ο μαθητής να συνδέσει αυτά που άκουσε στη θεωρία με το δικό του όργανο, σήμερα, εδώ, στο μάθημα. Έλεγχος neck relief με το αυτί (6 min) Ο μαθητής παίζει αργά σκάλα σε μονές νότες από το 1ο ως το 12ο τάστο σε κάθε χορδή, εντοπίζοντας ηχητικά (buzz ή υψηλό action feel) την περιοχή 5ου-9ου τάστου. Καταγράφει αν υποψιάζεται bow ή backbow. Δοκιμή πίεσης δαχτύλων σε barre συγχορδία (6 min) Παίζει barre F στο 1ο τάστο και Bm στο 7ο, πρώτα με ελάχιστη πίεση μέχρι να ακουστεί καθαρά κάθε χορδή, μετά με υπερβολική πίεση, ακούγοντας τη μετατόπιση του τόνου προς τα πάνω. Έλεγχος intonation στο 12ο τάστο (8 min) Με tuner, ο μαθητής συγκρίνει τον αρμονικό στο 12ο τάστο με τη νότα πατημένη στο ίδιο τάστο για κάθε χορδή, καταγράφοντας ποιες χορδές είναι sharp ή flat. Ψηλαφητή αναγνώριση nut (5 min) Ο μαθητής παίζει κάθε ανοιχτή χορδή αργά και προσεκτικά, ακούγοντας για ήχο 'πιασίματος' ή χορδή που 'κουνιέται' στο nut· αν έχει διαθέσιμη δεύτερη κιθάρα με διαφορετικό υλικό nut, συγκρίνει τον ήχο ανοιχτών χορδών.
