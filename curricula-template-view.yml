                              - generic [ref=f1e3850]:
                                - paragraph [ref=f1e3851]: Πριν μπούμε σε EQ, θέλουμε τα αυτιά «ζεσταμένα» στο να ακούν midrange. Παίξε για 5 λεπτά μια απλή I-IV-V blues προοδο σε E (E7 - A7 - B7) με clean ή ελαφρώς crunch ήχο, σε tempo περίπου 80 bpm, χτυπώντας power chords και μικρά licks στην πρώτη θέση. Καθώς παίζεις, άφησε το amp στην ουδέτερη ρύθμιση (bass, mid, treble όλα στο 12 της ώρας) — δεν αλλάζουμε τίποτα ακόμα. Ο στόχος είναι απλώς να ακούσεις πώς ακούγεται η κιθάρα σου «flat», πριν αρχίσουμε να τη σμιλεύουμε ανά είδος στη συνέχεια του μαθήματος. Άκουσε ιδιαίτερα το midrange της κιθάρας σου — είναι η περιοχή συχνοτήτων που θα δουλέψουμε περισσότερο σήμερα.
                                - button "Επέκταση με συνομιλία" [ref=f1e3854]
