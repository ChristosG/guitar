                              - generic [ref=f1e1373]:
                                - paragraph [ref=f1e1374]: "Μέχρι το επόμενο μάθημα: (1) Άκουσε τρία κομμάτια που να αντιπροσωπεύουν κάθε οικογένεια — π.χ. κάτι blues/country για Fender, κλασικό ροκ των late '60s / early '70s για Marshall, κάτι British Invasion ή U2 για Vox, και σύγχρονο metal για high-gain — και γράψε σε δύο-τρεις προτάσεις τι ακούς στο mid και στο πόσο νωρίς σπάει ο ήχος. (2) Στο δικό σου όργανο ή σε modeling unit, ρύθμισε και τις τέσσερις φωνές που δουλέψαμε σήμερα και ηχογράφησε 30 δευτερόλεπτα από την καθεμία παίζοντας την ίδια απλή φράση — έτσι θα έχεις προσωπικό υλικό αναφοράς. Θα ξέρεις ότι το πέτυχες αν, ακούγοντας τα δικά σου κλιπ μία εβδομάδα μετά, μπορείς να πεις ποιο ήταν ποιο χωρίς να θυμάσαι τη σειρά ηχογράφησης."
