                              - generic [ref=f1e3745]:
                                - paragraph [ref=f1e3746]: "Το πιο συχνό λάθος είναι να ρυθμίζεις το tone σου μόνος στο δωμάτιο και μετά να το κουβαλάς αυτούσιο στη σκηνή - το mid-scooped, 'εντυπωσιακό μόνο του' tone είναι ακριβώς αυτό που εξαφανίζεται μέσα σε μια μπάντα, όπως προειδοποιεί το υλικό [S1 p.1]. Ένα δεύτερο λάθος, συμμετρικό στο πρώτο, είναι να χρησιμοποιείς υπερβολικά πολλά εφέ (delay, reverb, chorus) όταν παίζεις live επειδή ακούγονται ωραία solo, ξεχνώντας ότι 'many of the sound subtleties that you hear on stage are lost out in the audience' και ότι οι πολλαπλές στρώσεις εφέ μπορούν να σε βυθίσουν μέσα στο μείγμα ακριβώς τη στιγμή που παίζεις το καλύτερο solo της βραδιάς [S2 p.61]. Τρίτο λάθος: στο στούντιο, πολλοί μαθητές παίρνουν προσωπικά το γεγονός ότι το tone τους ακούγεται 'thin, lifeless' στα monitors του control room και νομίζουν ότι φταίει η τεχνική τους - το βιβλίο είναι ξεκάθαρο ότι αυτό συμβαίνει σχεδόν σε κάθε ηχογράφηση και δεν σημαίνει ότι κάτι δεν πάει καλά με τον παίκτη [S2 p.63]. Η διόρθωση και στις τρεις περιπτώσεις είναι η ίδια: μάθε να ακούς το tone σου μέσα στο context όπου θα ακουστεί τελικά - μέσα σε μπάντα, μέσα σε ένα mix - πριν κρίνεις αν είναι σωστό."
