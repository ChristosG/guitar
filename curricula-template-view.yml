                              - generic [ref=f1e3127]:
                                - paragraph [ref=f1e3128]: Οι ασκήσεις αυτού του μαθήματος στοχεύουν στο να μετατρέψουν τον θεωρητικό κανόνα σε ακουστική συνήθεια — ο μαθητής πρέπει να μπορεί να ακούσει, όχι μόνο να απαγγείλει, γιατί μια σειρά είναι σωστή. Χτίσε τη δική σου chain of command (5 min) Δώσε στον μαθητή μια τυχαία λίστα εφέ (π.χ. delay, compressor, distortion, chorus, reverb, wah) και ζήτησέ του να τα βάλει στη σωστή σειρά στο χαρτί πριν καν αγγίξει το pedalboard, αιτιολογώντας κάθε επιλογή με μία πρόταση. A/B test σειράς gain-modulation (8 min) Στο πραγματικό board, παίξε το ίδιο riff με το chorus πριν και μετά το distortion, εναλλάξ, τρεις φορές το καθένα, και περιέγραψε φωναχτά τη διαφορά που ακούς πριν σου πω ποια σειρά είναι η «σωστή». Δοκιμή buffer/tone-suck (7 min) Παίξε την ίδια open συγχορδία με κοντό καλώδιο απευθείας στον ενισχυτή, μετά μέσα από 5 σβηστά true bypass pedals και μεγάλο καλώδιο, μετά με buffer ενεργό στην αρχή της αλυσίδας. Σημείωσε τι αλλάζει στα πρίμα κάθε φορά. Στήσιμο FX loop (5 min) Αν ο ενισχυτής της τάξης έχει FX loop, σύνδεσε ένα delay pedal στο send/return αντί μπροστά στην είσοδο, ενεργοποίησε ήπιο overdrive στο front input, και άκουσε τη διαφορά καθαρότητας σε σχέση με το να βάλεις το ίδιο delay μπροστά από όλη την αλυσίδα.
