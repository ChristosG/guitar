                              - generic [ref=f1e442]:
                                - paragraph [ref=f1e443]: "Ξεκινάμε με πέντε λεπτά ανοιχτών συγχορδιών (E, A, D, G) παιγμένες σε ανοιχτή θέση και μετά οι ίδιες μορφές μεταφερμένες ως barre στο πέμπτο και στο δέκατο τάστο. Ζητάμε από τον μαθητή να ακούσει —όχι να παίξει τεχνικά σωστά, αλλά να ακούσει— αν η συγχορδία «κάθεται» το ίδιο καθαρά καθώς ανεβαίνει ο λαιμός. Αυτό είναι το ζέσταμα των δαχτύλων, αλλά κυρίως είναι ζέσταμα αυτιού: προετοιμάζει το αυτί να προσέξει αργότερα τις λεπτές αλλαγές στο τονισμό (intonation) και στο buzz που θα ψάξουμε σκόπιμα στη συνέχεια του μαθήματος. Στο τέλος του ζεσταμού, ζητάμε ένα απλό tuning check στο 12ο τάστο, χωρίς σχόλια ακόμα — απλώς για να έχουμε ένα σημείο αναφοράς πριν μπούμε στη θεωρία."
                                - button "Επέκταση με συνομιλία" [ref=f1e446]
