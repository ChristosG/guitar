                              - generic [ref=f1e1685]:
                                - paragraph [ref=f1e1686]: "Θα παίξω το ίδιο riff τρεις φορές, με τρεις διαφορετικές πηγές distortion, για να ακούσουμε τη διαφορά που μόλις περιγράψαμε. Πρώτα, ένα power chord σε A (5ο τάστο, χορδές Ε-Α-D) μέσα από το καθαρό preamp ενός tube combo, με το gain γύρω στο 3 και το master volume αρκετά ψηλά — θα ακούσεις έναν σχετικά καθαρό ήχο με λίγη φυσική συμπίεση από το power amp, αφού το ίδιο το amp αρχίζει να 'δουλεύει'. Δεύτερον, θα ανεβάσω το preamp gain στο 7-8 κρατώντας το master volume χαμηλά για να μείνουμε στην ίδια ένταση δωματίου· θα ακούσεις πιο συμπυκνωμένο, πιο σαστισμένο ήχο με περισσότερες αρμονικές πάνω από τη θεμελιώδη νότα — αυτό είναι preamp distortion, «soft clipping» από τη λυχνία. Τρίτον, θα γυρίσω το preamp πίσω σε καθαρό και θα βάλω μπροστά ένα πεντάλ distortion (τύπου Pro Co Rat ή Boss DS-1) ρυθμισμένο να δίνει παρόμοιο επίπεδο κορεσμού· θα συγκρίνουμε πόσο πιο 'στρωτό' και συμμετρικό ακούγεται το πεντάλ σε σχέση με τη λυχνία, ειδικά στο πώς αντιδρά όταν χαμηλώνω το volume knob της κιθάρας — το tube preamp καθαρίζει πιο φυσικά, το solid-state πεντάλ λιγότερο ομαλά. Τέλος θα δείξω τι σημαίνει «stacking»: βάζω ένα ήπιο overdrive μπροστά από το ήδη ελαφρώς οδηγημένο preamp και ακούμε πώς προστίθενται δύο διαφορετικοί χαρακτήρες clipping το ένα πάνω στο άλλο, δίνοντας πιο σύνθετο αποτέλεσμα από οποιοδήποτε μεμονωμένο στάδιο."
