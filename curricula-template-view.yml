                              - generic [ref=f1e2982]:
                                - paragraph [ref=f1e2983]: "Σήμερα μάθαμε ότι το reverb δεν είναι απλώς πολλά delay μαζί, αλλά προσομοίωση πραγματικού φυσικού χώρου. Είδαμε τρεις βασικούς τύπους: το spring reverb, μηχανικό, ζεστό αλλά με το χαρακτηριστικό 'boing' σε δυνατό attack· το plate reverb, λείο και συμπαγές, ιδανικό για στούντιο δουλειά που δεν πρέπει να τραβάει προσοχή· και το αλγοριθμικό reverb, που μπορεί να προσομοιώσει οτιδήποτε από μικρό δωμάτιο μέχρι τεράστια, ατμοσφαιρική αίθουσα. Είδαμε επίσης ότι η σωστή ποσότητα reverb εξαρτάται άμεσα από τον πραγματικό χώρο και το μουσικό context — άδεια ή γεμάτη αίθουσα, ρυθμικό ή sustained παίξιμο — και ότι το reverb, όπως και το delay, μπαίνει συνήθως τελευταίο στην αλυσίδα σήματος."
