                                - paragraph [ref=f1e2596]: "Μέχρι την επόμενη συνάντηση, 15 λεπτά πρακτικής, 3-4 φορές: πάρτε ένα δικό σας riff ή σόλο πέρασμα και δοκιμάστε το πρώτα με octave pedal (mix 30%), μετά με harmonizer σε smart διατονική έκτη κάτω, και τέλος με pitch-shift -10 cents. Ηχογραφήστε (έστω με το κινητό) τα τρία περάσματα και ακούστε τα ξανά την επόμενη μέρα — ο στόχος είναι να αναγνωρίζετε με κλειστά μάτια ποιο εφέ ακούτε μόνο από τον χαρακτήρα του (σταθερό vs ταλαντούμενο, καθαρό vs θολό). Θα ξέρετε ότι το πετύχατε αν μπορείτε να περιγράψετε προφορικά, χωρίς να κοιτάτε το pedal, γιατί ένα πέρασμα ακούγεται «σταθερό και παχύ» (pitch shift) ενώ ένα άλλο ακούγεται «να κυματίζει» (chorus, για σύγκριση)."
