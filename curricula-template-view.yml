                                  - button "Διαγραφή" [ref=f1e239]
                              - generic [ref=f1e240]:
                                - paragraph [ref=f1e241]: "Πριν αγγίξουμε καν τον ενισχυτή, θέλω να ακούσουμε την κιθάρα όπως πραγματικά είναι: ένα ακουστικό όργανο. Ο μαθητής παίζει πέντε λεπτά εντελώς ξεβυσμένος (unplugged) — απλές ανοιχτές συγχορδίες (E, A, D, G) και μεμονωμένες νότες στην έκτη και πρώτη χορδή, αφήνοντάς τις να σβήσουν εντελώς φυσικά χωρίς να τις μουτάρει. Ζητάω να προσέξει τρία πράγματα: πόσο γρήγορα ή αργά σβήνει ο ήχος (decay), αν ακούγεται «γεμάτος» ή «λεπτός», και αν αισθάνεται τις δονήσεις στο σώμα και στον λαιμό όσο κρατάει την κιθάρα. Αυτή είναι ακριβώς η άσκηση που περιγράφει ο Michael Ross μέσα από την ιστορία του G.E. Smith, ο οποίος έκρινε αν μια κιθάρα άξιζε να αγοραστεί χτυπώντας τη μία φορά ξεβυσμένη — αν το όργανο δεν ακούγεται καλά ακουστικά, δεν πρόκειται ποτέ να ακουστεί πραγματικά καλά ηλεκτρικά, όσο καλά pickups κι αν βάλουμε πάνω του."
                                - link "Getting Great Guitar Sounds, σελ. 11" [ref=f1e243] [cursor=pointer]:
                                  - /url: /el/library/08e20b20-3144-4125-b87f-ff9254a3b8de?page=11
                                - button "Επέκταση με συνομιλία" [ref=f1e249]
