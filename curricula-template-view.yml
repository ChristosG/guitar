                              - generic [ref=f1e2355]:
                                - paragraph [ref=f1e2356]: "Το πιο συχνό λάθος είναι να μπερδεύουν οι μαθητές chorus και flanger επειδή και τα δύο παράγουν ένα «swoosh». Η διόρθωση: αν το πεντάλ έχει κοντρόλ feedback/regeneration και ακούγεται μεταλλικό στα άκρα, είναι flanger· αν είναι πιο λείο και φαρδύ χωρίς μεταλλικότητα, είναι chorus. Δεύτερο συχνό λάθος: ανεβάζουν το depth στο τέρμα μαζί με αργό rate, νομίζοντας ότι «περισσότερο εφέ = καλύτερο», και καταλήγουν σε μια νότα που ακούγεται σαν να ζαλίζεται· η σωστή προσέγγιση είναι μικρότερο depth με γρηγορότερο rate για πιο μουσικό αποτέλεσμα, ειδικά σε solo. Τρίτο λάθος: αποκαλούν το tremolo ενός amp «vibrato» (ή αντίστροφα) χωρίς να ελέγξουν αν αυτό που ακούνε είναι παλμός έντασης ή λύγισμα ύψους — η διόρθωση είναι απλή ακρόαση: αν πάλλεται η ένταση, είναι tremolo· αν λυγίζει η νότα, είναι vibrato. Τέταρτο, μερικοί μαθητές τοποθετούν το modulation effect μετά το distortion στην αλυσίδα τους, κάτι που θολώνει τον ήχο — θυμήσου τη σειρά σήματος που είδαμε νωρίτερα στο μάθημα. Τέλος, αρκετοί βάζουν ταυτόχρονα flanger και phaser νομίζοντας ότι κάνουν το ίδιο πράγμα πιο έντονο· στην πραγματικότητα προσθέτουν δύο διαφορετικά χρώματα που συχνά αλληλοαναιρούνται ηχητικά."
