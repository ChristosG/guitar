                              - generic [ref=f1e3083]:
                                - paragraph [ref=f1e3084]: "Στα προηγούμενα μαθήματα είδαμε τι κάνει κάθε είδος εφέ ξεχωριστά — τι είναι το delay, τι είναι η reverb. Σήμερα ασχολούμαστε με ένα εξίσου σημαντικό ερώτημα: με ποια σειρά συνδέονται όλα αυτά μεταξύ τους, και γιατί έχει σημασία η σειρά. Η βασική αρχή είναι απλή: κάθε pedal επεξεργάζεται ό,τι σήμα φτάνει στην είσοδό του, άρα το αποτέλεσμα ενός pedal εξαρτάται πλήρως από το τι προηγήθηκε. Η συμβατική σειρά σύνδεσης — tuner, μετά compression, μετά gain (overdrive, distortion, fuzz), μετά modulation, και τέλος τα χρονικά εφέ (delay, reverb) — δεν είναι αυθαίρετη σύμβαση, υπάρχει επειδή η τοποθέτηση gain μετά από modulation ή delay τείνει να ακούγεται θολή ή fizzy, ενώ όταν το gain έρχεται πρώτο, το pitch tracking και η καθαρότητα των νοτών παραμένουν άθικτα καθώς το σήμα προχωράει προς τα εφέ που «χρωματίζουν» τον ήχο. Ο Michael Ross, στο κεφάλαιο «Putting It All Together» του βιβλίου του, ονομάζει αυτή τη λογική «chain of command» και δίνει μια πιο αναλυτική σειρά προτεραιότητας: πρώτα ο compressor, γιατί αν και δεν προσθέτει θόρυβο μόνος του, θα ενισχύσει τον θόρυβο οτιδήποτε βρίσκεται πριν από αυτόν — άρα θέλουμε να στέλνουμε στα υπόλοιπα εφέ ένα ομοιόμορφο σήμα. Μετά έρχεται το distortion, γιατί θέλουμε να παραμορφώσουμε το πιο «καθαρό» δυνατό σήμα πριν το στείλουμε για περαιτέρω επεξεργασία — αν βάλεις chorus ή delay πριν το distortion, το αποτέλεσμα είναι πιο θολό και πιο θορυβώδες, γιατί το distortion, όπως και ο compressor, ενισχύει τον θόρυβο οτιδήποτε προηγείται. Το wah-wah, όταν χρησιμοποιείται, τείνει να ακούγεται καλύτερα πριν το distortion. Μετά το distortion έρχεται συνήθως το chorus/flanging, γιατί χρησιμοποιεί τόσο μικρό χρόνο καθυστέρησης που δεν υποβαθμίζει το σήμα όσο τα μεγαλύτερα delays, οπότε στέλνει το πιο καθαρό σήμα στο επόμενο στάδιο. Μετά ακολουθούν τα σύντομα delays (slapback, doubling) και μετά τα πιο μεγάλα, «ambient» delays. Τελευταία έρχεται η reverb, συχνά επειδή είναι ενσωματωμένη στον ενισχυτή, αλλά και για λόγους φυσικότητας του ήχου — θέλουμε ο χώρος να «τυλίγει» όλα τα προηγούμενα στάδια, όχι το αντίστροφο. Το ίδιο μοτίβο περιγράφεται και στην έννοια του signal flow: buffers, gain effects, modulation, time effects με αυτή τη σειρά, ακριβώς επειδή κάθε στάδιο αντιδρά σε ό,τι το προηγήθηκε. Ένα κρίσιμο, πρακτικό κομμάτι της αλυσίδας που δεν αφορά τον ήχο του κάθε pedal αλλά την ακεραιότητα του σήματος συνολικά, είναι ο buffer. Όσο το σήμα της κιθάρας ταξιδεύει μέσα από πολλά μέτρα καλωδίου και πολλά bypassed pedals συνδεδεμένα σε σειρά, χάνει σταδιακά τις υψηλές συχνότητές του — ένα φαινόμενο που περιγράφεται ως το σήμα να «tone-sucks». Ένας buffer αποκαθιστά την ισχύ αυτού του σήματος. Εδώ μπαίνει η διάκριση ανάμεσα σε true bypass και buffered bypass: το true bypass σημαίνει ότι όταν το pedal είναι σβηστό, βγαίνει εντελώς έξω από το κύκλωμα — καμία χρωματική επίδραση, αλλά και καμία ενίσχυση του σήματος. Το buffered bypass, αντίθετα, κρατάει έναν buffer ενεργό μέσα στο pedal ακόμα κι όταν αυτό είναι σβηστό, ώστε το σήμα να μη χάνεται καθώς περνάει από το κύκλωμα. Σε μικρά boards με λίγα pedals, το true bypass συνήθως αρκεί. Σε μεγάλα boards με πολλά true bypass pedals σε σειρά, όμως, χρειάζεται τουλάχιστον ένας αποκλειστικός buffer κάπου στην αλυσίδα, γιατί η αθροιστική απώλεια σήματος γίνεται αισθητή. Τέλος, το FX loop ενός ενισχυτή λύνει ένα συγκεκριμένο πρόβλημα: επιτρέπει στα modulation και time-based εφέ να μπουν μετά το gain stage του preamp αλλά πριν από το power amp, κάτι που συνήθως ακούγεται καθαρότερο από το να βάλεις ένα delay ή μια reverb μπροστά από έναν ήδη παραμορφωμένο ενισχυτή. Ο Ross σημειώνει πρακτικά ότι αν ο ενισχυτής σου έχει FX loop, το πιθανότερο είναι ότι το δικό του gain stage βρίσκεται πριν το loop — άρα ό,τι βάλεις στο send/return κάνει τη δουλειά που κάνουν κανονικά τα modulation/time εφέ στο τέλος της αλυσίδας, χωρίς να χρειάζεται να τα βάλεις μπροστά από όλη την κιθάρα. Χρειάζεται προσοχή στη στάθμη σήματος (send/return levels) ώστε να μη δημιουργηθεί ανεπιθύμητη παραμόρφωση στο loop. Και όπως λέει ο ίδιος, ο μόνος πραγματικά αυστηρός κανόνας είναι «If it sounds good - do it!» — υπάρχουν γνωστές εξαιρέσεις, όπως το να βάζεις ένα ήπιο delay πριν το distortion για να γίνεται πιο έντονο μόνο όταν ανάβει το gain, αλλά αυτές είναι συνειδητές αποκλίσεις από τον κανόνα, όχι λάθη."
