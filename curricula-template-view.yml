                                - paragraph [ref=f1e953]: Σήμερα κλείσαμε το πρώτο module του course βλέποντας ότι πένα και χορδές είναι φτηνά αλλά ισχυρά εργαλεία τόνου — πάχος και υλικό αλλάζουν φωτεινότητα και βάρος του ήχου σχεδόν όσο μια αλλαγή pickup. Πάνω απ' όλα όμως είδαμε, και το ακούσαμε στην πράξη, ότι το attack, η θέση παιξίματος και τα dynamics του δεξιού χεριού είναι η μεγαλύτερη μεταβλητή σε ολόκληρη την αλυσίδα του tone — tone is in the hands δεν είναι κλισέ, είναι μετρήσιμο στο ίδιο σου το αυτί.
