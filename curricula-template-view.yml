                        - generic [ref=f1e2656]:
                          - generic [ref=f1e2657]:
                            - paragraph [ref=f1e2658]: "Ο μαθητής μαθαίνει τη διαφορά ανάμεσα σε tape, analog και digital delay, και πώς οι ίδιες βασικές παράμετροι (χρόνος, επαναλήψεις, μείγμα) παράγουν τρεις εντελώς διαφορετικές εφαρμογές: slapback, dotted-eighth και ping-pong. Στόχος είναι να ακούει κανείς τη διαφορά, όχι μόνο να διαβάζει την τιμή στην οθόνη του pedal."
