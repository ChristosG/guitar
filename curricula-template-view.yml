                              - generic [ref=f1e1237]:
                                - paragraph [ref=f1e1238]: "Πριν μπούμε στις οικογένειες ενισχυτών, ζέσταμα 5 λεπτών πάνω στο ίδιο υλικό που είδαμε στο προηγούμενο μάθημα: παίξε μια απλή προοδο συγχορδιών σε ανοιχτή θέση (π.χ. E - A - D - G) πρώτα με τον ενισχυτή εντελώς καθαρό, χαμηλό gain, και μετά ανεβάζοντας σταδιακά το gain μέχρι να αρχίσει να σπάει ο ήχος. Άκουσε πού ακριβώς συμβαίνει το breakup, νωρίς ή αργά, γιατί αυτό το σημείο headroom είναι ακριβώς αυτό που διαφοροποιεί τις οικογένειες που θα ακούσουμε σήμερα. Κράτα τον ίδιο τόνο (bass/mid/treble) σταθερό όσο ζεσταίνεσαι, ώστε η μόνη μεταβλητή να είναι το gain."
