                              - generic [ref=f1e398]:
                                - paragraph [ref=f1e399]: "Κλείνουμε με δέκα λεπτά συζήτησης, κρατώντας αυτή τη σελίδα μπροστά μου για να ελέγξω τις απαντήσεις του μαθητή. Q: Γιατί ο Michael Ross λέει ότι μια κιθάρα που δεν ακούγεται καλά ξεβυσμένη δεν θα ακουστεί ποτέ πραγματικά σπουδαία μέσα από ενισχυτή; A: Επειδή τα pickups απλώς μεταφέρουν τον ήχο των χορδών όπως αυτές δονούνται πάνω στο συγκεκριμένο σώμα και λαιμό· δεν δημιουργούν νέο ήχο. Μια κιθάρα με κακό sustain ή λεπτό ήχο ακουστικά θα μεταφέρει αυτά τα ίδια χαρακτηριστικά και ηλεκτρικά, όσο καλά pickups κι αν έχει. Q: Ποια είναι η βασική ανταλλαγή (trade-off) ανάμεσα σε ένα πλήρως hollow-body και ένα solid-body όργανο; A: Το hollow-body έχει μεγαλύτερη φυσική αντήχηση και πλουσιότερο ακουστικό tone, αλλά ακριβώς τα ίδια χαρακτηριστικά (λεπτό πάνω μέρος, αέρας μέσα) το κάνουν να μπαίνει σε feedback σε χαμηλότερες εντάσεις. Το solid-body θυσιάζει μέρος αυτής της φυσικής αντήχησης αλλά αντέχει σε πολύ πιο δυνατές εντάσεις χωρίς feedback. Q: Ένας μαθητής λέει «διάλεξα αυτή την κιθάρα επειδή το σχήμα της μου φαινόταν πιο agressive, οπότε θα έχει πιο σκληρό tone». Τι θα του απαντούσες; A: Ότι το σχήμα του σώματος καθαυτό έχει ελάχιστη έως καμία επίδραση στο tone — είναι αισθητική/εργονομική επιλογή. Αυτό που πράγματι επηρεάζει το tone είναι ο τύπος κατασκευής (solid/semi-hollow/hollow) και το είδος/βάρος του ξύλου, όχι το περίγραμμα του σώματος."
