                              - generic [ref=f1e1067]:
                                - paragraph [ref=f1e1068]: "Πριν ανοίξουμε καθόλου θεωρία, βάλε τον μαθητή να παίξει ένα απλό power chord progression (π.χ. E5–A5–D5) σε clean channel, πρώτα με το preamp gain του ενισχυτή στο 2 και μετά σταδιακά ανεβάζοντάς το ως το 8, χωρίς να αγγίξει το master volume. Ζήτα του να περιγράψει τι ακούει: πότε η νότα αρχίζει να \"σφίγγει\", πότε εμφανίζονται αρμονικές που δεν υπήρχαν πριν. Αυτό δεν είναι ακόμα το μάθημα — είναι για να ζεσταθεί το αυτί του πριν του δώσουμε ονόματα στα πράγματα που μόλις άκουσε."
