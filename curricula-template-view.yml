                                - paragraph [ref=f1e506]: "Πρώτα δείχνουμε τον έλεγχο του neck relief με το «if it ain't broke, don't fix it» τεστ: ρυθμίζουμε το action άνετο σε ανοιχτή θέση, μετά παίζουμε αργά, καθαρά νότες στο 5ο έως 9ο τάστο. Αν το action νιώθεται πολύ ψηλό εκεί, δείχνουμε πώς αυτό υποδηλώνει bow και σφίγγουμε ελαφρώς το truss rod (μισή στροφή τη φορά, ποτέ βίαια)· αν οι νότες βουίζουν ή κόβονται (fret out) εκεί, δείχνουμε ότι αυτό υποδηλώνει backbow και χαλαρώνουμε αντίστοιχα. Έπειτα παίζουμε μία απλή συγχορδία Ε major στο πρώτο τάστο εφαρμόζοντας σκόπιμα ανομοιόμορφη πίεση σε κάθε δάχτυλο — πρώτα ελαφριά, μετά υπερβολικά δυνατή — για να ακούσει ο μαθητής πώς η υπερβολική πίεση ανεβάζει (sharp) τη νότα, ειδικά αν το όργανο έχει ψηλά τάστα. Το ίδιο επαναλαμβάνεται σε barre συγχορδία στο 7ο τάστο, όπου η διαφορά ακούγεται ακόμα πιο καθαρά επειδή έξι χορδές πρέπει να έχουν την ίδια ακριβώς πίεση. Τέλος, δείχνουμε το intonation check: παίζουμε τον αρμονικό (harmonic) στο 12ο τάστο μιας χορδής, μετά την ίδια χορδή πατημένη κανονικά στο 12ο τάστο, συγκρίνοντας τις δύο νότες σε tuner. Αν η πατημένη νότα είναι αισθητά sharp ή flat σε σχέση με τον αρμονικό, δείχνουμε πού βρίσκεται η βίδα intonation στο saddle και προς ποια κατεύθυνση θα κινούνταν (χωρίς να την αγγίξουμε αν η κιθάρα δεν χρειάζεται καινούριες χορδές, όπως τονίζει η θεωρία)."
