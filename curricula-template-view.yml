                                - paragraph [ref=f1e3110]: "Θα δείξω την ίδια φράση παιγμένη με δύο διαφορετικές σειρές στο pedalboard, ώστε ο μαθητής να ακούσει την ίδια τη διαφορά, όχι απλώς να την περιγράψουμε. Παίζω ένα riff με power chords σε E (E5 στην 6η/5η χορδή, ρίφι τεσσάρων μέτρων σε μέτριο rock τέμπο, περίπου 100 bpm) μέσα από μια αλυσίδα compressor → overdrive → chorus → delay → reverb → ενισχυτής. Πρώτα το παίζω με αυτή τη σωστή σειρά: το overdrive «σφίγγει» τις νότες καθαρά, το chorus προσθέτει ελαφρύ πλάτος χωρίς να θολώνει τις χαμηλές χορδές, και το delay/reverb δίνουν χώρο στο τέλος. Μετά αλλάζω μόνο τη θέση του chorus, βάζοντάς το πριν το overdrive, και παίζω ακριβώς το ίδιο riff· ο μαθητής θα ακούσει τις χαμηλές χορδές να γίνονται πιο θολές και λιγότερο καθορισμένες, ακριβώς όπως περιγράφει ο Ross για τη λογική του chain of command. Στη συνέχεια δείχνω το φαινόμενο του buffer με ένα πρακτικό test: παίζω μια απλή open-position συγχορδία (G) κατευθείαν στον ενισχυτή με ένα κοντό καλώδιο 3 μέτρων, μετά την ίδια συγχορδία περνώντας το σήμα μέσα από πέντε true bypass pedals σβηστά και ένα καλώδιο 6 μέτρων. Ο μαθητής πρέπει να ακούσει την απώλεια πρίμων και «ζωντάνιας» στη δεύτερη περίπτωση. Τέλος, ενεργοποιώ έναν buffer στην αρχή της αλυσίδας και επαναλαμβάνω το ίδιο test, για να ακουστεί η αποκατάσταση του σήματος."
