                                  - button "Διαγραφή" [ref=f1e1433]
                              - generic [ref=f1e1434]:
                                - paragraph [ref=f1e1435]: "Πέντε λεπτά παιξίματος πάνω στο καθαρό κανάλι του ενισχυτή, με τον μαθητή να παίζει μια απλή προοδευτική γραμμή σε power chords (π.χ. E5–A5–D5–G5, τέταρτα ρυθμικά, tempo γύρω στα 80 bpm), πρώτα σε χαμηλή ένταση και μετά ανεβάζοντας σταδιακά το volume του ενισχυτή μέχρι να ακουστεί το πρώτο σημάδι breakup από το ηχείο. Ο στόχος δεν είναι τεχνικός αλλά ακουστικός: να συνηθίσει το αυτί του μαθητή να διαχωρίζει το breakup του ίδιου του ηχείου (speaker breakup) από το breakup της λυχνίας που ήδη γνωρίζει από προηγούμενο μάθημα. Αυτό προετοιμάζει το έδαφος για τη θεωρία που ακολουθεί, όπου το ηχείο αντιμετωπίζεται ως ενεργό στάδιο διαμόρφωσης τόνου και όχι ως παθητικός δέκτης σήματος."
                                - button "Επέκταση με συνομιλία" [ref=f1e1438]
                            - generic [ref=f1e1439]:
                              - generic [ref=f1e1440]:
                                - button "Θεωρία" [ref=f1e1442]
