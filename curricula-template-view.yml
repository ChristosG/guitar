                        - generic [ref=f1e3055]:
                          - generic [ref=f1e3056]:
                            - paragraph [ref=f1e3057]: Ο μαθητής μαθαίνει το συμβατικό chain of command — tuner, compression, gain, modulation, time-based effects — και γιατί αυτή η σειρά υπάρχει, μαζί με τον ρόλο των buffers, του true bypass και του FX loop σε ένα αξιόπιστο pedalboard.
                            - button "Επέκταση με συνομιλία" [ref=f1e3060]
                          - generic [ref=f1e3061]:
                            - generic [ref=f1e3062]:
