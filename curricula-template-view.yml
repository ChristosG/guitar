                              - generic [ref=f1e4062]:
                                - paragraph [ref=f1e4063]: "Η συζήτηση «vintage εναντίον σύγχρονου» ταλανίζει τους κιθαρίστες εδώ και δεκαετίες, και όπως σημειώνει ο Michael Ross, και των δύο πλευρών τα επιχειρήματα έχουν βάση: η μοντέρνα τεχνολογία μπορεί να αναπαράγει πολλά από τα ηχητικά χαρακτηριστικά που κυνηγούν οι λάτρεις του vintage, αλλά συχνά «it just misses the boat». Η λέξη που ακούγεται πιο συχνά είναι «warmth», και αυτή η θαλπωρή μπορεί να ποσοτικοποιηθεί τεχνικά — equalization, μαγνητικά πεδία και καμπύλες παραμόρφωσης παίζουν ρόλο, ακόμα κι αν οι μαγικές ιδιότητες του vintage εξοπλισμού δεν είναι πλήρως κατανοητές. Στις vintage κιθάρες, το βιβλίο είναι ξεκάθαρο: τίποτα σε αυτές δεν είναι αδύνατο να αναπαραχθεί σήμερα — ελαφρύ, παλαιωμένο ξύλο, νιτροκυτταρινικό βερνίκι που αφήνει το ξύλο να «αναπνέει», χειροποίητη συναρμολόγηση. Η διαφορά είναι ότι μια vintage κιθάρα έρχεται με εγγύηση ότι δεν θα στραβώσει άλλο με τον καιρό (αν επρόκειτο να στραβώσει, θα το είχε ήδη κάνει), ενώ μια καινούρια κατασκευή δεν εγγυάται ότι θα έχει το «magic» — αυτό που κάποιοι μουσικοί αποκαλούν «speak». Το ίδιο σκεπτικό ισχύει και στους ενισχυτές: «Aging does not improve the sound», γράφει ο Ross, και πολλοί mainstream και boutique κατασκευαστές φτιάχνουν σήμερα ενισχυτές που ακούγονται εξίσου καλά με τους παλιούς — γι' αυτό οι τιμές των vintage ενισχυτών δεν έχουν εκτοξευτεί όσο των κιθαρών. Παρόλα αυτά υπάρχει ζήτηση για συγκεκριμένες μηχανές — blackface Fender (Deluxe Reverb, Twin Reverb), τα Marshall «Plexi» heads, και το Vox AC30 που παίκτες όπως ο Edge και ο Brian May ορκίζονται σε αυτό. Στα εφέ, η ιστορία είναι παρόμοια: πολλά κλασικά pedals έχουν επανεκδοθεί (Big Muff, Memory Man, Octavia, TS-9), αλλά κάποιοι υποστηρίζουν πως τα πρωτότυπα ακούγονται καλύτερα επειδή ορισμένα ηλεκτρονικά εξαρτήματα δεν κατασκευάζονται πια — και είναι διατεθειμένοι να ανεχτούν θόρυβο και αναξιοπιστία γι' αυτό το tone. Από την άλλη πλευρά, η τεχνολογία amp modeling έχει μια δική της ιστορία εξέλιξης. Ήδη στα τέλη της δεκαετίας του '90 συσκευές όπως το Roland VG-8, το Boss GT-5 και το Line 6 Axis προσπαθούσαν να αναπαράγουν την ταυτότητα ενός Fender Twin ή ενός Marshall πατώντας ένα κουμπί, χρησιμοποιώντας τεχνολογία COSM. Η εξέλιξη συνεχίστηκε: το Line 6 AxSys το 1996 ήταν το πρώτο ψηφιακό modeling amp, ακολούθησε το POD το 1998, και το 2006 έφτασε το Fractal Audio Axe-FX, το πρώτο modeler που θεωρήθηκε αρκετά καλό για επαγγελματική χρήση. Το 2011 το Kemper Profiler έφερε το «profiling» ή «capturing» — τη δυνατότητα να δημιουργείς ψηφιακό αντίγραφο του δικού σου φυσικού εξοπλισμού. Πολλοί σύγχρονοι κατασκευαστές λαμπάτων ενισχυτών ενσωματώνουν πλέον impulse responses (IRs), ψηφιακές προσομοιώσεις κασών και μικροφώνων, ώστε ο παίκτης να μπορεί να ηχογραφήσει σπίτι χωρίς φυσική κάσα. Η αντιπαράθεση tube εναντίον modeler παραμένει ζωντανή: οι λάτρεις των λαμπάτων μηχανών μιλούν για νοσταλγία και για μια «soul» που δεν αναπαράγεται, ενώ οι χρήστες modelers εκτιμούν τη φορητότητα, τη συνέπεια και την αξιοπιστία. Όπως το θέτει και η δική μας βασική πηγή θεωρίας: η τεχνολογία modeling και profiling έχει ωριμάσει αρκετά ώστε να αναπαράγει τα περισσότερα στάδια διαμόρφωσης του tone εξ ολοκλήρου σε λογισμικό, επιτρέποντας σε έναν παίκτη να κουβαλάει δεκάδες «amps» σε μία μονάδα για αθόρυβη εξάσκηση, ηχογράφηση ή ζωντανή χρήση χαμηλής έντασης — αν και πολλοί παίκτες συνεχίζουν να προτιμούν έναν πραγματικό λαμπάτο ενισχυτή και κασέτα για τον τρόπο που αλληλεπιδρούν φυσικά με ένα δωμάτιο και με το χέρι που παίζει."
