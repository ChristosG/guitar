                              - generic [ref=f1e2150]:
                                - paragraph [ref=f1e2151]: "Το πιο συχνό λάθος είναι απλά «πολύ gain». Όπως σημειώνεται σχετικά με το ζήτημα αυτό, πολλοί κιθαρίστες χρησιμοποιούν distortion για να καλύψουν κακό tone, κακό sustain ή κακή τεχνική, και το αποτέλεσμα είναι θολός ήχος που βουλιάζει μέσα σε ένα μείγμα μπάντας αντί να ξεχωρίζει· η λύση συνήθως δεν είναι περισσότερο gain αλλά καλύτερο EQ, πιο βαριά χορδή ή πιο σταθερή τεχνική. Δεύτερο λάθος: όταν κάνεις stacking, οι μαθητές συχνά ανεβάζουν το gain και στα δύο πεδάλ ταυτόχρονα, με αποτέλεσμα ένα αδιαχώριστο, πηχτό μπλοκ ήχου· η σωστή προσέγγιση είναι να κρατάς το ένα πεδάλ (συνήθως αυτό πιο κοντά στην κιθάρα) σε χαμηλό gain και να το χρησιμοποιείς σαν boost για να οδηγήσει πιο δυνατά το δεύτερο, όχι σαν δεύτερη πηγή παραμόρφωσης. Τρίτο λάθος: παίζοντας πολύφωνο υλικό (πλήρεις συγχορδίες) μέσα από βαρύ fuzz και απορώντας γιατί ακούγεται δυσαρμονικό — το fuzz είναι πιο φιλικό σε μονές νότες ή power chords, όχι σε πλούσιες συγχορδίες. Τέταρτο λάθος, πιο ιστορικό αλλά χρήσιμο να το ξέρει ο μαθητής: μπερδεύουν το «περισσότερο gain» με «καλύτερο tone» — ο θρυλικός ήχος του Eric Clapton στο Bluesbreakers δεν ήταν αποτέλεσμα κάποιου πεδάλ, αλλά ενός Les Paul μέσα σε έναν 50-watt Marshall combo παιγμένο πολύ δυνατά, ώστε ο ίδιος ο ενισχυτής να μπει φυσικά σε distortion — υπενθύμιση ότι η πηγή του gain (πεδάλ, preamp, power amp) αλλάζει τον χαρακτήρα εξίσου με την ποσότητα."
