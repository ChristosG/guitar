                                - paragraph [ref=f1e971]: "Μέχρι το επόμενο μάθημα, ο μαθητής να κρατήσει για μία εβδομάδα ένα σύντομο ημερολόγιο πρακτικής: κάθε μέρα, 10 λεπτά, να παίζει το ίδιο απλό riff ή progression με δύο διαφορετικές πένες (π.χ. μία thin και μία heavy) και να σημειώνει τι άλλαξε στο tone. Αν έχει τη δυνατότητα, να αλλάξει σετ χορδών στην κιθάρα του και να συγκρίνει προσεκτικά τον ήχο πριν και μετά, με έμφαση στη φωτεινότητα και το sustain. Τέλος, μία φορά μέσα στην εβδομάδα να κάνει 15 λεπτά πρακτική χωρίς κανένα effect ενεργό, εστιάζοντας αποκλειστικά στο πόσο authority βάζει σε κάθε νότα — θα ξέρει ότι το πέτυχε όταν μπορεί να νιώσει τη διαφορά ανάμεσα σε ένα δισταχτικό χτύπημα και ένα σίγουρο, χωρίς να αλλάξει τίποτα άλλο στο ρυθμιστικό."
