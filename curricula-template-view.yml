                                  - button "Διαγραφή" [ref=f1e3069]
                              - generic [ref=f1e3070]:
                                - paragraph [ref=f1e3071]: Πριν ανοίξουμε κουτιά και καλώδια, παίξε πέντε λεπτά καθαρό, χωρίς κανένα εφέ ενεργό — κατευθείαν κιθάρα-καλώδιο-ενισχυτής. Δούλεψε μια απλή προοδο συγχορδιών σε τέμπο περίπου 90 bpm (π.χ. Em - C - G - D, τέσσερα χτυπήματα η κάθε μία), εναλλάσσοντας ανάμεσα σε strumming και ένα απλό arpeggio με τα δάχτυλα. Ο στόχος είναι να ακούσεις πώς ακούγεται το σήμα σου στην πιο «καθαρή» του μορφή, χωρίς καμία επεξεργασία, ώστε στη συνέχεια να έχεις ένα σημείο αναφοράς όταν αρχίσουμε να προσθέτουμε pedals ένα-ένα και να ακούς τι αλλάζει η θέση τους στην αλυσίδα.
                                - button "Επέκταση με συνομιλία" [ref=f1e3074]
                            - generic [ref=f1e3075]:
                              - generic [ref=f1e3076]:
                                - button "Θεωρία" [ref=f1e3078]
