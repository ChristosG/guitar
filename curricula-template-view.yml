                              - generic [ref=f1e3341]:
                                - paragraph [ref=f1e3342]: "Το πιο συχνό λάθος είναι να μπαίνει ένα distortion ή overdrive pedal στο effects loop αντί στην κανονική είσοδο — το αποτέλεσμα είναι ένα distortion που δεν αλληλεπιδρά καθόλου με το preamp του ενισχυτή και ακούγεται επίπεδο, όχι σαν τον ενισχυτή να 'σπρώχνεται'. Η διόρθωση είναι να θυμηθούμε τη βασική αρχή: gain πριν το preamp, modulation/time μετά. Δεύτερο συχνό λάθος είναι να συνδέονται πολλά pedals σε σειρά χωρίς isolated power supply, οπότε εμφανίζεται βουητό (hum) που ο μαθητής αποδίδει λανθασμένα σε 'κακά pedals' ενώ στην πραγματικότητα είναι ground loop. Τρίτο λάθος, ιδιαίτερα σε μεγάλα boards: ξεχνούν τον buffer, οπότε μετά από 4-5 true bypass pedals και μερικά μέτρα καλωδίου το σήμα φτάνει στον ενισχυτή θαμπό και χωρίς πρίμα — ο μαθητής νομίζει ότι φταίει ο ενισχυτής ή η κιθάρα, ενώ φταίει η αλυσίδα. Τέταρτο, στο wet/dry/wet ή στο στερεοφωνικό split, πολλοί μαθητές απλώς χρησιμοποιούν ένα Y-cable χωρίς να επεξεργαστούν κανένα από τα δύο σήματα — το αποτέλεσμα δεν είναι σχεδόν καθόλου πιο 'μεγάλο' από το mono, γιατί χρειάζεται τουλάχιστον ένα από τα δύο σήματα να διαφοροποιηθεί (π.χ. με delay ή pitch modulation) για να δουλέψει το φαινόμενο."
