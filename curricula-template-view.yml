                              - generic [ref=f1e3771]:
                                - paragraph [ref=f1e3772]: "Σήμερα είδαμε ότι το tone δεν είναι μια σταθερή ρύθμιση αλλά κάτι που προσαρμόζεται στο context: live χρειάζεται περισσότερα mids για να περάσει μέσα από μπάντα και PA, ενώ studio tone μπορεί να είναι πιο ακραίο γιατί θα δουλευτεί ξεχωριστά στο μείγμα. Είδαμε επίσης πρακτικά προβλήματα του στούντιο - απομόνωση, direct recording, mic placement, monitoring - και γιατί το 'thin' tone στα monitors του control room είναι κοινό πρόβλημα και όχι προσωπική αποτυχία."
