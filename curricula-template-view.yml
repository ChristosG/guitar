                              - generic [ref=f1e1289]:
                                - paragraph [ref=f1e1290]: "Θα παίξω την ίδια απλή φράση σε τέσσερις διαφορετικές ρυθμίσεις οικογένειας (πραγματικός εναλλασσόμενος ενισχυτής ή κανάλι modeling, ό,τι έχεις διαθέσιμο) ώστε ο μαθητής να ακούσει τη διαφορά χωρίς να αλλάξει τίποτα άλλο στο παίξιμο. Η φράση: μια αργή προοδο power chords στο 6ο τάστο της χαμηλής Ε χορδής (E5) προς το 8ο τάστο (F#5) προς το 3ο τάστο (G5), και μετά μια απλή μελωδική γραμμή στις πρώτες θέσεις πάνω στη χορδή Β. Πρώτα, ρύθμιση Fender: χαμηλό gain, treble ελαφρώς ψηλά, mid χαμηλά, μεγάλο headroom — η φράση ακούγεται φωτεινή, καθαρή, με τα power chords να διατηρούν την ξεχωριστή τους ταυτότητα νότα-νότα. Δεύτερη, ρύθμιση Marshall: μέτριο-ψηλό gain, mid ανεβασμένο, treble μέτριο — τα ίδια power chords τώρα κολλάνε πιο πυκνά μεταξύ τους, με πιο φωνητικό, μεσαιοβαρύ crunch. Τρίτη, ρύθμιση Vox: μέτριο gain, treble ψηλό αλλά όχι σκληρό, με μια αίσθηση συμπίεσης στο attack — η μελωδική γραμμή στη χορδή Β αποκτά αυτό το γυάλινο, καμπάνινο χαρακτηριστικό. Τέταρτη, ρύθμιση high-gain: πολύ ψηλό gain, μπάσα σφιχτά, treble παρόν αλλά όχι σκληρό — τα power chords τώρα ακούγονται μαζικά και κορεσμένα, αλλά κάθε νότα παραμένει ευδιάκριτη, χωρίς να θολώνει. Ο μαθητής παρακολουθεί τα ίδια χέρια, τις ίδιες θέσεις, και ακούει μόνο τη μεταβολή τόνου — αυτό είναι το σημαντικό μάθημα: η οικογένεια ενισχυτή αλλάζει τον χαρακτήρα πολύ περισσότερο από ό,τι αλλάζει η εντολή σου με τα δάχτυλα."
