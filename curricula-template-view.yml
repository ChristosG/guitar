                              - generic [ref=f1e3323]:
                                - paragraph [ref=f1e3324]: "Τρεις σύντομες ασκήσεις μεταφέρουν τη θεωρία σε πράξη: πρώτα στο χαρτί, μετά σε πραγματικό εξοπλισμό αν είναι διαθέσιμος. Χαρτογράφηση προσωπικού rig (8 min) Ο μαθητής σχεδιάζει σε χαρτί το δικό του σημερινό pedalboard (ή ένα φανταστικό, αν δεν έχει ακόμα πολλά pedals) και σημειώνει: πού είναι ο buffer (αν υπάρχει), ποια pedals είναι true bypass, πού θα έμπαινε ένα isolated power supply, και ποια σειρά ακολουθεί gain → modulation → time-based. Στόχος είναι να εφαρμόσει τη λογική σειράς που έμαθε σε προηγούμενα μαθήματα μέσα σε ρεαλιστικό φυσικό layout. Δοκιμή 4CM στον διαθέσιμο ενισχυτή (10 min) Αν ο ενισχυτής της αίθουσας έχει effects loop, ο μαθητής συνδέει ένα overdrive pedal στην κανονική είσοδο και ένα modulation ή delay pedal στο loop, ελέγχοντας πρώτα τη στάθμη send/return. Παίζει το ίδιο μοτίβο με τα εφέ σε αντίστροφη διάταξη (και τα δύο μπροστά στην είσοδο) για να συγκρίνει. Ψευτο-στερεοφωνικό delay split (8 min) Χρησιμοποιώντας ένα delay pedal με ξεχωριστές εξόδους dry/effect (ή δύο εξόδους), ο μαθητής ρυθμίζει πολύ μικρό delay time και ακούει πώς αλλάζει το μέγεθος του ήχου καθώς αυξάνει σταδιακά τον χρόνο από 0 έως περίπου 40ms, όπως περιγράφεται στη μέθοδο του Ross."
