                              - generic [ref=f1e1141]:
                                - paragraph [ref=f1e1142]: "Το πιο συχνό λάθος είναι να θεωρεί ο μαθητής ότι το κουμπί Gain και το κουμπί Master Volume κάνουν το ίδιο πράγμα σε διαφορετική κλίμακα — \"και τα δύο κάνουν πιο δυνατά\". Στην πράξη το Gain καθορίζει πόσο σπάει το preamp (άρα τον χαρακτήρα του distortion ανεξάρτητα από τη συνολική ένταση), ενώ το Master Volume καθορίζει πόσο δυνατά ακούγεται στο δωμάτιο ό,τι βγαίνει από το preamp. Ο διορθωτικός τρόπος να το εξηγήσεις είναι η άσκηση Α/Β παραπάνω: ίδια ένταση δωματίου, εντελώς διαφορετικός χαρακτήρας. Δεύτερο συχνό λάθος: ο μαθητής ανεβάζει το Gain στο τέρμα νομίζοντας ότι έτσι παίρνει \"καλύτερο\" ή \"πιο σοβαρό\" rock tone. Στην ιστορία το αντίθετο συχνά ίσχυε — κλασικοί ήχοι σαν του Clapton στο Bluesbreakers βγήκαν όχι από ένα preamp γεμάτο gain αλλά από το να σπρώξεις όλο τον ενισχυτή, με τον power amp να κάνει τη δουλειά. Πολύ gain στο preamp συχνά \"θολώνει\" τον ήχο και τον κάνει λιγότερο δυναμικό στο χτύπημα. Τρίτο λάθος: να αντιμετωπίζει κανείς τα watts σαν να είναι ευθέως ανάλογα με το πόσο \"καλός\" ή \"δυνατός\" είναι ένας ενισχυτής. Τα watts σχετίζονται κυρίως με το headroom — πόσο δυνατά μπορεί να παίξει ο ενισχυτής πριν αρχίσει να distort — και όχι τόσο με την απόλυτη αντιληπτή ένταση, ειδικά ανάμεσα σε δύο λυχνιακούς ενισχυτές διαφορετικού wattage. Τέταρτο λάθος: να χειρίζεται κανείς τον tone stack σαν τρία ανεξάρτητα φίλτρα. Επειδή τα Bass/Middle/Treble αλληλεπιδρούν στο κύκλωμα, το να ανεβάσεις το Middle μπορεί να αλλάξει και το πώς ακούγονται τα άλλα δύο — γι' αυτό η ρύθμιση ενός ενισχυτή είναι πάντα μια διαδικασία δοκιμής, όχι στοίχιση αριθμών."
