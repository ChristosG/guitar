                              - generic [ref=f1e2608]:
                                - paragraph [ref=f1e2609]: "Ανοίξτε τη συζήτηση ρωτώντας τον μαθητή να εξηγήσει με δικά του λόγια τη βασική διαφορά ανάμεσα σε chorus και pitch effect, πριν προχωρήσετε στις πιο τεχνικές ερωτήσεις για harmonizer modes και εφαρμογές. Q: Ποια είναι η βασική διαφορά στον τρόπο που ένα chorus και ένα pitch-shifter/harmonizer παράγουν τη δεύτερη φωνή; A: Το chorus χρησιμοποιεί LFO που συνεχώς μεταβάλλει μια μικρή καθυστέρηση, κάνοντας τη φωνή να ταλαντεύεται πάνω-κάτω στο ύψος. Το pitch-shifter/harmonizer παράγει μια φωνή σε σταθερό, ακριβές διάστημα χωρίς καμία ταλάντωση. Q: Ποια είναι η διαφορά ανάμεσα σε 'dumb' και 'smart' harmonizer; A: Ο 'dumb' harmonizer προσθέτει πάντα το ίδιο σταθερό διάστημα ανεξάρτητα από την τονικότητα του κομματιού. Ο 'smart' harmonizer είναι προγραμματισμένος με την κλίμακα/τονικότητα και προσαρμόζει αυτόματα το διάστημα ώστε η προστιθέμενη νότα να παραμένει διατονική. Q: Γιατί ένας κιθαρίστας country θα προτιμούσε pitch shifting αντί για chorus για να παχύνει έναν καθαρό ήχο, σύμφωνα με τον Michael Ross; A: Γιατί το pitch shifting παχαίνει τον ήχο χωρίς το χαρακτηριστικό 'wavering' του chorus, διατηρώντας μεγαλύτερη ευκρίνεια/definition — λιγότερο lush από chorus ή flanging, αλλά πιο καθαρό."
