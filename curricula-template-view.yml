                                - paragraph [ref=f1e993]: "Κλείνουμε με 10 λεπτά συζήτησης, κρατώντας αυτή τη σελίδα μπροστά μας για να ελέγξουμε τις απαντήσεις του μαθητή. Q: Γιατί μια χοντρή (heavy) πένα δίνει πιο σκοτεινό ήχο από μια λεπτή (thin) πένα, ακόμα και στην ίδια κιθάρα; A: Επειδή το πάχος της πένας αλλάζει τον τρόπο που αφήνει τη χορδή μετά το χτύπημα — μια λεπτή πένα λυγίζει περισσότερο και αφήνει τη χορδή πιο γρήγορα, δίνοντας πιο φωτεινό, πιο λεπτό attack, ενώ μια χοντρή πένα δεν λυγίζει το ίδιο και μεταφέρει περισσότερη ενέργεια πιο απότομα, δίνοντας πιο παχύ και σκοτεινό τόνο. Q: Ο πελάτης στην ιστορία του Ross έπαιζε .008 χορδές νομίζοντας ότι θα ακουστεί σαν τον Stevie Ray Vaughan. Ποιο ήταν το πρόβλημα; A: Ο Vaughan έπαιζε με πολύ πιο χοντρές χορδές, .013's, που δίνουν πολύ πιο γεμάτο, βαρύ ήχο και περισσότερο sustain από τις πολύ λεπτές .008's — η διαφορά στο gauge των χορδών ήταν μεγαλύτερη αιτία ήχου από τον ίδιο τον εξοπλισμό. Q: Τι εννοεί ο Ross με τον όρο Authority όταν μιλάει για το άγγιγμα του παίκτη; A: Δεν εννοεί απαραίτητα δυνατό χτύπημα, αλλά δέσμευση και σιγουριά σε κάθε νότα — να παίζεις σαν να το εννοείς, ακόμα κι αν κάνεις λάθος, αντί να παίζεις διστακτικά. Q: Γιατί λέμε ότι tone is in the hands και όχι μόνο στο gear; A: Επειδή το attack της πένας, το vibrato των δακτύλων, το palm muting και τα dynamics αλλάζουν τον ήχο περισσότερο από σχεδόν κάθε pedal ή ρύθμιση ενισχυτή· δύο παίκτες με το ίδιο rig θα ακουστούν διαφορετικά, και ο ίδιος παίκτης θα ακουστεί διαφορετικά από βράδυ σε βράδυ ανάλογα με το άγγιγμα."
