                              - generic [ref=f1e2329]:
                                - paragraph [ref=f1e2330]: "Οι παρακάτω ασκήσεις γίνονται πάνω στην ίδια αρμονική βάση από τη demonstration, ώστε ο μαθητής να συγκρίνει άμεσα τα εφέ αντί να τα μαθαίνει μεμονωμένα. Chorus εναντίον mild Flanger (A/B) (5 min) Παίξε την ίδια συγχορδία πρώτα με chorus σε μέτριο rate/depth, μετά με flanger με πολύ χαμηλό regeneration. Σημείωσε πού μοιάζουν και πού διαφέρουν στο αυτί. Ακραίες ρυθμίσεις depth/rate (5 min) Ανέβασε το depth στο μέγιστο σε chorus και flanger μέχρι το σημείο που η νότα αρχίζει να ακούγεται εμφανώς παράφωνη. Βρες το όριο όπου το πλούσιο άκουσμα γίνεται δυσάρεστο. Flanger εναντίον Phaser (5 min) Πάνω στην ίδια power chord, εναλλάσσεσαι ανάμεσα σε flanger και phaser χωρίς να κοιτάς τα πεντάλ. Στόχος: να αναγνωρίζεις ποιο είναι ποιο μόνο από τον ήχο. Tremolo σε tempo (5 min) Ρύθμισε το rate του tremolo ώστε να ταιριάζει ακριβώς με το τέμπο του κομματιού που παίζεις (χρησιμοποίησε tap tempo αν υπάρχει). Δοκίμασε αργό wobble και γρήγορο stutter. Rotary swirl σε sustained νότα (5 min) Κράτησε μια νότα με bend ή vibrato δαχτύλου πάνω σε rotary/Leslie simulation και άκου πώς το Doppler αποτέλεσμα αλλάζει καθώς αυξάνεις την ταχύτητα περιστροφής."
