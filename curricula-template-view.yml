                              - generic [ref=f1e1128]:
                                - paragraph [ref=f1e1129]: "Οι ασκήσεις εδώ δεν αφορούν τεχνική στο instrument αλλά εκπαίδευση αυτιού και χεριού στα κουμπιά του ενισχυτή — ο μαθητής πρέπει να μπορεί να ξεχωρίσει preamp distortion από power amp distortion με το αυτί, όχι μόνο θεωρητικά. Α/Β σύγκριση gain staging (8 min) Στον ενισχυτή της τάξης, ο μαθητής παίζει το ίδιο riff με τις δύο ρυθμίσεις του Περάσματος 1 και 2 από την επίδειξη, αλλάζοντας μόνο preamp gain / master volume ώστε η συνολική ένταση να μένει σταθερή. Ζήτα του να γράψει σε δύο-τρεις λέξεις τη διαφορά που ακούει σε κάθε ρύθμιση. Χαρτογράφηση του tone stack (6 min) Με το Gain σταθερό σε μια μέτρια ρύθμιση, ο μαθητής γυρίζει πρώτα μόνο το Middle από 0 σε 10 παίζοντας συνεχόμενα, μετά μόνο το Treble, μετά μόνο το Bass, περιγράφοντας φωναχτά τι αλλάζει κάθε φορά, συμπεριλαμβανομένου του πώς αλλάζει η αντίληψη του ίδιου του distortion. Εντοπισμός σταδίου με το αυτί (5 min) Παίξε στον μαθητή (από ηχείο ή βίντεο) δύο σύντομα κλιπ γνωστών ήχων: ένα με έντονο preamp/high-gain χαρακτήρα (π.χ. σύγχρονο high-gain rhythm tone) και ένα με χαρακτήρα power-amp/tube breakup (π.χ. cranked combo blues-rock τόνος). Ζήτα του να μαντέψει ποιο στάδιο κυριαρχεί και να αιτιολογήσει γιατί."
