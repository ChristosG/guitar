                              - generic [ref=f1e2395]:
                                - paragraph [ref=f1e2396]: "Μέχρι το επόμενο μάθημα, άκουσε προσεκτικά τρία ηχητικά παραδείγματα: «Walkin' On The Moon» των Police για το flanger-ως-chorus του Andy Summers, ένα κομμάτι του πρώτου δίσκου των Van Halen για το brown sound με flanger, και οποιοδήποτε live ηχογράφημα του Stevie Ray Vaughan όπου χρησιμοποιεί περιστρεφόμενο Leslie cabinet. Σε κάθε ένα, γράψε σε ένα τετράδιο τι ακριβώς διαμορφώνεται (delay, φάση, ένταση, ή συνδυασμός). Στο σπίτι, πέρασε 15 λεπτά τη μέρα δοκιμάζοντας rate/depth στο δικό σου πεντάλ πάνω σε καθαρό και σε ελαφρώς driven ήχο, και σημείωσε ποιες ρυθμίσεις σου αρέσουν περισσότερο για ρυθμικό παίξιμο έναντι solo. Θα ξέρεις ότι το «έπιασες» όταν μπορείς να αναγνωρίσεις με κλειστά μάτια αν κάποιος χρησιμοποιεί chorus, flanger, ή phaser μόνο ακούγοντας."
