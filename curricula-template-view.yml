                          - generic [ref=f1e1835]:
                            - paragraph [ref=f1e1836]: Ο μαθητής μαθαίνει πώς λειτουργεί πραγματικά ένας compressor —όχι ως μαγικό κουτί για «περισσότερο sustain», αλλά ως αυτόματο volume pedal που εξομαλύνει τη δυναμική του παιξίματος. Θα ακούσει τη διαφορά ανάμεσα σε πραγματικό και «apparent» sustain και θα μάθει πού μπαίνει ο compressor στην αλυσίδα σήματος και γιατί.
