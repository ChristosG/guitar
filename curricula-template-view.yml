                              - generic [ref=f1e2106]:
                                - paragraph [ref=f1e2107]: "Θα παίξω το ίδιο riff τεσσάρων μέτρων σε Am — power chords στο πέμπτο τάστο — τρεις φορές, αλλάζοντας μόνο το gain effect μπροστά από έναν καθαρό ενισχυτή. Πρώτα με ένα overdrive (τύπου Tube Screamer): πρόσεξε πώς όταν χαμηλώνω το volume knob της κιθάρας στη μέση, ο ήχος καθαρίζει σχεδόν σαν να ξαναγύρισα σε clean channel — αυτή είναι η ευαισθησία στο άγγιγμα που συζητήσαμε. Μετά με ένα distortion (τύπου Rat ή DS-1): το ίδιο roll-off δεν καθαρίζει το ίδιο· ο ήχος παραμένει πιο συμπιεσμένος και συμπαγής ό,τι κι αν κάνω με το χέρι μου. Τέλος με ένα fuzz (τύπου Fuzz Face ή Big Muff): εδώ θα παίξω μόνο μονές νότες αντί για συγχορδίες, γιατί το fuzz παράγει δυσαρμονίες πάνω σε πολύφωνο υλικό — θα ακούσεις πόσο πηχτή και σχεδόν σπασμένη γίνεται η υφή σε μια απλή νότα. Μετά θα δείξω stacking: βάζω ένα χαμηλού gain overdrive πρώτο στη σειρά, με τη ρύθμιση gain του χαμηλή αλλά με το volume/output ανεβασμένο, και μετά ένα distortion δεύτερο στη σειρά με το gain του πιο μέτριο. Θα ενεργοποιήσω μόνο το distortion πρώτα ώστε ν' ακούσεις το βασικό του ηχόχρωμα, και μετά θα ενεργοποιήσω και το overdrive από πάνω — άκου πώς το πρώτο πεδάλ δεν προσθέτει απλώς «περισσότερο gain» αλλά αλλάζει τον χαρακτήρα του clipping του δεύτερου, δίνοντας πιο πυκνή μέση περιοχή και πιο έντονο sustain χωρίς να γίνεται θολό."
