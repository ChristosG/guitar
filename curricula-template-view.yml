                              - generic [ref=f1e878]:
                                - paragraph [ref=f1e879]: "Ο δάσκαλος παίζει πρώτα ένα απλό power chord riff σε E5 (fret 0 στη χαμηλή Ε και fret 2 στη Α) σε τρία διαφορετικά περάσματα — πρώτα με thin πένα, μετά medium, μετά heavy — μένοντας ακριβώς στην ίδια θέση του δεξιού χεριού και στην ίδια ένταση χτυπήματος, ώστε η μόνη μεταβλητή να είναι το πάχος της πένας. Ο μαθητής καλείται να περιγράψει τι ακούει σε κάθε περίπτωση: λαμπερότητα, σκοτεινιά, δύναμη attack. Στη συνέχεια ο δάσκαλος κρατά σταθερή την ίδια πένα (medium) και παίζει το ίδιο riff μετακινώντας το δεξί χέρι: πρώτα πολύ κοντά στη γέφυρα, μετά στο μέσο του σώματος, και τέλος κοντά στο λαιμό — δείχνοντας πώς μόνο η θέση παιξίματος αλλάζει τον χαρακτήρα από μεταλλικό και σφιχτό σε ζεστό και στρογγυλό, χωρίς καμία αλλαγή στα ρυθμιστικά της κιθάρας. Τέλος, ο δάσκαλος παίζει μια απλή μελωδική φράση σε open position (C - Am - F - G) πρώτα με authority — γεμάτο, σίγουρο χτύπημα, όπως το περιγράφει ο Ross — και μετά με διστακτικό, τιμωρημένο παίξιμο. Η διαφορά στο αποτέλεσμα, ενώ η κιθάρα, ο ενισχυτής και η πένα παραμένουν ίδια, είναι η ουσία του μαθήματος."
