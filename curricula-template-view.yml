                              - generic [ref=f1e3271]:
                                - paragraph [ref=f1e3272]: "Ένα 'rig' δεν είναι απλώς μια λίστα από καλά pedals· είναι ολόκληρη η αλυσίδα σήματος που ο παίκτης εμπιστεύεται στη σκηνή, και ο σχεδιασμός του είναι δική του δεξιότητα, ξεχωριστή από την επιλογή καλού εξοπλισμού. Ξεκινάμε από το pedalboard: η φυσική και ηλεκτρική διάταξη έχει δύο πλευρές. Η πρώτη είναι η τροφοδοσία — χρειαζόμαστε isolated power supply, ώστε κάθε pedal να παίρνει το δικό του απομονωμένο κύκλωμα τροφοδοσίας και να αποφεύγονται τα ground loops, εκείνο το χαμηλόσυχνο βουητό που εμφανίζεται όταν πολλά pedals μοιράζονται την ίδια γείωση. Η δεύτερη είναι η σειρά σήματος και η δρομολόγηση καλωδίων, ώστε το board να είναι αξιόπιστο ακόμη και σε σκοτεινή σκηνή, χωρίς να χρειάζεται ο παίκτης να ψάχνει ποιο pedal είναι ποιο. Ξαναγυρνάμε στη διάκριση true bypass εναντίον buffered bypass, γιατί εδώ κρίνεται η ζωντάνια του ήχου σε μεγάλα boards. Ένα true bypass pedal, όταν είναι σβηστό, βγαίνει εντελώς έξω από το κύκλωμα — καμία χρωματική αλλοίωση, αλλά και καμία ενίσχυση. Το πρόβλημα είναι ότι το παθητικό σήμα μιας κιθάρας υποβαθμίζεται όταν περνά μέσα από πολλά μέτρα καλωδίου και πολλά true bypass pedals σε σειρά — χάνει πρίμα και δυναμική, φαινόμενο γνωστό ως 'tone-suck'. Ο buffer λύνει αυτό το πρόβλημα αποκαθιστώντας τη στάθμη υψηλών συχνοτήτων του σήματος. Σε μεγάλα boards συνήθως τοποθετούμε έναν buffer στην αρχή της αλυσίδας (συχνά μέσα σε compressor ή tuner pedal) και ενδεχομένως έναν δεύτερο πριν από μεγάλα μήκη καλωδίου προς τον ενισχυτή. Ο επόμενος πυλώνας είναι η στερεοφωνία, και συγκεκριμένα η τεχνική 'wet/dry/wet'. Εδώ το σήμα χωρίζεται σε έναν κεντρικό, 'dry' (χωρίς εφέ) ενισχυτή, και δύο 'wet' ενισχυτές που παίρνουν μόνο τα χρονικά και διαμορφωτικά εφέ, panned αριστερά και δεξιά. Το αποτέλεσμα είναι ένα τεράστιο στερεοφωνικό πλάτος στη σκηνή, χωρίς όμως να 'λερώνεται' ο βασικός, dry ήχος. Η λογική εδώ συνδέεται με κάτι που είχαμε δει ήδη στο κεφάλαιο για τα modulation και time effects: όταν το delay ή το chorus μπαίνουν τελευταία στην αλυσίδα, πριν τη διχάλα προς τους ενισχυτές, το wet σήμα μένει καθαρό και ξεχωριστό από το dry, και το αυτί το αντιλαμβάνεται σαν δύο κιθάρες που παίζουν μαζί αντί για μία θολή. Στη βιβλιογραφία του Michael Ross βρίσκουμε την πρακτική πλευρά αυτής της ιδέας: 'ONCE YOU HAVE HEARD YOUR GUITAR IN STEREO, IT IS HARD TO GO BACK TO MONO' — μια προειδοποίηση ότι η στερεοφωνία σημαίνει μεταφορά δύο ή και τριών ενισχυτών, δηλαδή περισσότερο κόπο και κόστος. Ο Ross περιγράφει έναν απλό τρόπο να δημιουργήσουμε στερεοφωνικό εντύπωμα με ένα μόνο delay unit που έχει ξεχωριστές εξόδους 'direct' και 'effect': βάζουμε τη μία έξοδο σε έναν ενισχυτή και τη delayed-only έξοδο σε άλλον, με πολύ μικρό delay time (10-50ms), και ξαφνικά η κιθάρα ακούγεται πολύ πιο μεγάλη — 'It takes only a very short delay time to make your guitar sound huge.' Περνάμε τώρα στο 'four-cable method' (4CM), τη μέθοδο που επιτρέπει να συνδυάσουμε ταυτόχρονα την είσοδο εμπρός στον ενισχυτή (front-of-amp input) και το effects loop ενός πολυκάναλου ενισχυτή με ένα pedalboard ή έναν πολυ-επεξεργαστή. Η λογική πίσω από το 4CM είναι ακριβώς αυτή που περιγράφεται στο Module 9: κάθε εφέ πρέπει να κάθεται στη θέση —πριν ή μετά το preamp του ενισχυτή— όπου ακούγεται καλύτερα. Τα gain-stage pedals (drive, distortion) μπαίνουν στην κανονική είσοδο του ενισχυτή, ώστε να αλληλεπιδρούν με το ίδιο το preamp distortion του ενισχυτή, ενώ τα modulation και time-based effects μπαίνουν στο effects loop, μετά το preamp αλλά πριν την power section, ώστε να μη θολώνουν πάνω σε ένα ήδη κορεσμένο, distorted σήμα. Αυτή η ρύθμιση είναι ιδιαίτερα συνηθισμένη σε σύγχρονους high-gain ενισχυτές και σε πολυ-επεξεργαστές. Ο Michael Ross περιγράφει την ίδια λογική πρακτικά: αν ο ενισχυτής έχει effects loop, το distortion stage του βρίσκεται συνήθως πριν το loop, οπότε τρέχουμε το 'send' προς τα εφέ και επιστρέφουμε στο 'return', προσέχοντας να ταιριάζουν οι στάθμες σήματος (instrument level εναντίον line level) ώστε να μη χάνουμε τόνο ή να προκαλούμε παραμόρφωση. Τέλος, αξίζει να αναφέρουμε τα προηγμένα συστήματα μεταγωγής (switching systems) που περιγράφει ο Ross: από τη δεκαετία του '80, κατασκευαστές όπως ο Bob Bradshaw και ο Pete Cornish έφτιαχναν συστήματα που επέτρεπαν σε καλλιτέχνες όπως ο Andy Summers, ο Dave Gilmour και ο Eddie Van Halen να καλούν προκαθορισμένους συνδυασμούς εφέ πατώντας ένα μόνο κουμπί. Το MIDI έφερε αυτή τη δυνατότητα και στον απλό παίκτη, επιτρέποντας προγραμματιζόμενα delays και preamps να αλλάζουν ήχο ταυτόχρονα. Σήμερα, πολλοί παίκτες συνδυάζουν αγαπημένα stomp boxes με ψηφιακά συστήματα μεταγωγής που τα βγάζουν εντελώς από το κύκλωμα όταν δεν χρησιμοποιούνται — προστατεύοντας έτσι τον τόνο από περιττή υποβάθμιση."
