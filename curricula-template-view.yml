                                - paragraph [ref=f1e3990]: Μέχρι το επόμενο μάθημα, πάρε τρία κομμάτια αναφοράς — ένα blues/classic rock, ένα metal, ένα funk ή country — και προσπάθησε να τα "ταιριάξεις" με το δικό σου amp EQ, κρατώντας σημειώσεις των ρυθμίσεων (bass/mid/treble ή Hz αν έχεις graphic EQ) που χρησιμοποίησες για κάθε κομμάτι. Παίξε πάνω σε κάθε backing track τουλάχιστον 10 λεπτά, εστιάζοντας στο αν το EQ σου βοηθά τη φράση σου να ξεχωρίζει ή τη θάβει. Θα ξέρεις ότι το πέτυχες όταν μπορείς να εναλλάσσεσαι ανάμεσα στις τρεις ρυθμίσεις με τα μάτια κλειστά και να αναγνωρίζεις αμέσως ποια είναι ποια, μόνο από το άκουσμα.
