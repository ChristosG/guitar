                                - paragraph [ref=f1e289]: Παίρνω δύο κιθάρες διαφορετικού τύπου κατασκευής —ιδανικά μια solid-body (π.χ. Telecaster-style) και μια semi-hollow (π.χ. ES-335-style)— και παίζω την ίδια ακριβώς φράση σε κάθε μία, πρώτα ξεβυσμένη και μετά μέσα από τον ίδιο καθαρό ήχο στον ενισχυτή, σε πολύ χαμηλή ένταση ώστε να ακούγεται η φυσική αντήχηση κι όχι η ενίσχυση. Παίζω μια απλή ανοιχτή συγχορδία E major, την αφήνω να ηχήσει ελεύθερα για τέσσερα με πέντε δευτερόλεπτα, και μετά μια μεμονωμένη νότα στην έκτη χορδή στο ανοιχτό τάστο. Ο μαθητής ακούει πρώτα το ξεβυσμένο κομμάτι κάθε οργάνου, εντοπίζοντας πόσο πιο «αέρινη» και παρατεταμένη είναι η αντήχηση στο semi-hollow σε σχέση με το πιο «στεγνό», συγκρατημένο sustain του solid-body. Μετά επαναλαμβάνω το ίδιο μέσα από τον ενισχυτή, δείχνοντας πώς αυτή η διαφορά περνάει —πιο διακριτικά αλλά υπαρκτά— και στον ηλεκτρικό ήχο. Αν έχω διαθέσιμο ένα βαρύτερο σώμα (π.χ. mahogany) δίπλα σε ένα ελαφρύτερο (alder), επαναλαμβάνω τη δοκιμή δείχνοντας πώς το πρώτο ακούγεται πιο γεμάτο σε χαμηλή ένταση αλλά πιο συμπυκνωμένο («θολό») όταν ανεβάζω ένταση, ενώ το δεύτερο μένει καθαρό.
