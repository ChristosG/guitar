                                - paragraph [ref=f1e1181]: Μέχρι το επόμενο μάθημα, ο μαθητής να περάσει 15-20 λεπτά, δύο-τρεις φορές, στον δικό του ενισχυτή (ή σε amp sim/modeler αν δεν έχει λυχνιακό) δοκιμάζοντας το ίδιο Α/Β πείραμα gain staging που κάναμε στην τάξη, αλλά σε δικά του riffs. Ζήτα του να κρατήσει σημειώσεις (ή ηχογράφηση με το κινητό) τριών διαφορετικών συνδυασμών Gain/Master που δίνουν την ίδια ένταση δωματίου αλλά διαφορετικό χαρακτήρα, και να φέρει την αγαπημένη του ρύθμιση στο επόμενο μάθημα για να τη συζητήσουμε. Ξέρει ότι το πέτυχε αν μπορεί να εξηγήσει, χωρίς να κοιτάξει τα κουμπιά, ποια ρύθμιση δίνει πιο preamp-heavy χαρακτήρα και ποια πιο power-amp-heavy.
