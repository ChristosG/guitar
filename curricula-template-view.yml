                              - generic [ref=f1e788]:
                                - paragraph [ref=f1e789]: "Κλείνουμε με δέκα λεπτά συζήτησης, κρατώντας αυτό το φύλλο μπροστά μου για να ελέγχω τις απαντήσεις. Q: Γιατί ένα single coil pickup κάνει hum ενώ ένας humbucker όχι; A: Το single coil έχει ένα μόνο πηνίο που λειτουργεί σαν κεραία και πιάνει ηλεκτρομαγνητικές παρεμβολές (π.χ. 60-cycle hum). Ο humbucker έχει δύο πηνία reverse-wound και reverse-polarity· ο θόρυβος από τα δύο πηνία ακυρώνεται μεταξύ τους, ενώ το σήμα της χορδής όχι. Q: Αν ενεργοποιήσω coil-split σε έναν humbucker, τι κερδίζω και τι χάνω; A: Κερδίζω έναν πιο φωτεινό, λεπτότερο ήχο πιο κοντά σε single coil. Χάνω την ακύρωση θορύβου, δηλαδή επιστρέφει ο hum, γιατί μένει ενεργό μόνο ένα πηνίο. Q: Ποια είναι η διαφορά ανάμεσα σε series και parallel σύνδεση δύο πηνίων ενός humbucker; A: Σε series (η κανονική σύνδεση) το output είναι μεγαλύτερο και ο ήχος πιο χοντρός. Σε parallel το output μειώνεται σχεδόν σε επίπεδο single coil και ο ήχος γίνεται πιο φωτεινός, αλλά και οι δύο συνδέσεις διατηρούν την ακύρωση του hum. Q: Γιατί το ίδιο pickup ακούγεται διαφορετικά στη θέση bridge σε σχέση με τη θέση neck; A: Επειδή η θέση πάνω στη χορδή καθορίζει τι μέρος του κύματος της δόνησης «μαζεύει» το pickup· κοντά στο bridge η χορδή δονείται πιο γρήγορα/λεπτά (φωτεινός ήχος), κοντά στο λαιμό πιο αργά/πλατιά (ζεστός, γεμάτος ήχος) — ανεξάρτητα από τον τύπο pickup."
