                              - generic [ref=f1e1481]:
                                - paragraph [ref=f1e1482]: "Ο δάσκαλος παίζει το ίδιο riff (μια απλή pentatonic φράση στο La ελάσσονα, γύρω στα 90 bpm) μέσα από δύο διαφορετικά cabinets αν είναι διαθέσιμα στο studio — π.χ. ένα 1x12 combo με Celestion-style ηχείο έναντι ενός 4x12 — ώστε ο μαθητής να ακούσει άμεσα τη διαφορά σε όγκο και σφιχτότητα μπάσων, χωρίς καμία αλλαγή στον ενισχυτή. Αν υπάρχει διαθέσιμο μόνο ένα cabinet, ο δάσκαλος δείχνει την ίδια αρχή με ένα μικρόφωνο σε μικρό interface: παίζει το riff με το μικρόφωνο στραμμένο ακριβώς στο κέντρο του κώνου (on-axis), μετά το μετατοπίζει προς την άκρη περίπου 3-4 εκατοστά (off-axis) και παίζει ξανά την ίδια φράση, ζητώντας από τον μαθητή να περιγράψει τι άλλαξε στο ηχόχρωμα. Τέλος, ο δάσκαλος δείχνει πρακτικά πάνω σε ένα φύλλο χαρτί πώς υπολογίζεται η συνολική αντίσταση δύο ηχείων των 8 ohms σε παράλληλη σύνδεση (4 ohms) και σε σειρά (16 ohms), συνδέοντας το με το ρίσκο του mismatch που περιγράφηκε στη θεωρία."
