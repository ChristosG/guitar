                                - paragraph [ref=f1e4163]: "Κλείσαμε το course εκεί που το ξεκινήσαμε: το tone δεν είναι μόνο εξοπλισμός, είναι μια αλυσίδα αποφάσεων — και η τελευταία απόφαση, vintage ή modeling, είναι απλώς ακόμα ένας κρίκος σε αυτή την αλυσίδα, όχι το τέλος της ιστορίας. Είδαμε ότι το vintage gear προσφέρει «magic» που δύσκολα ποσοτικοποιείται πλήρως αλλά μπορεί να προσεγγιστεί με προσοχή στο EQ, στα μαγνητικά πεδία και στις καμπύλες παραμόρφωσης, ενώ η σύγχρονη τεχνολογία modeling και profiling έχει ωριμάσει αρκετά ώστε να καλύπτει τα περισσότερα σενάρια πρακτικής, ηχογράφησης και ζωντανής χρήσης χαμηλής έντασης. Και πάνω απ' όλα, ξαναθυμηθήκαμε ότι κανένα rig, vintage ή modeled, δεν αντικαθιστά το touch — αυτό παραμένει το πιο σημαντικό «gear» που έχει κάθε κιθαρίστας."
