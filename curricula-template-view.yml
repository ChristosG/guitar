                              - generic [ref=f1e592]:
                                - paragraph [ref=f1e593]: "Ανοίγουμε τη συζήτηση με τέσσερις ερωτήσεις κατανόησης, κρατώντας τις σημειώσεις μας μπροστά για να ελέγξουμε τις απαντήσεις σε πραγματικό χρόνο. Q: Γιατί ένα καλά κομμένο nut είναι πιο σημαντικό από το υλικό του (bone έναντι brass έναντι graphite); A: Γιατί το υλικό επηρεάζει τον ήχο μόνο οριακά και μόνο στις ανοιχτές χορδές· ένα κακά κομμένο nut όμως κάνει τις χορδές να πιάνονται ή να κουνιούνται, χαλώντας το κούρδισμα και το sustain ανεξάρτητα από το υλικό. Q: Ο λαιμός μιας κιθάρας έχει ελαφριά κοιλότητα (slight bow). Είναι πάντα πρόβλημα που πρέπει να διορθωθεί; A: Όχι. Πολλοί λαιμοί χρειάζονται μια μικρή κοιλότητα για να παίζουν σωστά χωρίς buzz. Το κριτήριο δεν είναι αν ο λαιμός φαίνεται απόλυτα ίσιος, αλλά αν παίζει άνετα γύρω από το 5ο-9ο τάστο. Q: Ποια είναι η διαφορά ανάμεσα σε bowed και backbowed λαιμό, και πώς διορθώνεται η καθεμία; A: Bowed (υπερβολική κοιλότητα προς τα εμπρός) κάνει το action να νιώθεται ψηλά στο μέσο του λαιμού και διορθώνεται σφίγγοντας το truss rod. Backbowed (αντίστροφη κύρτωση) προκαλεί buzz ή fret-out στην ίδια περιοχή και διορθώνεται χαλαρώνοντας το truss rod. Q: Γιατί τα ψηλά τάστα απαιτούν πιο ελαφρύ άγγιγμα από τα χαμηλά τάστα; A: Επειδή σε ψηλά τάστα η χορδή φτάνει στο σωστό τόνο μόλις ακουμπήσει σταθερά το τάστο· επιπλέον πίεση απλώς τεντώνει τη χορδή περισσότερο και την ανεβάζει (sharp), κάτι που είναι ιδιαίτερα εμφανές σε συγχορδίες με ανομοιόμορφη πίεση δαχτύλων."
