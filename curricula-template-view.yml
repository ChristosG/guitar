                              - generic [ref=f1e1386]:
                                - paragraph [ref=f1e1387]: "Άνοιξε το 10λεπτο block συζήτησης ζητώντας από τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά ανάμεσα σε scooped-mid και present-mid χαρακτήρα, και γιατί αυτό επηρεάζει πού κάθεται μια κιθάρα μέσα σε μια μπάντα. Στη συνέχεια χρησιμοποίησε τις παρακάτω ερωτήσεις για να ελέγξεις κατανόηση. Q: Ποια οικογένεια ενισχυτή σχετίζεται με τον όρο scooped-mid και γιατί αυτό τη βοηθάει να δουλεύει καλά με pedals μπροστά της; A: Η Fender. Έχει μεγάλο clean headroom και scooped mid, οπότε αφήνει το gain-shaping να γίνεται από τα pedals χωρίς ο ίδιος ο ενισχυτής να προσθέτει δικό του χαρακτήρα distortion. Q: Ποιο ιστορικό μοντέλο Marshall θεωρείται η βάση πάνω στην οποία χτίστηκε το πρώτο Marshall amp, και ποιος παίκτης όρισε το κλασικό crunch ήχο του Marshall combo το 1966; A: Το πρώτο Marshall, το JTM45, βασίστηκε στο σχέδιο του Fender Bassman. Ο ήχος ορίστηκε από τον Eric Clapton, που έπαιξε Les Paul μέσα από 50-watt Marshall combo στο άλμπουμ των Bluesbreakers. Q: Τι σημαίνει cascading gain και ποια οικογένεια ενισχυτών το χρησιμοποιεί ως βασική φιλοσοφία σχεδίασης; A: Πολλαπλά διαδοχικά στάδια preamp gain που ξεχειλίζουν το ένα μέσα στο άλλο για να παράγουν πολύ περισσότερο distortion από ένα μονό στάδιο· είναι η βασική φιλοσοφία της high-gain οικογένειας, που ξεκίνησε με τη Mesa/Boogie. Q: Ποιο χαρακτηριστικό της βαθμίδας ισχύος κάνει το Vox AC30 να ακούγεται διαφορετικά από μια Fender Twin στην ίδια ένταση; A: Το class-A power section του AC30, που δίνει μια πιο συμπιεσμένη, chimey συμπεριφορά και σπάει νωρίτερα σε σχέση με το μεγαλύτερο headroom της Fender Twin."
