                              - generic [ref=f1e2067]:
                                - paragraph [ref=f1e2068]: "Πριν αγγίξουμε κανένα πεδάλ, παίξε πέντε λεπτά καθαρό ήχο (clean channel, gain στο μηδέν) πάνω σε μια απλή power chord προοδευτικότητα σε E — E5, G5, A5 — με το προηγούμενο μάθημα στο μυαλό: πρόσεξε πώς ακούγεται η δυναμική σου χωρίς κανένα compressor να την εξομαλύνει. Χτύπα μια φορά δυνατά, μια φορά απαλά, άκου τη διαφορά στην ένταση και στο attack. Αυτό το καθαρό σημείο αναφοράς είναι το «πριν» που θα συγκρίνουμε σε λίγο με το «μετά» όταν μπει gain στη μέση — γιατί η ουσία του σημερινού μαθήματος είναι να ακούς τι ακριβώς αλλάζει το κάθε επίπεδο gain πάνω σε αυτή την ίδια δυναμική."
                                - button "Επέκταση με συνομιλία" [ref=f1e2071]
                            - generic [ref=f1e2072]:
                              - generic [ref=f1e2073]:
                                - button "Θεωρία" [ref=f1e2075]
