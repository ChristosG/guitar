                                - paragraph [ref=f1e3172]: "Σήμερα είδαμε το chain of command: tuner, compression, gain (overdrive/distortion/fuzz), modulation, και τελευταία τα χρονικά εφέ delay και reverb — και γιατί αυτή η σειρά κρατάει το σήμα καθαρό αντί να το θολώνει. Είδαμε τη διαφορά ανάμεσα σε true bypass (τίποτα στο κύκλωμα όταν το pedal είναι σβηστό, αλλά καμία προστασία από tone-suck) και buffered bypass (πάντα ενεργός buffer, το σήμα μένει δυνατό). Και είδαμε πώς το FX loop ενός ενισχυτή λύνει το πρόβλημα του να βάζεις modulation/time εφέ μετά το gain stage του preamp, χωρίς να χρειάζεται να ξαναδουλέψεις όλη την αλυσίδα μπροστά στην κιθάρα."
