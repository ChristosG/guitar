                                - paragraph [ref=f1e2552]: "Το πιο συχνό λάθος με το octave pedal κάτω είναι υπερβολικό mix σε γρήγορα ή πυκνά περάσματα: η κάτω οκτάβα μπερδεύεται όταν το pedal δεν προλαβαίνει να «κλειδώσει» σε κάθε νότα, παράγοντας glitches ή fart-y artifacts· η διόρθωση είναι χαμηλότερο mix ή πιο αργό, καθαρό picking. Με τον harmonizer, το τυπικό λάθος είναι να χρησιμοποιείται σε «dumb» σταθερό διάστημα πάνω σε μια μελωδία που κινείται μέσα σε κλίμακα — ο μαθητής ακούει «κάτι δεν πάει καλά» χωρίς να ξέρει τι, και η διόρθωση είναι απλή: αλλαγή σε smart/διατονικό mode ή προγραμματισμός της σωστής τονικότητας. Ένα τρίτο λάθος είναι η σύγχυση chorus με pitch-shift στη ρύθμιση: μαθητές που θέλουν το «σταθερό πάχος» του pitch shift συχνά στρέφονται σε chorus με μηδενισμένο rate, νομίζοντας ότι είναι το ίδιο πράγμα — αλλά το chorus πάντα έχει την υποκείμενη διαμόρφωση LFO, ενώ το pitch shift δεν την έχει καθόλου, ό,τι κι αν κάνετε στα knobs του. Τέλος, γενικό λάθος σε όλη την οικογένεια: πολύ ψηλό mix επιπέδου effect θάβει το dry σήμα και κάνει δύσκολο να ακουστεί καθαρά ποια νότα παίζεται — χρειάζεται πάντα να ακούγεται η αρχική νότα ως «άγκυρα»."
