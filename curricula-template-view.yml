                                  - button "Διαγραφή" [ref=f1e2079]
                              - generic [ref=f1e2080]:
                                - paragraph [ref=f1e2081]: "Η βάση όλων των gain effects είναι μία λέξη: clipping. Όταν ένα σήμα οδηγείται πέρα από τα όρια ενός κυκλώματος — προεντισχυτή λυχνίας, transistor ή διόδου — η κορυφή του κύματος «κόβεται» και προκύπτουν νέες συχνότητες που δεν υπήρχαν στο αρχικό σήμα. Το «soft clipping» στρογγυλεύει σταδιακά τις κορυφές του κύματος και παράγει αρμονικές που σχετίζονται αρμονικά με τον θεμελιώδη ήχο — αυτό είναι το πιο φυσικό, «ζεστό» ηχόχρωμα που συνήθως συνδέουμε με λυχνίες. Το «hard clipping» κόβει απότομα τις κορυφές, παράγοντας περισσότερη ενέργεια σε ανώτερες αρμονικές — ένα πιο σκληρό, πιο «βρώμικο» αποτέλεσμα που συνδέεται συνήθως με transistors και διόδους. Υπάρχει επίσης η διάκριση συμμετρικού και ασύμμετρου clipping: το ασύμμετρο clipping παράγει και ζυγές και μονές αρμονικές, κάτι που πολλοί ακούνε ως πιο «ζεστό»· το συμμετρικό clipping παράγει κυρίως μονές αρμονικές υψηλού πλάτους, κάτι που ακούγεται πιο σκληρό. Πάνω σε αυτή τη βάση χτίζονται τα τρία επίπεδα gain effects. Το overdrive προσομοιώνει έναν ενισχυτή λυχνίας που οδηγείται απαλά σε soft clipping: προσθέτει ζεστασιά και αρμονικές, παραμένει ευαίσθητο στο άγγιγμα και καθαρίζει όταν κατεβάζεις την ένταση της κιθάρας — ακριβώς όπως θα καθάριζε ένας πραγματικός ενισχυτής λυχνίας. Το distortion κόβει πιο σκληρά και πιο συμμετρικά, παράγοντας έναν πιο κορεσμένο, πιο συμπιεσμένο και λιγότερο δυναμικό ήχο, κατάλληλο για ρυθμικά rock μέρη όπου δεν χρειάζεσαι τόση ευαισθησία στο άγγιγμα. Το fuzz κόβει το πιο σκληρά και το πιο ασύμμετρα απ' όλα, δίνοντας μια πυκνή, μερικές φορές «gated» ή splatty υφή που θυμίζει τετραγωνικό κύμα — αυτό είναι το ηχόχρωμα των ψυχεδελικών και garage ήχων της δεκαετίας του '60. Ιστορικά, αυτή η σκάλα εντάσεων προέκυψε από ατυχήματα: ένα χαλασμένο preamp, ένα σκισμένο ηχείο, μια λυχνία που οδηγήθηκε πέρα από τα όρια της — και οι κιθαρίστες αγάπησαν τον ήχο πριν καν υπάρξει η λέξη για να τον περιγράψει κανείς. Το stacking είναι η τεχνική να συνδέεις δύο ή περισσότερα gain effects σε σειρά — συνήθως ένα overdrive χαμηλότερου gain μπροστά από ένα distortion υψηλότερου gain, ή ένα καθαρό boost μπροστά από ένα distortion — ώστε να χτίσεις μια πιο σύνθετη, πολυστρωματική υφή gain απ' όσο θα έδινε ένα μόνο πεδάλ μόνο του, καθώς ο χαρακτήρας clipping κάθε σταδίου αλληλεπιδρά με το επόμενο. Στην πράξη, το πρώτο πεδάλ στη σειρά συχνά δουλεύει σαν «boost» που οδηγεί πιο δυνατά το δεύτερο, χρωματίζοντας το τελικό αποτέλεσμα χωρίς να είναι απαραίτητα ακουστό από μόνο του."
