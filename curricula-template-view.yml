                              - generic [ref=f1e1447]:
                                - paragraph [ref=f1e1448]: "Ως τώρα έχουμε δει τι κάνει ο ενισχυτής στο σήμα — το preamp, το tone stack, το power amp. Σήμερα προχωράμε στο επόμενο, εξίσου σημαντικό κρίκο: το cabinet και το ηχείο. Το βιβλίο του Michael Ross το λέει καθαρά: όταν μιλάμε για ηχεία, πέρα από τις δυσνόητες ποιότητες τόνου υπάρχει και ένας μετρήσιμος παράγοντας, η \"efficiency\" — δηλαδή πόσο αποδοτικά μετατρέπει ένα ηχείο την ισχύ του ενισχυτή σε ηχητική πίεση. Ένα 50-watt Marshall head θα ακουστεί πιο δυνατά μέσα από τέσσερα Electrovoice 12άρια παρά μέσα από τέσσερα Celestion 12άρια, γιατί τα πρώτα είναι πιο αποδοτικά — αλλά τα Celestion έχουν έναν συγκεκριμένο χαρακτήρα τόνου που πολλοί rock παίκτες προτιμούν. Δυνατότερο δεν σημαίνει καλύτερο. Η βιβλιοθήκη του δασκάλου το ξεκαθαρίζει επίσης στο Module 3: το cabinet \"is not a passive afterthought — it shapes tone as much as the amp head driving it\". Έρχεται τώρα η σύνθετη αντίσταση, γνωστή ως impedance, μετρημένη σε ohms. Κάθε ηχείο έχει μια ονομαστική αντίσταση (συνήθως 4, 8 ή 16 ohms) και κάθε ενισχυτής έχει μια ελάχιστη προτεινόμενη αντίσταση φορτίου. Ο κανόνας που δίνει ο Ross είναι απλός αλλά κρίσιμος: μπορείς να συνδέσεις ένα cabinet με μεγαλύτερη αντίσταση από την προτεινόμενη — απλώς θα χάσεις ένταση, σχεδόν σαν φυσικό power soak — αλλά ποτέ δεν πρέπει να συνδέσεις cabinet με μικρότερη αντίσταση από την προτεινόμενη για μεγάλο διάστημα, γιατί ρισκάρεις να \"blow up the amp\", δηλαδή να καταστρέψεις το output transformer, ειδικά σε λυχνιωτούς ενισχυτές. Η βιβλιοθήκη το επιβεβαιώνει: ένα mismatch \"can starve the power section of load or, worse, damage a tube amp's output transformer\". Όταν έχουμε πολλά ηχεία στο ίδιο cabinet ή πολλά cabinets μαζί, η καλωδίωσή τους σε σειρά (series) ή παράλληλα (parallel) αλλάζει τόσο τη συνολική αντίσταση όσο και τον χαρακτήρα του ήχου. Δύο ηχεία των 8 ohms σε παράλληλη σύνδεση δίνουν συνολική αντίσταση 4 ohms, ενώ σε σειρά δίνουν 16 ohms. Πέρα από τον αριθμό, η σύνδεση επηρεάζει και το πώς \"ακούγεται\" το ηχείο: ηχεία σε παράλληλη σύνδεση τείνουν να αλληλοαποσβένονται ελαφρώς, δίνοντας πιο σφιχτή, πιο ελεγχόμενη απόκριση, ενώ ηχεία σε σειρά (συνήθως όχι πάνω από δύο) ακούγονται πιο \"χαλαρά\", πιο ανοιχτά και ακατέργαστα. Ο τύπος και το μέγεθος του ηχείου είναι η επόμενη μεγάλη μεταβλητή. Ένα Celestion Vintage 30 των 12 ιντσών δεν ακούγεται καθόλου σαν ένα vintage-voiced Greenback, ούτε σαν ένα 10ιντσο Fender-style ηχείο· κάθε ένα δίνει διαφορετικό χαρακτήρα breakup, διαφορετική σφιχτότητα στα μπάσα, και διαφορετική αίσθηση όγκου μέσα σε ένα δωμάτιο. Ένα 4x12 cabinet θα προβάλει πολύ πιο μεγάλο, πιο \"φουσκωμένο\" ήχο από ένα 1x12 combo, ανεξάρτητα από το πόσο ίδιος είναι ο ενισχυτής από πάνω. Το σχέδιο του ίδιου του cabinet παίζει επίσης ρόλο: ένα \"open back\" ντουλάπι αφήνει τον ήχο να διαφύγει και από πίσω, δίνοντας πιο ανοιχτό, πιο αραιό μπάσο και μια αίσθηση χώρου· ένα \"closed back\" σφραγισμένο κουτί συμπυκνώνει τα μπάσα και δίνει πιο σφιχτή, πιο κατευθυντική προβολή, ιδανική για metal και high-gain χρήσεις. Όταν βάζουμε ένα head πάνω σε ένα cabinet έχουμε \"half stack\"· πάνω σε δύο cabinets έχουμε \"full stack\" — μια διάταξη που καθιέρωσε ο Marshall τη δεκαετία του 1960. Τέλος, φτάνουμε στη μικροφώνηση, κρίσιμη για ηχογράφηση αλλά και για ενίσχυση μέσω PA. Η θέση του μικροφώνου πάνω στο ηχείο αλλάζει τον ήχο περισσότερο από σχεδόν οποιαδήποτε άλλη αλλαγή εξοπλισμού. Μικρόφωνο στραμμένο ακριβώς στο κέντρο του κώνου (on-axis) δίνει έναν πιο λαμπερό, πιο επιθετικό ήχο με περισσότερες υψηλές συχνότητες· μετακινώντας το μικρόφωνο προς την άκρη του κώνου (off-axis, edge-of-cone) ο ήχος γίνεται πιο ζεστός και πιο στρογγυλός, γιατί τα ηχεία ακτινοβολούν τις υψηλές συχνότητες κυρίως από το κέντρο και τις χαμηλές από τις άκρες. Μια μετατόπιση μόλις λίγων εκατοστών μπορεί να αλλάξει τον τόνο περισσότερο από μια αλλαγή ενισχυτή. Το κοντινό μικρόφωνο (close-mic'ing) απομονώνει το ηχείο και δίνει άμεσο, καθαρό σήμα, ενώ ένα δεύτερο μικρόφωνο σε απόσταση μέσα στο δωμάτιο (room mic) προσθέτει την αίσθηση χώρου και το \"ανάσασμα\" του cabinet που ακούει κανείς ζωντανά — κάτι που χάνεται τελείως όταν το μικρόφωνο είναι κολλημένο πάνω στο ηχείο. Παλαιότερα ηχολήπτες ανακάλυψαν ότι όσο πιο κοντά και κατευθυντικό είναι το μικρόφωνο, τόσο πιο πολύ χάνεται η φυσική αμπιάνς του δωματίου, και χρειάστηκε τεχνητή αναδημιουργία της (reverb) για να αναπληρωθεί αυτό που χάθηκε. Στην πράξη, πολλοί ηχολήπτες βάζουν ένα μικρόφωνο λίγο εκτός κέντρου για \"presence\" και ένα δεύτερο πιο μακριά, προσέχοντας πάντα το ενδεχόμενο phase cancellation όταν συνδυάζουν τα δύο σήματα."
