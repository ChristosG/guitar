                              - generic [ref=f1e4100]:
                                - paragraph [ref=f1e4101]: "Δείξε στον μαθητή δύο πρακτικά σενάρια σύγκρισης. Πρώτο: αν υπάρχει διαθέσιμο modeler ή plugin amp-sim, φόρτωσε ένα preset «blackface Fender clean» και παίξε δίπλα-δίπλα με έναν πραγματικό Fender-style ενισχυτή (ή την πλησιέστερη προσομοίωση που έχεις). Άκουσε μαζί για τη διαφορά στο «give» της παραμόρφωσης όταν χτυπάς πιο δυνατά — το modeling προσπαθεί να αναπαράγει το power sag και το touch-response που περιγράφαμε στη Module 2 του course, αλλά η φυσική αλληλεπίδραση ενός πραγματικού λαμπάτου κυκλώματος με το δωμάτιο είναι δύσκολο να αντιγραφεί πλήρως. Δεύτερο σενάριο: παίξε την ίδια blues φράση με μεγάλη προσοχή στο touch — δυνατό attack, finger vibrato, ελαφρύ palm mute — και μετά την ίδια φράση αδιάφορα, χωρίς έμφαση, και στα δύο rigs (vintage-style και modeling). Η ιδέα εδώ, όπως λέει και η ιστορία του Robben Ford στο βιβλίο, είναι να ακούσει ο μαθητής ότι σε ένα ξένο rig ο ήχος μπορεί να «ακουστεί 150% καλύτερα» απλώς επειδή άλλαξε το χέρι που παίζει — το gear είναι δευτερεύον σε σχέση με το touch."
