                              - generic [ref=f1e1927]:
                                - paragraph [ref=f1e1928]: "Τώρα ο μαθητής παίρνει τον έλεγχο του pedal και περνά από μια σειρά σύντομων A/B ασκήσεων, πάντα συγκρίνοντας compressor on/off στην ίδια ακριβώς φράση, ώστε το αυτί να μάθει να αναγνωρίζει τι ακριβώς αλλάζει. Δοκιμή μονής νότας (4 min) Παίξε μία ανοιχτή χορδή A με τον compressor off, άφησέ τη να σβήσει τελείως. Ενεργοποίησε τον compressor με sustain στο 50% και ξαναπαίξε. Σημείωσε πόσο δευτερόλεπτα κράτησε ακουστή η νότα σε κάθε περίπτωση. Εξομάλυνση δυναμικής (5 min) Παίξε μια απλή σκάλα πεντατονικής σε ένα τάστο, χτυπώντας σκόπιμα άνισα (μια νότα δυνατά, η επόμενη πολύ απαλά, εναλλάξ). Άκου πρώτα χωρίς compressor, μετά με sustain στο μάξιμουμ. Περιέγραψε τη διαφορά στη δυναμική. Funk comping με ελαφριά compression (5 min) Παίξε ρυθμικά muted chords σε όγδοα (Am7 - D7, ένα μέτρο το καθένα) με sustain σε χαμηλό επίπεδο. Στόχος: σφιχτό, ομοιόμορφο «pop» σε κάθε χτύπημα χωρίς να χάνεται η αίσθηση του attack. Compressor ως line driver (4 min) Ρύθμισε sustain πολύ χαμηλά και ανέβασε το output knob λίγο πάνω από unity gain. Άφησέ τον μόνιμα ανοιχτό και παίξε ελεύθερα για δύο λεπτά, παρατηρώντας αν διατηρείται η καθαρότητα των πρίμων."
