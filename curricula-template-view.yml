                                - paragraph [ref=f1e706]: Οι ασκήσεις εδώ είναι κυρίως ασκήσεις ακρόασης και αναγνώρισης — θέλουμε ο μαθητής να μπορεί να «διαβάσει» με τα αυτιά του ποιο pickup ακούει, όχι απλώς να το ξέρει θεωρητικά. A/B τυφλή αναγνώριση (8 min) Ο δάσκαλος παίζει την ίδια φράση εναλλάξ σε single coil και humbucker, με τον μαθητή γυρισμένο πλάτη ή με κλειστά μάτια. Ο μαθητής προσπαθεί να μαντέψει ποιο pickup ακούει κάθε φορά, δικαιολογώντας την απάντηση (φωτεινότητα, πάχος, θόρυβος). Χαρτογράφηση θέσης (7 min) Ο μαθητής παίζει το ίδιο riff σε κάθε θέση του selector switch της δικής του κιθάρας (bridge, middle, neck, και τυχόν συνδυασμούς) και περιγράφει φωναχτά τη διαφορά σε φωτεινότητα και πάχος για κάθε θέση, χτίζοντας το δικό του λεξιλόγιο. Δοκιμή coil-split / series-parallel (7 min) Αν η κιθάρα το επιτρέπει, ο μαθητής ενεργοποιεί coil-split ή series/parallel σε ένα humbucker και συγκρίνει τον ήχο με πλήρη humbucker και με πραγματικό single coil στην ίδια κιθάρα, σημειώνοντας πού μοιάζει και πού διαφέρει.
