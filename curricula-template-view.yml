                              - generic [ref=f1e3683]:
                                - paragraph [ref=f1e3684]: "Μέχρι τώρα έχουμε μιλήσει για το πώς χτίζεται ένα tone - κιθάρα, amp, cabs, pedals, σειρά εφέ. Αυτό το μάθημα δεν προσθέτει καινούριο εξοπλισμό στην εξίσωση, αλλά αλλάζει την ερώτηση: το ίδιο ρig πρέπει να ρυθμιστεί διαφορετικά ανάλογα με το πού παίζεται. Όπως σημειώνεται στο βασικό υλικό του course, 'the same gear can sound very different depending on context, and adapting to that context is itself a tone skill' [S1 p.1]. Live tone πρέπει να περάσει μέσα από ένα πλήρες μείγμα μπάντας και μέσα από ένα PA και μια αίθουσα που ο κιθαρίστας δεν ελέγχει· γι' αυτό, όπως λέει το υλικό, 'players often scoop less midrange live than they would want in isolation, since a mid-scooped guitar can disappear in a live mix' [S1 p.1]. Αυτό είναι το αντίθετο από αυτό που νιώθει σωστό όταν παίζεις μόνος σου στο δωμάτιό σου: εκεί ένα βαθύ, σκουρόχρωμο, scooped tone ακούγεται εντυπωσιακό, αλλά μέσα σε μπάντα με μπάσο, τύμπανα και ίσως πλήκτρα, τα mids είναι η συχνότητα που κρατάει την κιθάρα 'μπροστά'. Το studio tone, αντίθετα, ακούγεται σε απομόνωση ή μέσα σε μια παραγωγή που ο μηχανικός θα δουλέψει με προσοχή, οπότε 'can afford to be more extreme or idiosyncratic because a mix engineer will place and EQ it deliberately' [S1 p.1]. Το ίδιο υλικό θυμίζει και τις γενικές 'συνταγές' EQ ανά είδος: το blues και το classic rock θέλουν παρόν midrange για vocal, κοφτερό lead· το metal σκουπίζει τα mids και δίνει έμφαση σε σφιχτό μπάσο και παρόν πρίμο για καθαρότητα κάτω από πολύ distortion· το funk και το country clean tone θέλουν φωτεινό πρίμο και ελεγχόμενο μπάσο για περκασιόν άρθρωση [S1 p.1]. Πέρα από το EQ, υπάρχει και η πρακτική πλευρά του στούντιο, που περιγράφεται πολύ ζωντανά στο βιβλίο του Michael Ross: ο κιθαρίστας μπαίνει σε ένα στούντιο έχοντας ήδη ένα σπουδαίο live sound, παίζει, πάει στο control room και ακούει κάτι λεπτό και άψυχο - 'this scene is played out every day in studios around the world' [S2 p.63]. Ο λόγος είναι πρακτικός: στο στούντιο συνήθως χρειάζεται να απομονώσεις το σήμα της κιθάρας από τα ντραμς και τα άλλα όργανα, οπότε βάζεις baffles, σε βάζουν να παίξεις πιο σιγά, ή ακόμα σε στέλνουν να παίξεις direct στο board αντί για μικροφωνισμένο amp. Το βιβλίο σημειώνει ότι χάρη σε τεχνολογίες όπως το SansAmp και τα cabinet emulators, 'recording direct is not the nightmare that it once was' και συχνά δίνει καλύτερο αποτέλεσμα από ένα baffled amp με βιαστικό ή ανεπαρκές μικροφώνισμα [S2 p.63]. Ένα άλλο σημείο που τονίζεται είναι ότι στο mic placement, λίγα εκατοστά μετακίνησης του μικροφώνου κάνουν μεγαλύτερη διαφορά από το να αλλάξεις amp - κάτι που ήδη έχουμε δει στο μάθημα των speakers, αλλά εδώ αποκτά πρακτική σημασία γιατί ο κιθαρίστας πρέπει να μάθει να 'μιλάει' με τον μηχανικό ζητώντας συγκεκριμένα πράγματα (πιο πρίμο, πιο μεσαία, πιο μπάσα) αντί να αφήνει τα πάντα στο EQ post-production [S2 p.63]. Τέλος, η ίδια πηγή θυμίζει κάτι πολύ πρακτικό για τα overdubs: αν το στούντιο έχει κακό headphone/cue σύστημα, καλύτερα να κάνεις τα overdubs μέσα στο booth ακούγοντας από τα monitors μαζί με τα υπόλοιπα κομμάτια - έτσι ακούς ακριβώς πώς θα ακουστεί στο τελικό mix, κάτι που είναι αδύνατο να προσομοιωθεί ζωντανά [S2 p.64]."
