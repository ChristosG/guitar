                            - paragraph [ref=f1e627]: Ο μαθητής μαθαίνει πώς λειτουργεί ηλεκτρομαγνητικά ένα pickup και γιατί οι δύο βασικές οικογένειες — single coil και humbucker — ακούγονται τόσο διαφορετικά σε φωτεινότητα, θέρμη και θόρυβο. Κλείνει με τις βασικές καλωδιώσεις (coil-split, series/parallel) που επιτρέπουν σε έναν κιθαρίστα να «δανειστεί» τον χαρακτήρα του ενός τύπου μέσα στον άλλο.
