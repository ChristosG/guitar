                              - generic [ref=f1e1525]:
                                - paragraph [ref=f1e1526]: "Το πιο συχνό και πιο επικίνδυνο λάθος είναι να συνδέει κανείς cabinet με χαμηλότερη αντίσταση από αυτή που ζητά ο ενισχυτής, νομίζοντας ότι 'λίγα ohms διαφορά δεν πειράζουν' — σε λυχνιωτό ενισχυτή αυτό μπορεί να καταπονήσει ή να καταστρέψει το output transformer. Ο κανόνας που πρέπει να θυμάται ο μαθητής: μεγαλύτερη αντίσταση από την προτεινόμενη είναι ασφαλής (απλώς χάνει ένταση), μικρότερη ποτέ. Δεύτερο συχνό λάθος είναι η υπόθεση ότι το cabinet είναι απλώς 'το κουτί που κάνει θόρυβο' και δεν παίζει ρόλο στο tone — πολλοί μαθητές επενδύουν χρόνο μόνο σε pedals και ενισχυτή, αγνοώντας ότι η αλλαγή ηχείου μπορεί να αλλάξει τον χαρακτήρα του ήχου εξίσου δραστικά. Τρίτο, στη μικροφώνηση, πολλοί αρχάριοι βάζουν πάντα το μικρόφωνο ακριβώς στο κέντρο νομίζοντας ότι είναι η 'σωστή' θέση — ο δάσκαλος διορθώνει δείχνοντας ότι το κέντρο δίνει τον πιο φωτεινό, όχι απαραίτητα τον καλύτερο, ήχο, και ότι μια μικρή μετατόπιση προς την άκρη συχνά είναι πιο μουσική επιλογή. Τέλος, όταν χρησιμοποιούνται δύο μικρόφωνα μαζί, ξεχνιέται συχνά ο έλεγχος για phase cancellation, με αποτέλεσμα ο συνδυασμένος ήχος να ακούγεται λεπτότερος ή πιο κούφιος από κάθε μικρόφωνο μόνο του."
