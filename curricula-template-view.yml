                              - generic [ref=f1e3937]:
                                - paragraph [ref=f1e3938]: "Το πιο συχνό λάθος είναι να παίρνει κανείς μια συνταγή EQ ως απόλυτο κανόνα αντί για σημείο εκκίνησης. Ένας μαθητής σκάβει το mid τόσο βαθιά για metal ήχο στο δωμάτιό του που, όταν παίξει με μπάντα, η κιθάρα του εξαφανίζεται — ακριβώς το πρόβλημα που περιγράφει η αρχή \"a mid-scooped guitar can disappear in a live mix\". Η διόρθωση: λιγότερο scoop ζωντανά απ' όσο θα ήθελες σε απομόνωση. Δεύτερο λάθος: υπερβολική χρήση effects επειδή \"ακούγονται ωραία\" μόνος στο δωμάτιο. Η ύλη το περιγράφει ξεκάθαρα — όλο εκείνο το distortion, chorusing, doubling και echoing που γεμίζει τον ήχο όταν παίζεις μόνος, σε βυθίζει μέσα στο μείγμα όταν μπει η μπάντα, και το \"λαμπρό\" σου solo γίνεται απλώς θόρυβος φόντου (\"more is less\" syndrome). Η διόρθωση είναι να ηχογραφείς πρόβες και να ελέγχεις αν το effect περνάει πραγματικά μέσα από τα υπόλοιπα όργανα. Τρίτο λάθος, σχετικό με distortion: πολλοί μαθητές καλύπτουν κακό ήχο, κακό sustain ή κακή τεχνική με περισσότερο gain. Όμως \"too much distortion will muddy and 'fuzz up' your sound\" και κάνει τις νότες να \"μπλέκονται\" και να βουλιάζουν στο μείγμα. Πριν ανεβάσεις το gain, δούλεψε πρώτα το EQ και το touch σου. Τέταρτο λάθος: να μη σκέφτεσαι το context του χώρου. Η ίδια ρύθμιση reverb που δούλεψε στο στούντιο μπορεί να είναι καταστροφική σε μια φυσικά ηχηρή αίθουσα, όπου \"the last thing you need to add is copious amounts of reverb\"."
