                                - paragraph [ref=f1e2811]: Μέχρι το επόμενο μάθημα, δούλεψε 15 λεπτά τη μέρα πάνω σε ένα μόνο κομμάτι που ξέρεις ήδη, εφαρμόζοντας πρώτα slapback στο ρυθμικό μέρος και μετά dotted-eighth σε μια απλή μελωδική γραμμή, χρησιμοποιώντας πάντα tap tempo ή μέτρημα με μετρονόμο πριν πατήσεις κανένα κουμπί. Θα ξέρεις ότι το πέτυχες όταν μπορείς να ηχογραφήσεις τον εαυτό σου (έστω με το κινητό) και να ακούς καθαρά τον ρυθμό των επαναλήψεων να «κλειδώνει» με το tempo, όχι να περιπλανιέται. Αν έχεις πρόσβαση σε δεύτερο ενισχυτή ή στερεοφωνικά ηχεία, δοκίμασε και το ping-pong πάνω σε μια αργή μπαλάντα.
