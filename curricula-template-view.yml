                              - generic [ref=f1e1901]:
                                - paragraph [ref=f1e1902]: "Θα δείξω το φαινόμενο με έναν πραγματικό compressor pedal (τύπου MXR Dynacomp / Boss CS-3 — ό,τι έχει ο μαθητής διαθέσιμο), συνδεδεμένο πρώτος στην αλυσίδα, αμέσως μετά την κιθάρα, πριν από οποιοδήποτε gain ή modulation pedal — τη θέση που περιγράφει ο Ross ως κανόνα: compressors, as a rule, should come first in the chain. Παίζω πρώτα ένα single note στο 5ο τάστο της χορδής D, χωρίς compressor, σε καθαρό ήχο, και αφήνω τη νότα να σβήσει φυσικά μέσα σε 3-4 δευτερόλεπτα. Μετά ανάβω τον compressor με το sustain knob στο μισό και ξαναπαίζω την ίδια νότα στην ίδια ένταση χτυπήματος: θα ακούσεις ότι η νότα κρατάει αισθητά περισσότερο πριν σβήσει εντελώς, και ότι η αρχική επίθεση είναι λίγο πιο «στρογγυλή», λιγότερο απότομη. Στη συνέχεια ανεβάζω το sustain knob στο μάξιμουμ για να ακούσουμε το ακραίο σενάριο: παίζω ένα riff με ανομοιόμορφο δυναμικό (μερικές νότες δυνατά, μερικές πολύ απαλά) και δείχνω πώς όλες βγαίνουν σχεδόν στην ίδια ένταση — αυτό είναι το «squashing» effect που αναφέρει ο Ross για τον Adrian Belew. Μετά χαμηλώνω το sustain σε χαμηλό επίπεδο και παίζω ένα καθαρό funk comping πάνω σε μια Am7-D7 προόδο στο πρώτο τάστο, δείχνοντας πώς η ελαφριά συμπίεση δίνει σφιχτάδα και συνοχή στο χτύπημα χωρίς να σκοτώνει τη δυναμική. Τέλος, δείχνω τη χρήση του compressor ως «line driver»: αφήνοντάς τον μόνιμα ανοιχτό με πολύ χαμηλό sustain αλλά με το output knob λίγο πιο ψηλά από το unity gain, ώστε να αντισταθμίζει την απώλεια υψηλών συχνοτήτων καθώς το σήμα περνά από πολλά καλώδια και pedals — ακριβώς όπως το περιγράφει ο ίδιος ο Ross για το δικό του pedalboard."
