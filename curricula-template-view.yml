                              - generic [ref=f1e1849]:
                                - paragraph [ref=f1e1850]: "Πριν αγγίξουμε οποιοδήποτε πεντάλ, θέλω να ακούσεις πώς σβήνει μια νότα φυσικά. Παίξε την καθαρή σου κιθάρα, χωρίς κανένα εφέ, σε ένα καθαρό κανάλι του ampli. Χτύπα μία ανοιχτή χορδή (π.χ. το χαμηλό E) και άσε την να σβήσει εντελώς, χωρίς να πειράξεις τίποτα, για 15-20 δευτερόλεπτα. Μετά επανάλαβε: χτύπα την ίδια χορδή, αλλά αυτή τη φορά, καθώς η ένταση πέφτει, γύρνα σιγά-σιγά το κουμπί έντασης του ampli προς τα πάνω, ώστε η νότα να ακούγεται σαν να μη σβήνει ποτέ. Αυτό το πείραμα, όπως το περιγράφει ο Michael Ross στο Getting Great Guitar Sounds, είναι ακριβώς αυτό που κάνει ένας compressor αυτόματα — και είναι η καλύτερη προθέρμανση γιατί σε βάζει κατευθείαν μέσα στο θέμα του μαθήματος: η νότα δεν κρατάει περισσότερο, απλώς μένει πιο δυνατή για περισσότερη ώρα. Κάνε το ίδιο πείραμα και με μια συγχορδία, ακούγοντας πώς οι μπάσες χορδές τείνουν να καλύπτουν τις πρίμα."
