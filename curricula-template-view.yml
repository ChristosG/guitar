                              - generic [ref=f1e3863]:
                                - paragraph [ref=f1e3864]: "Στα προηγούμενα μαθήματα είδαμε ότι το ίδιο rig ακούγεται διαφορετικά ανάλογα με το context — ζωντανά μπροστά σε μπάντα, στο στούντιο σε απομόνωση, ή σε διαφορετικό είδος μουσικής. Σήμερα μεταφράζουμε αυτή την αρχή σε συγκεκριμένες, εφαρμόσιμες συνταγές EQ. Η ύλη μας λέει καθαρά: \"blues and classic rock tones tend to favor present midrange for a vocal, cutting lead tone\" — δηλαδή θέλουμε το midrange φουσκωμένο, όχι σκαμμένο, γιατί είναι αυτό που κάνει το solo να \"τραγουδάει\" και να ξεχωρίζει μέσα σε μια μπάντα με μπάσο, ντραμς και ίσως πλήκτρα. Αντίθετα, \"metal tones typically scoop mids and emphasize tight low end and a present top end for clarity under heavy distortion\" — το scoop στα mids δίνει εκείνο το χαρακτηριστικό \"σκαμμένο\" προφίλ, με σφιχτό μπάσο και καθαρό treble ώστε τα riffs να μένουν καθαρά ακόμα κι όταν το gain είναι στο τέρμα. Τέλος, \"funk and country clean tones favor bright top end and controlled bass for percussive articulation\" — εδώ θέλουμε λαμπερό πάνω άκρο και ελεγχόμενο μπάσο, ώστε κάθε χτύπημα να ακούγεται καθαρό και ρυθμικό, χωρίς να \"βουλιάζει\" σε λάσπη χαμηλών συχνοτήτων. Για να καταλάβουμε τεχνικά τι σημαίνει \"scoop\", η βιβλιογραφία μας δίνει μια συγκεκριμένη συχνότητα-αναφορά: \"Increasing the bass and treble while reducing or eliminating the centre midrange (750 Hz) results in what is popularly known as a 'scooped' sound... Conversely, decreasing the bass while increasing the midrange and treble creates a punchy, harsher sound. Rolling off all of the treble produces a dark, heavy sound.\" Δηλαδή το σημείο-κλειδί γύρω από τα 750 Hz είναι αυτό που κόβουμε ή φουσκώνουμε ανάλογα με το αν θέλουμε metal scoop ή blues punch. Αυτό δεν είναι κανόνας γραμμένος σε πέτρα, αλλά σημείο εκκίνησης: στο δικό σου amp ή EQ pedal, η ίδια λογική εφαρμόζεται είτε έχεις γραφικό equalizer με πολλά bands είτε μόνο τρία κουμπιά bass/mid/treble. Θυμήσου επίσης κάτι που είδαμε στο μάθημα για context: \"a mid-scooped guitar can disappear in a live mix\" — δηλαδή η συνταγή του metal (scoop) που ακούγεται τέλεια στο δωμάτιό σου μόνος, μπορεί να εξαφανιστεί τελείως όταν μπει μπάσο και ντραμς δίπλα της σε ζωντανή εκτέλεση. Γι' αυτό οι συνταγές EQ δεν είναι απόλυτες — είναι σημεία εκκίνησης που προσαρμόζονται στο πόσο γεμάτο είναι το μείγμα γύρω σου. Πέρα από το EQ, υπάρχει και το ζήτημα του πόσο effect χρειάζεται μια μουσική στιγμή. Η αρχή είναι απλή: \"use an effect because the music needs it not just because it is there - and then only enough to get the point across.\" Αν παίζεις Chicago blues, χρειάζεσαι πραγματικά stereo chorus; Αν παίζεις speed metal \"in your face\", θα σε βοηθήσει πολύ chorus και μακρύ delay, ή μήπως θα μαλακώσουν τον ήχο περισσότερο απ' όσο πρέπει — και θα αρκούσε distortion με λίγη μικρή reverb δωματίου; Το ίδιο ισχύει και για τον χώρο: αν παίζεις σε μια ηχηρή, μισοάδεια αίθουσα, το τελευταίο πράγμα που χρειάζεσαι είναι άφθονη reverb πάνω στην ήδη ηχηρή αίθουσα."
