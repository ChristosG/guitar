                                - paragraph [ref=f1e2378]: "Σήμερα είδαμε ότι κάθε modulation effect έχει έναν LFO από πίσω του, αλλά διαμορφώνει διαφορετική ιδιότητα του σήματος: το chorus διαμορφώνει μια καθυστέρηση γύρω στα 20ms για να προσομοιώσει πολλά όργανα μαζί, ο flanger σαρώνει μια πολύ μικρότερη καθυστέρηση σε ευρύτερο εύρος με feedback για το «jet plane» άκουσμα, ο phaser σαρώνει τη φάση χωρίς καθόλου καθυστέρηση για ένα πιο απαλό swirl, το tremolo παλμώνει την ένταση, το vibrato λυγίζει το ύψος, και το rotary συνδυάζει πλάτος και ύψος μαζί μέσα από ένα φυσικό περιστρεφόμενο ηχείο. Rate και depth είναι τα δύο κοντρόλ-κλειδιά που θα βρίσκεις σε όλα."
                                - link "Guitar Tone & Gear — Course Spine, σελ. 1" [ref=f1e2380] [cursor=pointer]:
