                              - generic [ref=f1e4049]:
                                - paragraph [ref=f1e4050]: "Πέντε λεπτά, χωρίς πολλά λόγια: αν υπάρχει διαθέσιμος ένας πραγματικός λαμπάτος ενισχυτής και ένα modeler ή πρόσθετο amp-sim στο ίδιο δωμάτιο, ζήτησε από τον μαθητή να παίξει την ίδια απλή clean φράση πρώτα στο ένα, μετά στο άλλο, με τα ίδια-ίδια settings όσο γίνεται. Αν δεν υπάρχει modeler πρόχειρα, παίξε την ίδια φράση στον ίδιο ενισχυτή σε δύο πολύ διαφορετικές εντάσεις (χαμηλή/δυνατή) για να θυμηθεί κανείς πόσο αλλάζει η αίσθηση του power amp sag ανάλογα με την ένταση. Ο στόχος δεν είναι να «κερδίσει» κάποιο από τα δύο· είναι να ζεσταθεί το αυτί πριν μπούμε στη σύγκριση θεωρίας."
