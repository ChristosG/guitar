                                - paragraph [ref=f1e1194]: "Άνοιξε το 10λεπτο block ρωτώντας τον μαθητή να σου εξηγήσει με δικά του λόγια τη διαφορά preamp/power amp, πριν του δώσεις εσύ τις σωστές απαντήσεις παρακάτω — έτσι βλέπεις πού έμεινε η παρανόηση. Q: Ποια είναι η βασική διαφορά ανάμεσα στο preamp gain και στο master volume; A: Το preamp gain καθορίζει πόσο έντονα σπάει/διαμορφώνεται το σήμα στο πρώτο στάδιο (τον χαρακτήρα του distortion), ανεξάρτητα από τη συνολική ένταση· το master volume, τοποθετημένο μετά, καθορίζει πόσο δυνατά ακούγεται τελικά αυτό το ήδη διαμορφωμένο σήμα στο δωμάτιο. Q: Γιατί ο ήχος του Clapton στο Bluesbreakers album θεωρείται παράδειγμα power amp distortion και όχι preamp distortion; A: Επειδή ο ενισχυτής της εποχής δεν είχε ξεχωριστό master volume — για να πάρει distortion έπρεπε να σπρώξει ολόκληρο τον ενισχυτή, preamp και power amp μαζί, σε υψηλή ένταση, οπότε μεγάλο μέρος του χαρακτήρα ερχόταν από το power section να συμπιέζεται, όχι μόνο από το preamp. Q: Γιατί δύο ενισχυτές με διαφορετικό wattage (π.χ. 15W και 100W, και οι δύο λυχνιακοί) δεν διαφέρουν τόσο στη μέγιστη ένταση όσο θα περίμενε κανείς; A: Επειδή η βασική διαφορά wattage ανάμεσα σε λυχνιακούς ενισχυτές εκφράζεται κυρίως ως headroom — πόσο δυνατά μπορεί να παίξει ο ενισχυτής πριν αρχίσει να distort — και λιγότερο ως καθαρή αντιληπτή ένταση σε ντεσιμπέλ."
