                              - generic [ref=f1e683]:
                                - paragraph [ref=f1e684]: "Θα δείξω στον μαθητή τρία πράγματα, στη σειρά, σε μια κιθάρα με τουλάχιστον έναν humbucker και ένα single coil (ή σε δύο διαφορετικές κιθάρες αν δεν υπάρχει τέτοιο μοντέλο διαθέσιμο). Πρώτα, παίζω το ίδιο riff — έστω μια απλή pentatonic φράση γύρω από το πέμπτο τάστο στη χαμηλή Mi — καθαρό, στο single coil του μπρίτζ, και μετά στο ίδιο riff στο humbucker του μπρίτζ (ή στο μοναδικό humbucker αν η κιθάρα έχει μόνο έναν). Ζητάω από τον μαθητή να προσέξει: πόσο πιο «λεπτό» και γυάλινο ακούγεται το single coil, πόσο πιο «γεμάτο» και σκοτεινό ο humbucker. Δεύτερον, δείχνω το hum. Σβήνω το distortion, ανεβάζω λίγο gain σε καθαρό ήχο, αφήνω το single coil pickup ανοιχτό χωρίς να παίζω και γυρίζω προς τον υπολογιστή/monitor ή κάποια φωτιστική πηγή — ο βόμβος θα γίνει εμφανής. Μετά περνάω στο humbucker στην ίδια θέση και ένταση — ο βόμβος σχεδόν εξαφανίζεται. Αυτή η σύγκριση κάνει το «γιατί υπάρχει ο humbucker» απτό αντί για αφηρημένο. Τρίτον, αν η κιθάρα έχει coil-split (συνήθως ένα push-pull ποτενσιόμετρο ή mini-switch), δείχνω τι συμβαίνει όταν «σπάμε» τον humbucker σε ένα ενεργό πηνίο: ο ήχος γίνεται πιο λεπτός, πιο κοντά σε single coil, αλλά επιστρέφει και ο hum — γιατί πλέον έχουμε μόνο ένα πηνίο να δουλεύει, όχι δύο σε ακύρωση θορύβου. Αν υπάρχει επιλογή series/parallel, δείχνω επίσης τη διαφορά: parallel δίνει λιγότερο output και πιο φωτεινό ήχο διατηρώντας όμως την ακύρωση του hum, γιατί και τα δύο πηνία παραμένουν ενεργά — απλώς αλλάζει το πώς συνδέονται μεταξύ τους."
