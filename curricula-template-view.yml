                              - generic [ref=f1e2876]:
                                - paragraph [ref=f1e2877]: Ξεκινάμε με τον ενσωματωμένο spring reverb του ενισχυτή, αν υπάρχει (π.χ. σε Fender-style combo). Παίξε έναν power chord ή ένα δυνατό strum με το reverb ανοιχτό σε μεσαία ένταση, και άκουσε προσεκτικά το χαρακτηριστικό 'sproi-oi-oiing', τον μεταλλικό ήχο που παράγεται όταν το σήμα χτυπάει δυνατά το ελατήριο. Αυτός δεν είναι βλάβη — είναι η φυσική συμπεριφορά ενός μηχανικού spring reverb όταν δέχεται απότομο attack. Δοκίμασε το ίδιο chord με το reverb κλειστό, μετά ανοιχτό σε χαμηλή, μεσαία και υψηλή ένταση, για πέντε λεπτά, ώστε το αυτί να συνηθίσει να ακούει πού ακριβώς αρχίζει να 'πνίγεται' ο ήχος μέσα στην αντήχηση.
                                - link "Getting Great Guitar Sounds, σελ. 48" [ref=f1e2879] [cursor=pointer]:
