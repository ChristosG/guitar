                                - paragraph [ref=f1e1352]: "Σήμερα μάθαμε τις τέσσερις μεγάλες φωνές ενισχυτή: η Fender δίνει clean headroom, scooped mid και sparkle, και αγαπάει τα pedals μπροστά της· η Marshall σπρώχνει το mid μπροστά και σπάει νωρίτερα σε ένα κλασικό ροκ crunch, από το Plexi μέχρι το JCM800· η Vox με το AC30 προσφέρει chimey top end και μια ξεχωριστή class-A συμπεριφορά· και η οικογένεια high-gain, με το cascading gain design της Mesa/Boogie και συγγενών, δίνει κορεσμένο αλλά σφιχτό distortion φτιαγμένο για σύγχρονο rock και metal rhythm. Το κλειδί δεν είναι να αποστηθίσουμε ονόματα μοντέλων, αλλά να αναγνωρίζουμε το αυτί: πού βρίσκεται το mid, πόσο νωρίς σπάει ο ήχος, και πόσο ζωντανό είναι το attack."
