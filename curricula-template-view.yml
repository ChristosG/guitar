                              - generic [ref=f1e1747]:
                                - paragraph [ref=f1e1748]: Είδαμε ότι το distortion είναι, φυσικά, clipping —κόψιμο της κυματομορφής— που μπορεί να είναι soft (λυχνίες, σταδιακό) ή hard (transistors, απότομο), και ότι το πού συμβαίνει μέσα στην αλυσίδα, preamp ή power amp, αλλάζει εντελώς τον χαρακτήρα του. Είδαμε επίσης πώς η ιστορία —από τον cranked Marshall του Clapton μέχρι το πρώτο master volume και τα πρώτα fuzzboxes— οδήγησε στα σημερινά πεντάλ overdrive, distortion και fuzz που έχουμε στο pedalboard μας σήμερα.
