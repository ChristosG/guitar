                              - generic [ref=f1e2299]:
                                - paragraph [ref=f1e2300]: "Θα περάσουμε από τα πέντε εφέ με τη σειρά, πάνω στην ίδια αρμονική βάση, ώστε το αυτί σου να συγκρίνει άμεσα. Ξεκίνα με μια συγχορδία σαν Asus2 στο 5ο τάστο (ή οποιαδήποτε ανοιχτή chime συγχορδία), σε καθαρό ήχο amp, τέμπο περίπου 80 bpm, αρπισμένη απαλά με τα δάχτυλα. 1) Chorus: βάλε rate μέτριο και depth μέτριο σε ένα analog-style chorus πεντάλ. Άκου πώς η συγχορδία «φαρδαίνει» χωρίς να χάνει καθαρότητα. Μετά ρύθμισε έναν flanger με πολύ χαμηλό regeneration ώστε να ακούγεται σχεδόν σαν chorus — έτσι πετύχαινε ο Andy Summers στους Police το χαρακτηριστικό chiming ήχο του, με flanger ρυθμισμένο για ελάχιστο regeneration αντί για αληθινό chorus πεντάλ. 2) Flanger: ανέβασε το depth και πρόσθεσε αισθητό feedback/regeneration. Παίξε τώρα μια power chord Ε5 στη χαμηλή Ε χορδή, με ελαφρύ crunch, κρατώντας τη νότα σε sustain. Άκου το κλασικό «jet plane» sweep. Αυτό είναι το μονοπάτι που ακολούθησε ο Eddie Van Halen για το περίφημο «brown sound» του — συνδυάζοντας έναν τροποποιημένο high-gain ενισχυτή με flanger για έναν κορεσμένο αλλά ευκρινή ήχο. 3) Phaser: πάνω στην ίδια power chord, αντικατέστησε τον flanger με phaser σε αργό rate. Σύγκρινε — θα ακούσεις μια πιο απαλή, λιγότερο μεταλλική περιστροφή, χωρίς καμία αίσθηση καθυστέρησης ή αλλαγής ύψους. 4) Tremolo: γύρισε σε καθαρό ήχο και ενεργοποίησε το tremolo του amp (τύπου Fender). Παίξε αργά όγδοα σε μία νότα, ρυθμίζοντας πρώτα το rate αργό για ένα απαλό wobble, μετά γρήγορο για ένα κοφτό, σχεδόν stuttering παλμό. 5) Rotary: αν έχεις πρόσβαση σε Leslie simulator, κράτησε μια νότα σε bend πάνω στη Β χορδή στο 8ο τάστο και άκου το στροβιλιστικό Doppler αποτέλεσμα — έναν ήχο τον οποίο χρησιμοποίησε ο Stevie Ray Vaughan μέσω πραγματικών περιστρεφόμενων Leslie cabinets για ατμοσφαιρικά περάσματα."
