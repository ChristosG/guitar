                          - generic [ref=f1e2053]:
                            - paragraph [ref=f1e2054]: "Ο μαθητής μαθαίνει να διακρίνει τα τρία επίπεδα gain effects — overdrive, distortion και fuzz — μέσα από τη λογική του clipping, και εξασκείται στο stacking δύο ή περισσότερων gain πεδάλ για πολυστρωματικό tone. Η ώρα κλείνει με πρακτική δοκιμή στο αυτί: ίδιο riff, τρία διαφορετικά επίπεδα gain, μία στοίβα."
