                                - paragraph [ref=f1e3794]: "Μέχρι το επόμενο μάθημα, ζήτησε από τον μαθητή να ηχογραφήσει (με ό,τι μέσο έχει διαθέσιμο, ακόμη και κινητό) το ίδιο κομμάτι δύο φορές: μία με το EQ setting που προτιμά όταν παίζει μόνος, και μία προσαρμοσμένο όπως θα το έπαιζε μέσα σε μπάντα (περισσότερα mids, λιγότερο scoop). Θα ξέρει ότι το πέτυχε αν, ακούγοντας πίσω τις δύο ηχογραφήσεις δίπλα σε ένα backing track ή σε τραγούδι αναφοράς, η δεύτερη εκδοχή ακούγεται πιο ξεκάθαρα 'μπροστά' στο μείγμα."
                                - button "Επέκταση με συνομιλία" [ref=f1e3797]
