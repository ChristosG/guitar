                              - generic [ref=f1e3967]:
                                - paragraph [ref=f1e3968]: "Σήμερα μετατρέψαμε το context σε συγκεκριμένες συνταγές EQ: present midrange για blues/classic rock ώστε το solo να \"τραγουδάει\", scooped mids με tight low end και present top end για metal ώστε τα riffs να μένουν καθαρά κάτω από βαρύ distortion, και bright top end με controlled bass για funk/country ώστε κάθε χτύπημα να είναι percussive. Είδαμε επίσης ότι αυτές οι συνταγές είναι σημεία εκκίνησης, όχι απόλυτοι κανόνες — προσαρμόζονται στο πόσο γεμάτο είναι το μείγμα γύρω σου. Τέλος, δουλέψαμε την κρίση: ένα effect πρέπει να μπαίνει επειδή η μουσική το χρειάζεται, όχι επειδή υπάρχει διαθέσιμο, και πάντα όσο χρειάζεται για να περάσει το μήνυμα — ούτε παραπάνω."
