                                - paragraph [ref=f1e1504]: "Οι ασκήσεις της σημερινής ώρας είναι κυρίως ακουστικές, όχι τεχνικές παιξίματος — στόχος είναι να εκπαιδευτεί το αυτί του μαθητή να αναγνωρίζει πότε αλλάζει ο ήχος λόγω ηχείου/cabinet/μικροφώνου και όχι λόγω ενισχυτή ή δαχτύλων. Ξεκινάμε με τον υπολογισμό αντίστασης, γιατί είναι η πιο 'μαθηματική' άσκηση και χρειάζεται καθαρό μυαλό, και προχωράμε στις ακουστικές συγκρίσεις. Ακρόαση on-axis / off-axis (6 min) Ο μαθητής παίζει αργά arpeggios σε καθαρό ήχο ενώ ο δάσκαλος μετακινεί σταδιακά ένα μικρόφωνο (ή, αν δεν υπάρχει interface, απλά το αυτί/τηλέφωνο σε απόσταση) από το κέντρο προς την άκρη του κώνου. Ο μαθητής σημειώνει σε ποιο σημείο ο ήχος περνά από 'λαμπερό' σε 'ζεστό'. Υπολογισμός σύνθετης αντίστασης (8 min) Με χαρτί και στυλό, ο μαθητής υπολογίζει τη συνολική αντίσταση για τρεις συνδυασμούς: δύο ηχεία 8 ohms παράλληλα, δύο ηχεία 16 ohms σε σειρά, και τέσσερα ηχεία 16 ohms σε συνδυασμό σειράς-παράλληλης (όπως σε ένα τυπικό 4x12 cabinet). Ελέγχει κάθε αποτέλεσμα με τον δάσκαλο. Σύγκριση cabinet μεγέθους (8 min) Αν υπάρχουν διαθέσιμα δύο διαφορετικά cabinets (π.χ. 1x12 και 4x12, ή open-back και closed-back), ο μαθητής παίζει το ίδιο power chord riff σε κάθε ένα με τις ίδιες ρυθμίσεις ενισχυτή και περιγράφει προφορικά τις διαφορές σε low-end σφιχτότητα και αίσθηση όγκου. Close-mic vs room-mic (προσομοίωση) (8 min) Χρησιμοποιώντας το κινητό τηλέφωνο ως πρόχειρο 'μικρόφωνο', ο μαθητής ηχογραφεί μια σύντομη φράση με το τηλέφωνο κολλημένο στο ηχείο και μετά με το τηλέφωνο 1-1.5 μέτρα μακριά μέσα στο δωμάτιο. Ακούγοντας τα δύο αρχεία μαζί, εντοπίζει πού χάνεται και πού κερδίζεται αμπιάνς."
