                                  - button "Διαγραφή" [ref=f1e2467]
                              - generic [ref=f1e2468]:
                                - paragraph [ref=f1e2469]: Πέντε λεπτά χωρίς κανένα εφέ ενεργό. Παίξτε αργά μια πεντατονική κλίμακα σε G σε ένα καθαρό κανάλι, δίνοντας προσοχή στη θεμελιώδη νότα κάθε φθόγγου — αυτό είναι το σήμα που θα «διαβάσει» κάθε pitch effect σήμερα. Μετά παίξτε την ίδια φράση με μια απλή I-IV-V συγχορδιακή πρόοδο (G-C-D) σε αργό τέμπο, ώστε να έχετε στο αυτί σας τον «στεγνό» (dry) ήχο πριν αρχίσουμε να προσθέτουμε φωνές πάνω και κάτω από αυτόν. Αυτό το warm-up είναι σκόπιμα το ίδιο υλικό που θα χρησιμοποιήσουμε παρακάτω με τα εφέ, ώστε η σύγκριση να είναι άμεση.
                                - button "Επέκταση με συνομιλία" [ref=f1e2472]
                            - generic [ref=f1e2473]:
                              - generic [ref=f1e2474]:
                                - button "Θεωρία" [ref=f1e2476]
