                              - generic [ref=f1e1634]:
                                - paragraph [ref=f1e1635]: "Πέντε λεπτά, χωρίς καμία βιασύνη: σύνδεσε την κιθάρα στο καθαρό κανάλι του ενισχυτή, gain πολύ χαμηλά, και παίξε ένα απλό power chord riff (E5–G5–A5) σε αργό τέμπο, μόνο με κάτω χτυπήματα. Άκουσε πόσο 'καθαρό' και δυναμικό είναι το σήμα —κάθε διαφορά στο χτύπημα ακούγεται αμέσως στην ένταση. Στη συνέχεια ανέβασε σιγά σιγά το preamp gain (ή το volume, αν ο ενισχυτής δεν έχει ξεχωριστό gain) μέχρι να αρχίσει να 'σπάει' ο ήχος. Αυτό το ζέσταμα προετοιμάζει το αυτί για το σημερινό θέμα: θα νιώσεις με το χέρι σου το ακριβές σημείο όπου ένα καθαρό σήμα περνάει στο distortion, πράγμα που είναι το θεμέλιο όλης της θεωρίας που ακολουθεί."
