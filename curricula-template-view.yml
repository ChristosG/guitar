                        - generic [ref=f1e2453]:
                          - generic [ref=f1e2454]:
                            - paragraph [ref=f1e2455]: Ο μαθητής μαθαίνει πώς τα pitch effects (octave, harmonizer, pitch-shifter) προσθέτουν φωνές πάνω ή κάτω από τη θεμελιώδη νότα χρησιμοποιώντας σταθερά, ακριβή διαστήματα — σε αντίθεση με το ταλαντούμενο, LFO-βασισμένο chorus που έμαθε σε προηγούμενο μάθημα. Η ώρα περνά παίζοντας με τα τρία εφέ πάνω σε πραγματικές φράσεις, ώστε να ακούσει καθαρά πότε το καθένα είναι η σωστή επιλογή.
                            - button "Επέκταση με συνομιλία" [ref=f1e2458]
                          - generic [ref=f1e2459]:
                            - generic [ref=f1e2460]:
                              - generic [ref=f1e2461]:
