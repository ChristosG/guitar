                              - generic [ref=f1e2529]:
                                - paragraph [ref=f1e2530]: Τρεις σύντομες ασκήσεις, η καθεμία πάνω στο ίδιο υλικό, ώστε να απομονώνεται μόνο η μεταβλητή του εφέ. Octave pedal — tracking test (5 min) Παίξτε τη G πεντατονική αργά, νότα-νότα, με octave pedal σε λειτουργία κάτω οκτάβα και mix στο 100%. Σημειώστε πού το pedal «χάνει» το tracking (γρήγορα legato περάσματα, διπλές νότες, palm mute). Μετά δοκιμάστε mix 30-40% για να βρείτε το σημείο όπου ενισχύει χωρίς να κυριαρχεί. Smart vs dumb harmonizer (7 min) Σε G major, παίξτε την ίδια πενταφωνική φράση πρώτα με harmonizer σε smart/διατονική τρίτη πάνω, μετά σε dumb/σταθερή μεγάλη τρίτη. Εντοπίστε ακουστικά τις νότες που ηχούν «εκτός» στη δεύτερη περίπτωση και εξηγήστε γιατί συμβαίνει. Pitch-shift vs chorus σε συγχορδίες (5 min) Παίξτε την I-IV-V πρόοδο (G-C-D) πρώτα με chorus σε μέτρια ρύθμιση, μετά με pitch-shifter στα -10 cents και mix 50%. Περιγράψτε τη διαφορά στο πάχος, στην ευκρίνεια (definition) και στο αν το attack της συγχορδίας μένει καθαρό.
