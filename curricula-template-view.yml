                              - generic [ref=f1e753]:
                                - paragraph [ref=f1e754]: "Σήμερα είδαμε ότι κάθε pickup είναι ένας ηλεκτρομαγνήτης που «ακούει» τη δόνηση της χορδής, και ότι η βασική διαφορά single coil vs humbucker είναι δομική: ένα πηνίο εναντίον δύο, σε αντίθετη φορά και πολικότητα. Το single coil δίνει φωτεινότητα, άρθρωση, λεπτότητα — αλλά και έναν χαρακτηριστικό 60-cycle hum. Ο humbucker ακυρώνει αυτόν τον θόρυβο συνδυάζοντας δύο πηνία, με αντάλλαγμα πιο χοντρό, πιο ζεστό, πιο high-output ήχο, καλύτερα προσαρμοσμένο σε overdrive και distortion. Είδαμε επίσης πώς η καλωδίωση —coil-split για να «σπάσουμε» έναν humbucker σε ψευτο-single coil, ή series/parallel για να αλλάξουμε πώς συνεργάζονται τα δύο πηνία χωρίς να χάσουμε την ακύρωση θορύβου— δίνει στον κιθαρίστα ευελιξία μέσα στο ίδιο instrument."
