                              - generic [ref=f1e1329]:
                                - paragraph [ref=f1e1330]: "Το πιο συχνό λάθος είναι να νομίζει ο μαθητής ότι distortion είναι distortion — ότι αρκεί να ανεβάσεις το gain σε οποιονδήποτε ενισχυτή για να πάρεις τον ίδιο χαρακτήρα. Στην πράξη, ένας Fender με ψηλό gain δεν θα ακούγεται ποτέ σαν Marshall, γιατί το tone stack και η αναλογία μεσαίων είναι διαφορετικά καλωδιωμένα εξ αρχής — το scooped mid της Fender παραμένει scooped ό,τι κι αν κάνεις με το gain knob. Δεύτερο συχνό λάθος: μαθητές που παίζουν σε Marshall-style ρύθμιση σκουπίζουν εντελώς τα μεσαία επειδή έτσι νομίζουν ότι ακούγεται πιο metal — αυτό ακριβώς σκοτώνει το χαρακτηριστικό crunch της οικογένειας Marshall, που στηρίζεται στο παρουσιαστικό mid. Τρίτο λάθος: να περιμένει κανείς από ένα Vox AC30 την ίδια δυνατότητα καθαρού ήχου σε υψηλή ένταση που έχει μια Fender Twin — το class-A power section της Vox συμπεριφέρεται διαφορετικά και σπάει νωρίτερα. Η διόρθωση σε όλες τις περιπτώσεις είναι η ίδια: άκου πρώτα πώς σχεδιάστηκε η οικογένεια, μετά ρύθμισε γύρω από αυτό το χαρακτηριστικό, όχι ενάντια σε αυτό."
