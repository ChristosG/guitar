                              - generic [ref=f1e640]:
                                - paragraph [ref=f1e641]: "Πριν ανοίξουμε καθόλου θεωρία, θέλω τον μαθητή να παίξει πέντε λεπτά κάτι πολύ απλό: ένα ανοιχτό La (A) power chord ή απλά ανοιχτές χορδές, με σταθερό δυναμικό, εναλλάσσοντας τον selector switch της κιθάρας του ανά δύο-τρία χτυπήματα — μπρίτζ, μέση, λαιμός, όποιοι συνδυασμοί υπάρχουν. Δεν αλλάζουμε τίποτα άλλο· ίδιο pick, ίδιο σημείο palm, ίδια ένταση amp. Ο στόχος είναι καθαρά αντιληπτικός: να ακούσει με τα δικά του αυτιά, πριν του το πούμε εμείς, ότι το ίδιο instrument, στο ίδιο σημείο, αλλάζει tone ανάλογα με το ποιο pickup είναι ενεργό. Αν η κιθάρα του έχει και humbucker και single coil (π.χ. HSS Stratocaster), τόσο το καλύτερο — αυτή η αντίθεση θα είναι το υλικό πάνω στο οποίο θα χτίσουμε όλο το μάθημα."
                                - button "Επέκταση με συνομιλία" [ref=f1e644]
