                              - generic [ref=f1e1547]:
                                - paragraph [ref=f1e1548]: Σήμερα είδαμε ότι το cabinet δεν είναι παθητικό εξάρτημα αλλά ενεργό στάδιο διαμόρφωσης τόνου, εξίσου σημαντικό με τον ίδιο τον ενισχυτή. Μάθαμε τι είναι η σύνθετη αντίσταση (impedance) σε ohms, γιατί πρέπει πάντα να ταιριάζει ή να είναι ίση/μεγαλύτερη από την προτεινόμενη, και πώς η σύνδεση σε σειρά ή παράλληλα αλλάζει τόσο την αντίσταση όσο και τον χαρακτήρα του ήχου. Είδαμε επίσης πώς το μέγεθος και ο τύπος ηχείου (Vintage 30 έναντι Greenback, 1x12 έναντι 4x12, open-back έναντι closed-back) αλλάζουν το breakup και την αίσθηση όγκου, και πώς η θέση του μικροφώνου — on-axis, off-axis, close-mic ή room mic — μπορεί να αλλάξει τον ήχο περισσότερο από σχεδόν οποιαδήποτε άλλη ρύθμιση εξοπλισμού.
