                              - generic [ref=f1e2828]:
                                - paragraph [ref=f1e2829]: "Άνοιξε τη συζήτηση ρωτώντας τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά ανάμεσα στους τρεις τύπους delay και στις τρεις εφαρμογές, πριν του δώσεις την απάντηση — έτσι θα καταλάβεις αν άκουσε πραγματικά τη διαφορά ή απλώς είδε τα κουμπιά. Q: Ποια είναι η βασική διαφορά ανάμεσα σε analog και digital delay όσον αφορά τον μέγιστο χρόνο καθυστέρησης και την ποιότητα του ήχου; A: Το analog delay υποβαθμίζεται αισθητά πέρα από περίπου 500ms, ενώ το digital delay επιτρέπει πολύ μεγαλύτερους, καθαρότερους χρόνους καθυστέρησης επειδή μετατρέπει το σήμα σε ψηφιακό κώδικα. Q: Τι κάνει ένα slapback delay να ακούγεται σαν πάχος και όχι σαν ξεχωριστή ηχώ; A: Πολύ κοντός χρόνος καθυστέρησης (κάτω από περίπου 120ms), μία μόνο επανάληψη, και μείγμα σχεδόν ισόποσο με το dry σήμα. Q: Γιατί πρέπει το dotted-eighth delay να είναι συγχρονισμένο με το tempo του κομματιού μέσω tap tempo; A: Γιατί η επανάληψη πρέπει να πέφτει ακριβώς ανάμεσα στους παλμούς για να δημιουργήσει ρυθμικό, καταρρακτώδες μοτίβο· χωρίς συγχρονισμό το αποτέλεσμα ακούγεται απλώς θολό. Q: Ποια είναι η διαφορά ανάμεσα στα κουμπιά \"Feedback\"/\"Regen\" και \"Mix\"/\"Blend\" σε μια μονάδα delay; A: Το Feedback/Regen ελέγχει τον αριθμό των επαναλήψεων, ενώ το Mix/Blend ελέγχει πόσο δυνατό είναι το επεξεργασμένο (wet) σήμα σε σχέση με το αρχικό (dry)."
