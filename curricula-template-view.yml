                                - paragraph [ref=f1e2212]: "Άνοιξε τη συζήτηση ζητώντας από τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά ανάμεσα στα τρία επίπεδα gain πριν του δώσεις την απάντηση — αυτό δείχνει αν κατάλαβε τη λογική του clipping ή απλά απομνημόνευσε ονόματα πεδάλ. Q: Ποια είναι η βασική διαφορά ανάμεσα σε soft clipping και hard clipping; A: Το soft clipping στρογγυλεύει σταδιακά τις κορυφές του κύματος και παράγει αρμονικές πιο κοντά στον θεμελιώδη ήχο (πιο «ζεστό», συνδέεται με λυχνίες)· το hard clipping κόβει απότομα τις κορυφές, παράγοντας πιο έντονες ανώτερες αρμονικές (πιο σκληρό, συνδέεται με transistors/διόδους). Q: Γιατί ένα overdrive καθαρίζει όταν κατεβάζεις το volume knob της κιθάρας, ενώ ένα distortion δεν καθαρίζει το ίδιο; A: Το overdrive προσομοιώνει soft clipping ενός ενισχυτή λυχνίας, που είναι πολύ ευαίσθητο στο επίπεδο του σήματος εισόδου — μειώνοντας το σήμα, μειώνεται και το clipping. Το distortion κόβει πιο σκληρά και συμμετρικά με λιγότερη σχέση με τη δυναμική εισόδου, οπότε παραμένει πιο συμπιεσμένο ό,τι κι αν κάνεις με το χέρι σου. Q: Τι είναι το stacking και γιατί το πρώτο πεδάλ στη σειρά συχνά λειτουργεί σαν «boost»; A: Stacking είναι η σύνδεση δύο ή περισσότερων gain effects σε σειρά για πιο σύνθετο, πολυστρωματικό tone. Το πρώτο πεδάλ, με χαμηλό δικό του gain αλλά ανεβασμένο output, οδηγεί πιο δυνατά το δεύτερο πεδάλ, αλλάζοντας τον χαρακτήρα του clipping του δεύτερου χωρίς να ακούγεται απαραίτητα σαν ξεχωριστή πηγή παραμόρφωσης. Q: Γιατί το fuzz είναι πιο δύσκολο να παιχτεί με πλήρεις συγχορδίες απ' ό,τι με μονές νότες ή power chords; A: Το fuzz κόβει το πιο σκληρά και ασύμμετρα απ' όλα τα gain effects, και πάνω σε πολύφωνο υλικό αυτό παράγει ανεπιθύμητες δυσαρμονίες· γι' αυτό οι κιθαρίστες περιορίζονται συνήθως σε μονές νότες, power chords (ρίζα-πέμπτη-οκτάβα) ή απλές δίφωνες αρμονίες όταν παίζουν μέσα από βαρύ fuzz. Q: Ποιο ήταν το λάθος πολλών κιθαριστών σχετικά με την ποσότητα distortion, σύμφωνα με το παράδειγμα του Michael Ross; A: Ότι περισσότερο gain θα λύσει προβλήματα κακού tone, κακού sustain ή κακής τεχνικής — ενώ στην πραγματικότητα το υπερβολικό distortion θολώνει τον ήχο και τον βουλιάζει μέσα στο μείγμα της μπάντας· η λύση είναι συνήθως καλύτερο EQ, τεχνική ή εξοπλισμός, όχι περισσότερο gain."
