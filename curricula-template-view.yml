                              - generic [ref=f1e1110]:
                                - paragraph [ref=f1e1111]: "Δείξε στον μαθητή, στον πραγματικό ενισχυτή της τάξης, τα εξής τρία περάσματα, το καθένα στο ίδιο riff (ας πούμε ένα απλό power chord σε E, τέσσερα χτυπήματα): Πέρασμα 1 — Preamp gain χαμηλά (γύρω στο 2-3), master volume ψηλά (γύρω στο 7) ώστε η συνολική ένταση να είναι αρκετή για να ακουστεί καθαρά στο δωμάτιο. Ο μαθητής πρέπει να ακούσει έναν σχετικά καθαρό, δυναμικό ήχο που ανταποκρίνεται στο πόσο δυνατά χτυπάς τη χορδή. Πέρασμα 2 — Preamp gain ψηλά (γύρω στο 7-8), master volume χαμηλά (γύρω στο 2-3), ίδια συνολική ένταση δωματίου. Εδώ ο ήχος θα είναι πιο συμπιεσμένος, πιο \"έτοιμος\" να distort ανεξάρτητα από το πόσο δυνατά παίζεις — αυτό είναι preamp distortion. Πέρασμα 3 — αν ο ενισχυτής το επιτρέπει με ασφάλεια (χαμηλό wattage combo), preamp και master και τα δύο ψηλά, σπρώχνοντας όλο τον ενισχυτή — δείχνει τι εννοούσε ο Clapton το 1966: το power amp αρχίζει να συμπιέζει μόνο του, με μια πιο \"στρογγυλή\" αίσθηση στο attack. Σε κάθε πέρασμα, γύρνα και τον tone stack: κράτα το Gain σταθερό και δείξε πώς το ίδιο ποσό distortion ακούγεται εντελώς διαφορετικό αν σκαλίσεις τα mids προς τα κάτω (\"scooped\") σε σχέση με το να τα αφήσεις παρόντα. Ζήτα από τον μαθητή να προσέξει ότι το Middle κουμπί, σε πολλά αμπ, αλλάζει και το πώς ακούγονται τα Bass και Treble — δεν είναι ανεξάρτητα."
