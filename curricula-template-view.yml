                              - generic [ref=f1e1587]:
                                - paragraph [ref=f1e1588]: "Δέκα λεπτά ανοιχτής συζήτησης, με τον δάσκαλο να κρατά αυτή τη σελίδα και να θέτει τις παρακάτω ερωτήσεις στον μαθητή, περιμένοντας απάντηση πριν δώσει το κλειδί. Q: Αν ο ενισχυτής σου ζητάει ελάχιστη αντίσταση 8 ohms, μπορείς να συνδέσεις ένα cabinet 16 ohms με ασφάλεια; Τι θα χάσεις; A: Ναι, είναι ασφαλές· θα χάσεις απλώς λίγη ένταση, σαν φυσικό power soak. Το επικίνδυνο είναι το αντίθετο — να συνδέσεις κάτι με χαμηλότερη αντίσταση από την προτεινόμενη. Q: Δύο ηχεία των 8 ohms σε παράλληλη σύνδεση — ποια είναι η συνολική αντίσταση; A: 4 ohms. Q: Ποια θέση μικροφώνου δίνει πιο ζεστό, πιο στρογγυλό ήχο: on-axis ή off-axis/edge-of-cone; A: Off-axis / edge-of-cone δίνει πιο ζεστό και στρογγυλό ήχο, ενώ on-axis δίνει πιο λαμπερό και επιθετικό. Q: Γιατί ένα room mic προσθέτει κάτι που δεν έχει το close mic; A: Το close mic απομονώνει το ηχείο δίνοντας άμεσο, στεγνό σήμα· το room mic προσθέτει την αίσθηση χώρου και το 'ανάσασμα' του cabinet μέσα στο δωμάτιο, κάτι που ο ακροατής νιώθει ζωντανά αλλά χάνεται όταν το μικρόφωνο είναι κολλημένο πάνω στο ηχείο."
