                              - generic [ref=f1e2507]:
                                - paragraph [ref=f1e2508]: "Θα παίξω τρία περάσματα πάνω στην ίδια φράση από το warm-up (G πεντατονική, τέμπο ~80bpm) για να ακούσετε τη διαφορά καθαρά. Πρώτα, octave pedal σε λειτουργία «κάτω μία οκτάβα» με το mix στο 50%: παίζω τη φράση αργά, νότα-νότα, ώστε να ακούσετε το tracking — πόσο καθαρά «κλειδώνει» το pedal στη νότα, ειδικά όταν παίζω δύο φθόγγους μαζί (κάτι που μπερδεύει τα περισσότερα octave pedals, γιατί δεν μπορούν να ανιχνεύσουν σωστά θεμελιώδη πάνω σε διπλές νότες ή συγχορδίες). Μετά περνάω σε mix 100% effect για να ακούσετε πόσο βαθιά και μπασόηχη γίνεται μια απλή γραμμή. Έπειτα, harmonizer σε G major, ρυθμισμένο για διατονική τρίτη πάνω (smart mode): παίζω την ίδια πεντατονική φράση και ακούτε πώς το διάστημα αλλάζει αυτόματα ανάμεσα σε μικρή και μεγάλη τρίτη καθώς κινούμαι στην κλίμακα — αυτό είναι το «smart» tracking που περιγράψαμε στη θεωρία. Μετά αλλάζω σε «dumb» mode σταθερής μεγάλης τρίτης, ώστε να ακούσετε πώς κάποιες νότες αρχίζουν να ηχούν εκτός κλίμακας. Τέλος, pitch-shifter ρυθμισμένο μόλις μερικά cents flat (περίπου -10 έως -15 cents), σε μείξη περίπου 50/50 με το dry σήμα — η κλασική «country-style» ρύθμιση παχύνσεως που περιγράφει ο Michael Ross. Παίζω τις ίδιες συγχορδίες που έπαιξα στο warm-up και συγκρίνουμε: πρώτα με chorus ενεργό, μετά με το pitch shift. Θα ακούσετε πως το chorus «κυματίζει», ενώ το pitch shift μένει σταθερό αλλά προσθέτει πάχος και λάμψη χωρίς να θολώνει το attack των συγχορδιών. Αξίζει επίσης μια σύντομη ιστορική αναφορά: το Octavia — ένα εφέ που συνδύαζε οκτάβα-πάνω με fuzz — ήταν μέρος του rig τόσο του Hendrix όσο και του Stevie Ray Vaughan, δίπλα σε Fuzz Face, Uni-Vibe και wah-wah pedals, δείχνοντας πόσο παλιά και θεμελιώδης είναι η χρήση του octave effect στο rock lead playing."
