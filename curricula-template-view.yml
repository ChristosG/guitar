                              - generic [ref=f1e1707]:
                                - paragraph [ref=f1e1708]: Οι ασκήσεις αυτές στοχεύουν στο να μάθει ο μαθητής να ακούει, όχι απλώς να ρυθμίζει κουμπιά. Θέλουμε να συνδέσει με το αυτί του τη διαφορά preamp/power amp distortion και soft/hard clipping πριν προχωρήσουμε σε πιο σύνθετα rigs στα επόμενα μαθήματα. Gain staging A/B (8 min) Παίξε το ίδιο riff πρώτα με preamp gain χαμηλά/master volume ψηλά, μετά preamp gain ψηλά/master volume χαμηλά, στην ίδια ακουστική ένταση. Σημείωσε τι αλλάζει στην αρμονική πυκνότητα και στη συμπίεση. Λυχνία εναντίον πεταλιού (8 min) Σύγκρινε το cranked preamp του ενισχυτή με ένα πεντάλ distortion μπροστά από καθαρό κανάλι, στην ίδια περίπου ένταση κορεσμού. Δοκίμασε να χαμηλώσεις το volume knob της κιθάρας και σε τα δύο και άκουσε ποιο 'καθαρίζει' πιο φυσικά. Stacking δύο σταδίων (6 min) Βάλε ένα ήπιο overdrive πεντάλ μπροστά από ένα ήδη ελαφρώς distorted preamp. Άκουσε πώς αλλάζει ο χαρακτήρας σε σχέση με το να ανεβάσεις απλώς το gain του ίδιου σταδίου.
                                - link "Guitar Tone & Gear — Course Spine, σελ. 1" [ref=f1e1710] [cursor=pointer]:
