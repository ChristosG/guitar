                              - generic [ref=f1e4118]:
                                - paragraph [ref=f1e4119]: "Τρεις σύντομες ασκήσεις που δουλεύουν την ικανότητα σύγκρισης και επιλογής ανάμεσα σε vintage-style και modeling προσεγγίσεις. A/B τυφλή δοκιμή (8 min) Ο δάσκαλος παίζει την ίδια δίμετρη φράση (π.χ. ένα απλό blues lick σε Mi) μία φορά μέσω πραγματικού ενισχυτή/pedal και μία φορά μέσω modeler, χωρίς ο μαθητής να βλέπει ποιο είναι ποιο. Ο μαθητής προσπαθεί να μαντέψει και να περιγράψει με λέξεις τη διαφορά (πιο σφιχτό bass, πιο «στρωτό» breakup, κ.λπ.). Αναπαραγωγή εμβληματικού tone με ό,τι υπάρχει (10 min) Διάλεξε έναν από τους εμβληματικούς ήχους που έχετε ήδη καλύψει στο module (π.χ. Clapton's Bluesbreaker tone ή Hendrix's Marshall/Fuzz Face) και προσπάθησε να τον πλησιάσεις με ό,τι έχεις διαθέσιμο σήμερα — modeler preset ή pedal chain. Συζητήστε τι λείπει και γιατί. Κόστος/πρακτικότητα vs tone (7 min) Γράψτε μαζί έναν σύντομο πίνακα πλεονεκτημάτων-μειονεκτημάτων: vintage gear (κόστος, αξία, αναξιοπιστία, μοναδικότητα) εναντίον modeling (φορητότητα, συνέπεια, silent practice, IRs) με βάση όσα μόλις ακούσατε."
