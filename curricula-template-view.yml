                          - generic [ref=f1e3656]:
                            - paragraph [ref=f1e3657]: Ο μαθητής θα κατανοήσει γιατί το ίδιο ρig ακούγεται διαφορετικά σε ζωντανή εμφάνιση και σε ηχογράφηση, και θα μάθει πρακτικούς κανόνες για να προσαρμόζει EQ, effects και δυναμική ανάλογα με το context. Η ώρα κλείνει με μια συζήτηση πάνω σε πραγματικά παραδείγματα εμβληματικών ήχων και το πώς άλλαξαν από σκηνή σε δίσκο.
