                              - generic [ref=f1e3548]:
                                - paragraph [ref=f1e3549]: "Το πιο συχνό λάθος είναι να ταυτίζουμε έναν εμβληματικό ήχο με ένα μόνο στοιχείο του gear και να το υπερβάλλουμε. Πολλοί μαθητές που προσπαθούν να παίξουν 'σαν Van Halen' ρίχνουν πολύ περισσότερο gain απ' όσο χρησιμοποιούσε ο ίδιος, νομίζοντας ότι το sustain βγαίνει από το pedal — ενώ, όπως σημειώνει το βιβλίο, οι περισσότεροι μιμητές του χρησιμοποιούν 'way too much gain and distortion as a short cut' σε σχέση με τη δύναμη που έβγαζε ο ίδιος από τα δάχτυλά του, και χάνουν την άρθρωσή του στην πορεία. Παρόμοιο λάθος γίνεται με τον Hendrix: πολλοί τον ταυτίζουν αποκλειστικά με υπερβολικό fuzz, ξεχνώντας ότι πολλά από τα πιο αναγνωρίσιμα κομμάτια του είναι καθαρά ή ελαφρώς driven. Δεύτερο συχνό λάθος: όταν δοκιμάζουμε το 'woman tone' του Clapton, οι μαθητές συχνά κλείνουν το tone knob σε λάθος πικάπ (π.χ. στο bridge αντί για το neck) ή δεν αυξάνουν αρκετά το gain του ενισχυτή, με αποτέλεσμα έναν απλά 'θαμπό' ήχο αντί για τον παχύ, φωνητικό χαρακτήρα που αναζητούμε. Τρίτο, πολλοί προσπαθούν να αναπαράγουν τον Edge ή τον Gilmour γεμίζοντας τον ήχο με πολλά ταυτόχρονα effects, ενώ και οι δύο βασίζονταν σε σχετικά λίγα στοιχεία (κυρίως delay) μέσα σε έναν ηχητικό χώρο που τους άφηνε το υπόλοιπο σχήμα — αν προσθέσεις την ίδια πυκνότητα effects πάνω σε ένα γεμάτο μείγμα, ο ήχος απλώς χάνεται."
