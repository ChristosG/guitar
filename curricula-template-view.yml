                                - paragraph [ref=f1e381]: Μέχρι το επόμενο μάθημα, ο μαθητής κάνει το τεστ ξεβυσμένης χτύπας σε όσες κιθάρες έχει πρόσβαση —τη δική του σίγουρα, και αν μπορεί δανείζεται ή δοκιμάζει σε κατάστημα μία διαφορετικού τύπου σώματος. Για κάθε όργανο κρατάει σημειώσεις με τρεις λέξεις-περιγραφή (π.χ. «φωτεινή, λεπτή, γρήγορο decay») και προσπαθεί να μαντέψει τον τύπο ξύλου/κατασκευής πριν το επιβεβαιώσει. Ξέρει ότι το πέτυχε όταν μπορεί να εξηγήσει με δικά του λόγια γιατί δύο κιθάρες ακούγονται διαφορετικά ξεβυσμένες, αναφέροντας τύπο σώματος ή βάρος ξύλου, όχι απλώς «τη μία μου αρέσει περισσότερο».
