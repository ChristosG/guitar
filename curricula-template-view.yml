                                - paragraph [ref=f1e3194]: Μέχρι το επόμενο μάθημα, ζωγράφισε στο χαρτί το δικό σου pedalboard (ή αυτό που σκοπεύεις να χτίσεις) με τη σωστή σειρά chain of command, σημειώνοντας πού θα έβαζες buffer αν χρειάζεται και αν ο ενισχυτής σου έχει FX loop. Δοκίμασε το στην πράξη τουλάχιστον 15 λεπτά, παίζοντας το ίδιο riff ή την ίδια προοδο συγχορδιών με τη σωστή σειρά και με μία εσκεμμένη «λάθος» σειρά, και γράψε δύο προτάσεις για το τι άκουσες διαφορετικό. Θα ξέρεις ότι το έχεις καταλάβει όταν μπορείς να προβλέψεις, πριν καν αλλάξεις τη σειρά ενός pedal, πώς θα αλλάξει ο ήχος.
