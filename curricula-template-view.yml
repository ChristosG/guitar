                                - paragraph [ref=f1e580]: "Μέχρι το επόμενο μάθημα, ο μαθητής φέρνει την κιθάρα του και ένα σημείωμα με: (1) αν παρατήρησε buzz ή fret-out σε συγκεκριμένα τάστα, (2) τα αποτελέσματα του intonation check ανά χορδή (ποιες χορδές ήταν sharp/flat στο 12ο τάστο σε σχέση με τον αρμονικό), και (3) πόσο καιρό έχει να αλλάξει χορδές, αφού το intonation πρέπει πάντα να ελέγχεται με φρέσκες χορδές. Δεν χρειάζεται να κάνει καμία ρύθμιση μόνος του στο truss rod — μόνο παρατήρηση και καταγραφή. Θα ξέρει ότι το «πέτυχε» αν μπορεί να εξηγήσει, με δικά του λόγια, γιατί μια νότα βγήκε sharp όταν πάτησε πολύ δυνατά, και ποια θα ήταν η πρώτη του κίνηση αν ο λαιμός φαινόταν να έχει backbow."
