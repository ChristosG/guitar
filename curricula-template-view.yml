                              - generic [ref=f1e2176]:
                                - paragraph [ref=f1e2177]: "Σήμερα είδαμε ότι overdrive, distortion και fuzz δεν είναι απλώς «τρεις βαθμοί έντασης» αλλά τρεις διαφορετικοί τύποι clipping: soft και ευαίσθητο στο άγγιγμα το overdrive, πιο σκληρό και συμπιεσμένο το distortion, το πιο ακραίο και ασύμμετρο το fuzz. Μάθαμε επίσης το stacking — τη σύνδεση δύο gain effects σε σειρά ώστε το ένα να λειτουργεί σαν boost για το άλλο, χτίζοντας πολυστρωματικό tone χωρίς να χρειάζεται ένα μόνο πεδάλ να κάνει όλη τη δουλειά."
