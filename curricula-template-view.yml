                              - generic [ref=f1e900]:
                                - paragraph [ref=f1e901]: "Οι ασκήσεις αυτής της ενότητας δεν στοχεύουν σε νέο ρεπερτόριο αλλά σε ελεγχόμενη ακρόαση: ο μαθητής παίζει το ίδιο μουσικό υλικό αλλάζοντας κάθε φορά μία μόνο μεταβλητή, ώστε να ακούσει καθαρά τι προκαλεί τι. Κρατάμε ημερολόγιο εντυπώσεων μετά από κάθε άσκηση. Δοκιμή πένας (6 min) Παίξε ένα απλό open G chord strumming pattern (τέσσερα down-up χτυπήματα ανά μέτρο) διαδοχικά με thin, medium και heavy πένα, στην ίδια ένταση και ταχύτητα. Σημείωσε λέξεις-κλειδιά (φωτεινό, παχύ, αδύναμο, γεμάτο) για κάθε πένα. Θέση δεξιού χεριού (6 min) Με σταθερή medium πένα, παίξε ένα μονό riff τεσσάρων νοτών στη χαμηλή Ε χορδή (frets 0-2-3-0) μετακινώντας το δεξί χέρι από τη γέφυρα προς το λαιμό σε τρία στάδια. Άκουσε πώς αλλάζει η φωτεινότητα χωρίς καμία αλλαγή στο volume ή tone knob. Δυναμική attack (6 min) Παίξε την ίδια συγχορδία progression (C - Am - F - G, open position, ένα χτύπημα ανά συγχορδία) τρεις φορές: μία με δυνατό, σίγουρο χτύπημα, μία με πολύ απαλό, και μία με τη φυσική σου ένταση. Σύγκρινε πώς αλλάζει η αίσθηση authority που περιγράφει ο Ross. Άσκηση SRV-style downstrokes (5 min) Παίξε ένα απλό blues shuffle riff σε Ε χρησιμοποιώντας αποκλειστικά downstrokes, βάζοντας όσο μπορείς περισσότερο βάρος του χεριού σε κάθε χτύπημα, όπως περιγράφεται για τον Stevie Ray Vaughan. Στόχος είναι να νιώσεις τη διαφορά ανάμεσα σε αυτό και σε ένα ελαφρύ alternate picking."
