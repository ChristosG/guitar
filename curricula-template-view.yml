                              - generic [ref=f1e1307]:
                                - paragraph [ref=f1e1308]: "Οι ασκήσεις εδώ χωρίζονται σε δύο σκέλη: αναγνώριση με το αυτί, και πρακτική στη ρύθμιση. Ο στόχος είναι ο μαθητής να μπορεί, ακούγοντας ένα δίσκο ή έναν ζωντανό ήχο, να πει με σχετική σιγουριά αν είναι Fender, Marshall, Vox ή high-gain, και αντίστροφα, να μπορεί να ρυθμίσει έναν ενισχυτή ώστε να πλησιάσει τη μία ή την άλλη φωνή. Blind listening — αναγνώριση οικογένειας (8 min) Ο δάσκαλος παίζει (ή βάζει ηχητικά παραδείγματα από) τρία-τέσσερα σύντομα αποσπάσματα σε διαφορετικές ρυθμίσεις ενισχυτή χωρίς να αποκαλύπτει ποια είναι ποια. Ο μαθητής προσπαθεί να αναγνωρίσει Fender, Marshall, Vox ή high-gain μόνο από το χαρακτήρα των μεσαίων και το πόσο νωρίς σπάει ο ήχος. Ρύθμιση Fender-style clean headroom (5 min) Στον ενισχυτή του μαθητή (ή σε modeling unit), ρύθμισε χαμηλό gain, scooped mid, ψηλό treble, και παίξε ανοιχτές συγχορδίες δυνατά — στόχος είναι να ακούσεις πόσο αργά σπάει ο ήχος ακόμα και όταν χτυπάς δυνατά. Ρύθμιση Marshall-style crunch (5 min) Ανέβασε το gain σε μέτριο-ψηλό επίπεδο, ανέβασε το mid, και παίξε τα ίδια power chords από τη Demonstration στο 6ο-8ο-3ο τάστο. Άκουσε πώς το ανεβασμένο mid κάνει το riff να κόβει περισσότερο. Ρύθμιση Vox-style chime (5 min) Μέτριο gain, ψηλό αλλά όχι σκληρό treble, και παίξε μια απλή αρπέζ γραμμή σε ανοιχτές συγχορδίες (π.χ. Cadd9, G, D) — άκουσε το καμπάνινο, ελαφρώς συμπιεσμένο attack. Ρύθμιση high-gain cascading (5 min) Ψηλό gain, σφιχτά μπάσα, μέτριο treble, και παίξε τα ίδια power chords γρήγορα με palm muting — άκουσε πόσο καθαρή παραμένει κάθε νότα παρά το πολύ gain."
