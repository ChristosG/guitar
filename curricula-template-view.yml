                              - generic [ref=f1e3596]:
                                - paragraph [ref=f1e3597]: "Διάλεξε ένα από τα έξι rigs που είδαμε σήμερα και προσπάθησε να το προσεγγίσεις με το δικό σου εξοπλισμό για 20-30 λεπτά, γράφοντας σε ένα τετράδιο ποιες ρυθμίσεις δούλεψαν και ποιες όχι. Μετά, άκουσε ενεργά (όχι σαν background μουσική) μία από τις προτεινόμενες ηχογραφήσεις: για Clapton το άλμπουμ Bluesbreakers with Eric Clapton, για Hendrix τα studio albums του (π.χ. Electric Ladyland) ή το ζωντανό Band of Gypsys, για SRV το Greatest Hits, για Gilmour το The Wall, για τον Edge το Achtung Baby, και για Van Halen το πρώτο άλμπουμ των Van Halen. Σημείωσε τρία συγκεκριμένα σημεία όπου αναγνωρίζεις τεχνική (όχι μόνο gear) που περιγράψαμε σήμερα — π.χ. πού αλλάζει η δυναμική επίθεσης, πού μπαίνει το wah, πού «αναπνέει» ο ηχητικός χώρος γύρω από το delay."
