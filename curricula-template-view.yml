                              - generic [ref=f1e3670]:
                                - paragraph [ref=f1e3671]: Ξεκίνα παίζοντας ένα γνωστό riff ή μια progression που ο μαθητής ξέρει καλά, καθαρά, στο amp του, για 2-3 λεπτά, ρυθμισμένο όπως θα το έπαιζε σε πρόβα με μπάντα (δηλαδή με τα mids αρκετά παρόντα ώστε να 'κόβει'). Μετά ζήτησέ του να παίξει το ίδιο πράγμα με τα mids σχεδόν στο μηδέν και bass/treble ανεβασμένα - το λεγόμενο 'scooped' setting. Η άσκηση δεν έχει σκοπό να διδάξει κάτι καινούριο τεχνικά, αλλά να ξυπνήσει το αυτί στο ότι η ίδια κιθάρα, το ίδιο amp, μπορεί να ακούγεται εντελώς διαφορετικά ανάλογα με το πόσο 'μόνη' παίζει. Αυτό προετοιμάζει το έδαφος για τη συζήτηση περί live έναντι studio tone, όπου η έννοια του 'μόνος εναντίον μέσα σε μείγμα' είναι κεντρική.
                                - button "Επέκταση με συνομιλία" [ref=f1e3674]
                            - generic [ref=f1e3675]:
