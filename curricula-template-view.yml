                              - generic [ref=f1e1565]:
                                - paragraph [ref=f1e1566]: "Μέχρι το επόμενο μάθημα, ο μαθητής πρέπει να: (1) βρει το manual ή τις προδιαγραφές του δικού του ενισχυτή/cabinet και να σημειώσει την ονομαστική αντίσταση σε ohms, ώστε να ξέρει τι μπορεί και τι δεν μπορεί να συνδέσει με ασφάλεια· (2) αν έχει πρόσβαση σε κινητό με μικρόφωνο ή audio interface, να ηχογραφήσει 3 σύντομα δείγματα του ίδιου riff με το μικρόφωνο σε τρεις διαφορετικές θέσεις (κέντρο, άκρη, 1 μέτρο μακριά) και να τα φέρει την επόμενη φορά για ακρόαση μαζί· (3) να ακούσει προσεκτικά ένα αγαπημένο του δίσκο και να προσπαθήσει να εντοπίσει αν ο ήχος της κιθάρας ακούγεται 'κοντά/στεγνός' (close-mic) ή 'μακρινός/με αμπιάνς' (room mic), γράφοντας 2-3 παραδείγματα τραγουδιών. Ο μαθητής ξέρει ότι το πέτυχε όταν μπορεί να εξηγήσει με δικά του λόγια γιατί δεν πρέπει ποτέ να συνδέσει cabinet χαμηλότερης αντίστασης από την προτεινόμενη."
