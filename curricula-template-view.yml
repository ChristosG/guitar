                                - paragraph [ref=f1e3009]: "Μέχρι το επόμενο μάθημα, εξασκήσου 15 λεπτά την ημέρα με το reverb του δικού σου ενισχυτή ή pedal: παίξε το ίδιο riff σε τρεις διαφορετικές ρυθμίσεις reverb (χαμηλό, μεσαίο, υψηλό) και ηχογράφησε τον εαυτό σου με το κινητό. Άκουσε πίσω και σημείωσε σε ποιο σημείο το reverb αρχίζει να 'πνίγει' τις νότες αντί να τις υποστηρίζει. Ξέρεις ότι το πέτυχες όταν μπορείς να περιγράψεις με ακρίβεια τι άκουσες — 'μεταλλικό decay', 'λείο και συμπαγές', ή 'μεγάλο και ατμοσφαιρικό' — χωρίς να κοιτάξεις ποια ρύθμιση χρησιμοποίησες."
