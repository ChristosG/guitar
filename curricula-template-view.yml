                              - generic [ref=f1e1647]:
                                - paragraph [ref=f1e1648]: "Στα προηγούμενα μαθήματα είδαμε ότι ο ενισχυτής έχει δύο βασικά στάδια, το preamp και το power amp, και ότι ο τρόπος με τον οποίο αυτά τα δύο στάδια μοιράζονται το gain καθορίζει τον χαρακτήρα του ήχου. Σήμερα μπαίνουμε στη φυσική αυτού του φαινομένου: τι ακριβώς είναι το distortion και γιατί κάποιες μορφές του ακούγονται 'ζεστές' ενώ άλλες 'σκληρές'. Η βασική αρχή είναι το clipping: όταν ένα σήμα ξεπερνάει το όριο που μπορεί να διαχειριστεί καθαρά ένα κύκλωμα, οι κορυφές του κυματομορφής κόβονται ή 'ισοπεδώνονται', και αυτή η παραμόρφωση της κυματομορφής δημιουργεί νέες συχνότητες —αρμονικές— που δεν υπήρχαν στο αρχικό σήμα. Η πηγή αυτού του υλικού το θέτει καθαρά: υπάρχει «soft» distortion, που δημιουργείται από λυχνίες που υπερφορτώνονται σταδιακά, και «hard» distortion, που δημιουργείται από transistors που παραμένουν καθαρά μέχρι ένα σημείο και μετά παραμορφώνουν απότομα· τα transistors «tend to remain clean up to a certain point and then distort, whereas tubes move more gradually from clean into increasing amounts of distortion», κάτι που δίνει στις λυχνίες μεγαλύτερη δυναμική ευελιξία. Το ίδιο φαινόμενο περιγράφεται τεχνικά αλλού: «Soft clipping» gradually flattens the peaks of a signal which creates a number of higher harmonics which share a harmonic relationship with the original tone», ενώ «Hard clipping» flattens peaks abruptly, resulting in higher power in higher harmonics» — και όσο πιο σκληρό γίνεται το clipping, τόσο περισσότερο το κύμα μοιάζει με τετράγωνο κύμα, κάτι που ακούγεται πιο 'σκληρό' και 'βρώμικο'. Είναι σημαντικό να ξεχωρίσουμε πού μέσα στην αλυσίδα συμβαίνει αυτό το clipping, γιατί δεν έχει το ίδιο αποτέλεσμα παντού. Το preamp είναι το πρώτο στάδιο που δέχεται το σήμα από τα pickups και το ανεβάζει σε επίπεδο ικανό να οδηγήσει το power amp· όταν αυτό το στάδιο οδηγείται σε παραμόρφωση, το αποτέλεσμα είναι πιο συμπυκνωμένο, με περισσότερη συμπίεση και αρμονικές —αυτό είναι το γνωστό preamp gain ή preamp distortion. Το power amp, από την άλλη, είναι το στάδιο που δίνει την τελική ισχύ στα ηχεία· όταν αυτό οδηγείται σε clipping, το αποτέλεσμα είναι πιο συμμετρικό, με κυρίως odd-order αρμονικές, και συχνά απαιτεί πολύ μεγαλύτερη ένταση για να επιτευχθεί. Ιστορικά, οι πρώτοι ενισχυτές όπως ο Marshall Super Lead είχαν έναν μόνο volume control, οπότε το μόνο τρόπο να πάρεις distortion ήταν να ανεβάσεις όλη την ένταση μέχρι να 'σπάσει' το power amp — «the more volume, the more distortion». Αυτό άλλαξε με την εισαγωγή του master volume, ενός δεύτερου volume control μετά το preamp, που επέτρεπε στον παίκτη να οδηγήσει το preamp σε distortion και μετά να χαμηλώσει τη συνολική ένταση στα λογικά όρια — μια εξέλιξη που, μαζί με τον σχεδιασμό «cascading» gain stages του Mesa/Boogie, οδήγησε στο σύγχρονο high-gain amp. Υπάρχουν επίσης δευτερεύουσες πηγές distortion, όπως ο κορεσμός του output transformer και το φαινόμενο «sag» —η πτώση τάσης στο power supply όταν ο ενισχυτής παίζει δυνατά, που συμπιέζει το attack μιας νότας και ενισχύει την αίσθηση sustain. Η ίδια ιστορία εξηγεί γιατί εμφανίστηκαν τα πρώτα πεντάλ distortion. Το βιβλίο του Michael Ross περιγράφει πώς ο Eric Clapton, παίζοντας μια Les Paul μέσα από ένα 50-watt Marshall combo στο άλμπουμ των Bluesbreakers, αρνήθηκε να χαμηλώσει την ένταση όταν ο μηχανικός παραπονέθηκε ότι ο ενισχυτής παραμορφωνόταν — και αυτός ο ήχος έγινε το πρότυπο του σύγχρονου rock guitar tone. Όμως δεν μπορούσε κάθε κιθαρίστας να παίζει σε τέτοια ένταση σε κάθε σκηνή, οπότε η τεχνολογία αναζήτησε τρόπο να αναπαράγει αυτό το «warm singing tone» σε οποιαδήποτε ένταση: πρώτα με τα λεγόμενα «fuzztones» — πρωτόγονα κουτιά που δεν έμοιαζαν καθόλου με cranked tube amp αλλά είχαν το δικό τους buzzsaw-like χαρακτήρα — και αργότερα με πιο εκλεπτυσμένα distortion boxes που έβαζαν μια λυχνία preamp μέσα σε ένα μικρό κουτί για να μιμηθούν καλύτερα την υπερφόρτωση ενός power amp. Σήμερα ξεχωρίζουμε τρεις κατηγορίες gain πεταλιών: το overdrive μιμείται ένα tube amp που οδηγείται σε soft clipping, μένει ευαίσθητο στη δυναμική του χεριού και καθαρίζει όταν χαμηλώνεις το volume της κιθάρας· το distortion κόβει πιο σκληρά και συμμετρικά, δίνοντας πιο κορεσμένο και λιγότερο δυναμικό ήχο κατάλληλο για rock ρυθμικά· και το fuzz κόβει πιο σκληρά και ασύμμετρα απ' όλα, δίνοντας μια πιο παχιά, μερικές φορές gated υφή. Τέλος, να θυμάσαι πάντα ότι το equalization παίζει καθοριστικό ρόλο στον χαρακτήρα του distortion: αλλάζοντας τα tone controls πριν ή μετά το clipping στάδιο αλλάζεις ριζικά το πώς ακούγεται η ίδια ποσότητα gain."
