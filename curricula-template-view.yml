                          - generic [ref=f1e3836]:
                            - paragraph [ref=f1e3837]: Ο μαθητής μαθαίνει τις βασικές «συνταγές» EQ που χρησιμοποιούν blues/classic rock, metal και funk/country παίκτες, και εξασκείται να αποφασίζει πότε ένα εφέ εξυπηρετεί τη μουσική και πότε απλώς τη θολώνει. Η ύλη χτίζει πάνω στα προηγούμενα μαθήματα του module (context live/studio, εμβληματικοί ήχοι) και τα μεταφράζει σε πρακτικές ρυθμίσεις amp και pedalboard.
                            - button "Επέκταση με συνομιλία" [ref=f1e3840]
                          - generic [ref=f1e3841]:
                            - generic [ref=f1e3842]:
                              - generic [ref=f1e3843]:
                                - button "Ζέσταμα" [ref=f1e3845]
