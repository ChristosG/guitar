                              - generic [ref=f1e2684]:
                                - paragraph [ref=f1e2685]: "Το delay καταγράφει το σήμα της κιθάρας και το αναπαράγει μετά από συγκεκριμένο χρόνο, δημιουργώντας μία ή περισσότερες ηχώ (echoes) της αρχικής νότας. Η φύση αυτής της επανάληψης αλλάζει δραματικά ανάλογα με τη ρύθμιση του χρόνου, κάτι που είδαμε ήδη σε αδρές γραμμές στο Module 7 του βασικού μας οδηγού: ένα κοντό slapback delay (κάτω από περίπου 120ms) πυκνώνει τη νότα χωρίς αισθητή ξεχωριστή ηχώ, ένα dotted-eighth delay συγχρονίζεται ρυθμικά για να φτιάξει καταρράκτη επαναλήψεων, και ένα ping-pong delay εναλλάσσει τις επαναλήψεις ανάμεσα σε αριστερό και δεξί κανάλι για ευρύ, στερεοφωνικό αποτέλεσμα. Ιστορικά, το πρώτο delay ήταν το tape delay: το σήμα γραφόταν σε μαγνητοταινία στην κεφαλή εγγραφής και αναπαραγόταν λίγο αργότερα από την κεφαλή αναπαραγωγής, με τον χρόνο καθυστέρησης να καθορίζεται από την ταχύτητα της ταινίας και την απόσταση ανάμεσα στις κεφαλές — έτσι γεννήθηκε το Echoplex, και έτσι δημιουργήθηκε το κλασικό «slap» echo της rockabilly ηχογράφησης, ένα κοντό, μονό delay μιξαρισμένο σχεδόν στην ίδια ένταση με το αρχικό σήμα. Το analog delay αντικατέστησε την ταινία με chip, μικραίνοντας τη συσκευή, αλλά η ποιότητα του ήχου υποβάθμιζε αισθητά πέρα από τα 500 χιλιοστά του δευτερολέπτου καθυστέρησης. Το digital delay έλυσε αυτό το πρόβλημα μετατρέποντας το σήμα σε ψηφιακό κώδικα, επιτρέποντας πολύ μεγαλύτερους και καθαρότερους χρόνους καθυστέρησης — αλλά με το τίμημα ότι σε κοντούς χρόνους η επανάληψη ακούγεται μερικές φορές υπερβολικά καθαρή, «τεχνητή», σε σχέση με τη φυσική απώλεια υψηλών συχνοτήτων που έχει μια πραγματική ηχώ σε δωμάτιο. Κάθε μονάδα delay έχει συνήθως τρεις βασικούς ελέγχους, όσο κι αν κάθε κατασκευαστής τους ονομάζει διαφορετικά: τον χρόνο καθυστέρησης (\"Delay Time\", \"Effect\" ή απλώς \"Delay\"), τον αριθμό επαναλήψεων (\"Feedback\", \"Regen\" ή \"Repeat\") και το ποσοστό μείγματος ανάμεσα στο αρχικό (\"dry\") και το επεξεργασμένο (\"wet\") σήμα (\"Mix\", \"Blend\" ή πάλι \"Delay\"). Το slapback χρησιμοποιεί κοντό χρόνο, έναν μόνο επαναλαμβανόμενο ήχο και μείγμα σχεδόν ισόποσο με το dry σήμα. Το dotted-eighth delay χρειάζεται τον χρόνο συγχρονισμένο ακριβώς με το tempo του κομματιού ώστε η επανάληψη να πέφτει ανάμεσα στους παλμούς και να δημιουργεί εκείνο το γνωστό, κυλιόμενο μοτίβο. Το ping-pong χρειάζεται στερεοφωνική έξοδο ή δύο ενισχυτές για να ακουστεί σωστά, αφού η ουσία του είναι η εναλλαγή αριστερά-δεξιά."
