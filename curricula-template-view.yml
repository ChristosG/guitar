                              - generic [ref=f1e3206]:
                                - paragraph [ref=f1e3207]: "Άνοιξε τη συζήτηση ζητώντας από τον μαθητή να εξηγήσει με δικά του λόγια γιατί η σειρά έχει σημασία, πριν του δώσεις τις σωστές απαντήσεις παρακάτω. Q: Γιατί το distortion μπαίνει πριν το chorus ή το delay στο chain of command, και όχι μετά; A: Γιατί θέλουμε να παραμορφώσουμε το πιο καθαρό δυνατό σήμα· αν το chorus ή το delay προηγηθούν, το distortion παραμορφώνει και τις επαναλήψεις/διαμορφώσεις τους μαζί με τη νότα, με αποτέλεσμα θολό, fizzy ήχο αντί για καθαρή παραμόρφωση. Q: Ποια είναι η διαφορά ανάμεσα σε true bypass και buffered bypass; A: Στο true bypass το pedal, όταν είναι σβηστό, βγαίνει εντελώς έξω από το κύκλωμα — καμία χρωματική επίδραση αλλά και καμία ενίσχυση σήματος. Στο buffered bypass υπάρχει πάντα ενεργός buffer μέσα στο pedal που διατηρεί δυνατό το σήμα, ακόμα κι όταν το pedal είναι σβηστό. Q: Τι προβλήματα μπορεί να προκαλέσει ένα board με πολλά true bypass pedals σε σειρά και μεγάλα καλώδια, αν δεν υπάρχει κανένας buffer; A: Το σήμα της κιθάρας χάνει σταδιακά τις υψηλές συχνότητές του — «tone-sucks» — γιατί ταξιδεύει μέσα από πολλά μέτρα καλωδίου και πολλά bypassed κυκλώματα χωρίς καμία ενίσχυση στη διαδρομή. Q: Γιατί ένα FX loop συχνά ακούγεται καθαρότερο για delay/reverb σε σχέση με το να τα βάλεις μπροστά στην είσοδο ενός distorted ενισχυτή; A: Γιατί το FX loop τοποθετεί τα modulation/time εφέ μετά το gain stage του preamp και πριν το power amp, οπότε δεν παραμορφώνονται μαζί με το ήδη distorted σήμα, ακριβώς όπως λέει και ο κανόνας να μπαίνουν τα χρονικά εφέ τελευταία στην αλυσίδα. Q: Ποιος είναι ο μοναδικός πραγματικά «αυστηρός» κανόνας που δίνει ο Ross για τη σειρά σύνδεσης, και τι σημαίνει αυτό στην πράξη; A: «If it sounds good - do it!» — σημαίνει ότι το chain of command είναι μια αποδεδειγμένα αποτελεσματική βάση, αλλά υπάρχουν συνειδητές εξαιρέσεις (π.χ. delay πριν το distortion για συγκεκριμένο εφέ) που είναι αποδεκτές αν ο μουσικός ξέρει γιατί τις κάνει."
