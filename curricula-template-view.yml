                          - generic [ref=f1e428]:
                            - paragraph [ref=f1e429]: Ο μαθητής μαθαίνει πώς το ξύλο και η σταθερότητα του λαιμού, το μέγεθος και η κατάσταση των frets, το κόψιμο του nut και ένα σωστό setup (action, intonation, truss rod) διαμορφώνουν το tone και την παιξιμότητα πριν καν το σήμα φτάσει σε πρίζα ή ενισχυτή. Η ώρα κλείνει με πρακτικό έλεγχο του δικού του οργάνου και ερωτήσεις κατανόησης.
