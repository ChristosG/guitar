                              - generic [ref=f1e2766]:
                                - paragraph [ref=f1e2767]: "Το πιο συχνό λάθος είναι υπερβολικό mix: ο μαθητής ανεβάζει το wet σήμα τόσο ώστε το delay να «πνίγει» την αρχική νότα, με αποτέλεσμα το παίξιμο να χάνεται πίσω στο mix μόλις μπει η μπάντα — αυτό ισχύει ιδιαίτερα σε πρόβα σε άδειο δωμάτιο, όπου όλα ακούγονται πιο «γεμάτα» απ' ό,τι θα ακουστούν με κόσμο και όργανα γύρω. Η διόρθωση είναι απλή: λιγότερο mix απ' όσο νομίζεις ότι χρειάζεσαι, και δοκιμή με όλη τη μπάντα πριν αποφασίσεις την τελική τιμή. Δεύτερο λάθος: ο μαθητής μπερδεύει το feedback/regen (αριθμός επαναλήψεων) με το mix (ένταση του εφέ) — γυρίζει το λάθος κουμπί προσπαθώντας να κάνει το delay πιο έντονο και καταλήγει με δεκάδες επαναλήψεις αντί για πιο δυνατή μία. Τρίτο, πολύ συχνό σε αρχάριους: ρυθμίζουν το dotted-eighth delay «με το μάτι» χωρίς tap tempo, οπότε η επανάληψη δεν πέφτει ποτέ ακριβώς στο σωστό σημείο και το αποτέλεσμα ακούγεται απλώς ασαφές αντί για ρυθμικό. Τέλος, να θυμάσαι ότι το delay τοποθετείται συνήθως τελευταίο στην αλυσίδα σήματος, μετά τη διαστρέβλωση — αν μπει πριν, οι επαναλήψεις διαστρεβλώνονται κι αυτές και το αποτέλεσμα γίνεται θολό."
