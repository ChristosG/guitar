                              - generic [ref=f1e3709]:
                                - paragraph [ref=f1e3710]: "Σε ένα amp με tone stack (bass/mid/treble) και, αν υπάρχει διαθέσιμο, ένα ασύρματο ή μεγάλο cable ώστε ο μαθητής να μπορεί να απομακρυνθεί λίγα μέτρα, κάνε το εξής: πρώτα ρύθμισε ένα crunch tone με mids γύρω στο 7-8, bass στο 4, treble στο 6 - ένα κλασικό 'live' setting. Παίξε ένα power chord progression (π.χ. E5-D5-A5) σε τέμπο μέτριο, ~100 bpm, με palm muting στις ρίθμικες χτύπες. Άκουσε πώς η κιθάρα 'κόβει' ακόμα κι όταν μιλάς πάνω από αυτήν ή βάζεις ένα backing track δυνατά. Μετά γύρνα τα mids στο 2, ανέβασε bass και treble στο 7-8 το καθένα - το 'bedroom scooped' setting. Παίξε το ίδιο progression. Χωρίς backing track ακούγεται πιο εντυπωσιακό, αλλά αν υπάρχει τρόπος να βάλεις ένα drum/bass backing track δυνατά στο δωμάτιο, θα ακούσετε μαζί πώς η κιθάρα 'χάνεται' μέσα στο μείγμα. Αυτό επιβεβαιώνει πρακτικά αυτό που περιγράφει το υλικό για το πώς ένα mid-scooped tone μπορεί να εξαφανιστεί live [S1 p.1]. Στη συνέχεια, αν υπάρχει διαθέσιμη κάποια συσκευή direct recording ή απλά ένα audio interface, δείξε τη διαφορά ανάμεσα σε μικροφωνισμένο amp και direct σήμα - δεν χρειάζεται τέλειο στούντιο εξοπλισμό, αρκεί ο μαθητής να ακούσει πόσο διαφορετικό είναι το ωμό direct σήμα σε σχέση με αυτό που περνάει από cab/mic, ώστε να καταλάβει γιατί ένας μηχανικός στούντιο μπορεί να ζητήσει κάτι εντελώς διαφορετικό από αυτό που ακούγεται 'σωστό' ζωντανά."
