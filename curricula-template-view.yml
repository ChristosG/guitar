                              - generic [ref=f1e4002]:
                                - paragraph [ref=f1e4003]: "Άνοιξε τη συζήτηση ρωτώντας τον μαθητή να σου περιγράψει με δικά του λόγια τι κάνει διαφορετικό το metal EQ από το blues EQ, πριν του δώσεις την απάντηση — έτσι θα δεις αν κατάλαβε τη λογική πίσω από τη συνταγή, όχι μόνο τα κουμπιά. Q: Ποια είναι η βασική συνταγή EQ για blues/classic rock και γιατί δουλεύει; A: Present midrange (φουσκωμένο, όχι σκαμμένο) — δίνει στο lead μια \"vocal, cutting\" ποιότητα που το κάνει να ξεχωρίζει μέσα στη μπάντα. Q: Τι σημαίνει \"scooped\" ήχος τεχνικά, και γύρω από ποια συχνότητα γίνεται το κόψιμο; A: Σημαίνει μείωση ή αφαίρεση του centre midrange γύρω στα 750 Hz, με ταυτόχρονη αύξηση bass και treble — δίνει σφιχτό χαμηλό και καθαρό ψηλό άκρο, ιδανικό για μεγάλο gain. Q: Γιατί μια ρύθμιση scooped metal EQ που ακούγεται τέλεια μόνος σου στο δωμάτιο μπορεί να είναι πρόβλημα ζωντανά με μπάντα; A: Επειδή ένα mid-scooped instrument μπορεί να εξαφανιστεί μέσα σε ζωντανό μείγμα — χωρίς midrange, η κιθάρα χάνει τον χώρο συχνοτήτων όπου συνήθως ακούγεται καθαρά πάνω από μπάσο και ντραμς. Q: Ποιο είναι το κριτήριο για να αποφασίσεις αν ένα effect χρειάζεται σε ένα κομμάτι; A: Να μπαίνει επειδή το ζητά η μουσική, όχι επειδή είναι διαθέσιμο, και μόνο στο βαθμό που χρειάζεται για να περάσει το μουσικό νόημα — αλλιώς απλώς προσθέτει, δεν βοηθά."
