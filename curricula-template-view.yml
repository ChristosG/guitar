                              - generic [ref=f1e2718]:
                                - paragraph [ref=f1e2719]: "Θα παίξω τρία περάσματα στο ίδιο ρίφ σε A, για να ακούσεις τη διαφορά. Πρώτα, slapback: delay time γύρω στα 90-110ms, μία μόνο επανάληψη (feedback στο ελάχιστο), mix περίπου 40-50%, παίζοντας ένα απλό country/rockabilly lick με down-strokes στη 5η θέση. Άκουσε πώς η νότα παχαίνει χωρίς να καταλαβαίνεις καθαρά ότι υπάρχει ηχώ — αυτό είναι το ζητούμενο, όχι μια ξεχωριστή δεύτερη νότα. Μετά, dotted-eighth: θα ρυθμίσω το delay time με tap tempo στο tempo του μετρονόμου (π.χ. 100 bpm), θα ανεβάσω το feedback σε 3-4 επαναλήψεις και το mix γύρω στο 35%, και θα παίξω ένα απλό arpeggio σε Em-C-G-D στην ψηλή χορδή, στο στυλ του The Edge — θα ακούσεις πώς μία μόνο συγχορδία μετατρέπεται σε καταρράκτη νοτών χωρίς να παίξω τίποτα περισσότερο από τα βασικά χτυπήματα. Τέλος, ping-pong: με το delay συνδεδεμένο σε στερεοφωνική έξοδο (δύο ενισχυτές ή στερεοφωνικά ακουστικά), θα παίξω μια αργή μελωδική φράση και θα ακούσεις τις επαναλήψεις να πηδάνε αριστερά-δεξιά, φτιάχνοντας ένα πλατύ ηχητικό πεδίο γύρω από μια απλή φράση."
