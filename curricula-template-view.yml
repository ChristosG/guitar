                              - generic [ref=f1e3149]:
                                - paragraph [ref=f1e3150]: "Το πιο συχνό λάθος είναι να μπαίνει το delay ή η reverb πριν το distortion — ο μαθητής νομίζει ότι «όσο πιο πολλά εφέ τόσο καλύτερα» και τα στοιβάζει χωρίς σκέψη σειράς, με αποτέλεσμα ένα θολό, fizzy σήμα που το distortion παραμορφώνει μαζί με τις επαναλήψεις του delay, δημιουργώντας ασυνάρτητο θόρυβο αντί για καθαρή παραμόρφωση. Η διόρθωση είναι απλή: δείξε του να μετακινήσει το delay/reverb στο τέλος και να ακούσει αμέσως τη διαφορά. Ένα δεύτερο συχνό λάθος είναι να αγνοείται εντελώς η ανάγκη για buffer σε ένα board με πολλά true bypass pedals και μεγάλα καλώδια· ο μαθητής παραπονιέται ότι ο ήχος του «είναι θαμπός» χωρίς να καταλαβαίνει ότι φταίει η αλυσίδα, όχι η κιθάρα ή ο ενισχυτής. Τρίτο λάθος: να μπαίνουν βαριά gain pedals μέσα στο FX loop αντί στο κανονικό input — αυτό αναποδογυρίζει τη λογική του chain of command, αφού το loop βρίσκεται μετά το gain stage του ίδιου του ενισχυτή. Τέλος, πολλοί μαθητές ξεχνούν να προσέξουν τη στάθμη σήματος στο send/return του loop, με αποτέλεσμα ανεπιθύμητη παραμόρφωση· ο κανόνας «If it sounds good - do it!» ισχύει για τις εξαιρέσεις στη σειρά, όχι για την απουσία ελέγχου στάθμης."
