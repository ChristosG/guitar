                          - generic [ref=f1e1223]:
                            - paragraph [ref=f1e1224]: "Ο μαθητής μαθαίνει να αναγνωρίζει τα signature χαρακτηριστικά των τεσσάρων μεγάλων οικογενειών ενισχυτών —Fender, Marshall, Vox και high-gain— και να καταλαβαίνει γιατί η καθεμία ταιριάζει σε διαφορετικό μουσικό πλαίσιο. Η έμφαση είναι στο αυτί: πώς ακούγεται η κάθε οικογένεια, όχι μόνο πώς ονομάζεται."
