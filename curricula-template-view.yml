                        - generic [ref=f1e3451]:
                          - generic [ref=f1e3452]:
                            - paragraph [ref=f1e3453]: Ο μαθητής αναλύει έξι θρυλικά rigs — Hendrix, Clapton, Stevie Ray Vaughan, Gilmour, The Edge και Van Halen — για να δει πώς λίγα, καλά επιλεγμένα κομμάτια gear, πιεσμένα σωστά, έδωσαν ήχους που ακόμα αντιγράφουμε. Το μάθημα κλείνει με το ερώτημα τι διδάσκει κάθε rig για τη σχέση ανάμεσα στο gear και στο χέρι που το παίζει.
                            - button "Επέκταση με συνομιλία" [ref=f1e3456]
                          - generic [ref=f1e3457]:
                            - generic [ref=f1e3458]:
                              - generic [ref=f1e3459]:
                                - button "Ζέσταμα" [ref=f1e3461]
                                - generic [ref=f1e3462]: 2 λεπτά
                                - generic [ref=f1e3463]:
                                  - button "Προσθήκη υλικού" [ref=f1e3464]
                                  - button "Διαγραφή" [ref=f1e3465]
                              - generic [ref=f1e3466]:
                                - paragraph [ref=f1e3467]: "Πριν μπούμε στην ιστορία, ζέστανε τ' αυτιά σου. Πάρε μια απλή μπλουζ φράση σε Mi (ό,τι θυμάσαι από παλιότερα μαθήματα πάνω σε pentatonic licks) και παίξ' την τρεις φορές: πρώτα εντελώς clean, μετά με ελαφρύ crunch από τον ενισχυτή σου (χαμηλό gain, όπως είδαμε στο Module 2 για το gain staging), και τέλος με ό,τι πιο κοντά σε cranked αμπλιφαϊέ διαθέτεις. Μην αγγίξεις κανένα πεντάλ ακόμα. Ο στόχος είναι να ακούσεις πόσο αλλάζει ο χαρακτήρας της ίδιας φράσης μόνο από το πόσο σκληρά χτυπάς τη χορδή και πόσο 'σπρωγμένος' είναι ο ενισχυτής — γιατί, όπως θα δούμε, αυτό είναι το κοινό θεμέλιο πίσω από όλα τα εμβληματικά tones που θα ακούσουμε σήμερα."
                                - button "Επέκταση με συνομιλία" [ref=f1e3470]
                            - generic [ref=f1e3471]:
                              - generic [ref=f1e3472]:
                                - button "Θεωρία" [ref=f1e3474]
                                - generic [ref=f1e3475]: 8 λεπτά
                                - generic [ref=f1e3476]:
                                  - button "Προσθήκη υλικού" [ref=f1e3477]
                                  - button "Διαγραφή" [ref=f1e3478]
                              - generic [ref=f1e3479]:
                                - paragraph [ref=f1e3480]: "Έχουμε ήδη περάσει κιθάρες, ενισχυτές, ηχεία, σειρά σήματος και κάθε οικογένεια effect ξεχωριστά. Σήμερα βάζουμε όλα αυτά μαζί μέσα από έξι rigs που όρισαν το πώς ακούγεται η ηλεκτρική κιθάρα σε διαφορετικές εποχές, και το πιο σημαντικό: τι διδάσκει το καθένα. Ο Jimi Hendrix (τέλη '60s) έπαιζε μια Fender Stratocaster με φωτεινά single-coil πικαπ μέσα σε ένα cranked Marshall stack, με ένα Fuzz Face και ένα wah pedal ως βασικά εργαλεία — 'a template for expressive, harmonically rich fuzz-driven lead tone'. Αλλά, όπως σημειώνει ο Michael Ross, είναι λάθος να ταυτίζουμε τον Hendrix αποκλειστικά με υπερβολικό distortion: πολλά κομμάτια του, όπως το 'Little Wing', χτίστηκαν πάνω σε καθαρούς ή ελαφρώς overdriven ήχους, και ζωντανά χρησιμοποιούσε εκπληκτικά λίγα effects — Fuzz Face, Octavia, Uni-Vibe και Wah Wah — προσθέτοντας tape delay και flanging μόνο στο στούντιο. Ο Eric Clapton στην εποχή των Cream έφτιαξε το φημισμένο 'woman tone': γύρισε το tone knob μιας κιθάρας με humbucker σχεδόν εντελώς κλειστό μέσα σε έναν overdriven ενισχυτή, παράγοντας έναν παχύ, σκοτεινό, φωνητικό ήχο με τεράστιο sustain. Η αφετηρία αυτού του ήχου βρίσκεται στο άλμπουμ Bluesbreakers with Eric Clapton: έπαιξε μια φλογισμένη Gibson Les Paul μέσα σε ένα 50-watt Marshall combo με δύο δωδεκάρια ηχεία, δυνατά, και όταν ο ηχολήπτης του ζήτησε να χαμηλώσει επειδή ο ενισχυτής παραμορφωνόταν, εκείνος αρνήθηκε — γεννώντας το πρότυπο πάνω στο οποίο μελετάται ακόμα ο ήχος της rock κιθάρας. Ο Stevie Ray Vaughan συνδύασε μια Stratocaster με βαρύ σετ χορδών (.013-.058), κουρδισμένη μισό τόνο χαμηλότερα, μέσα σε μια στοίβα overdrive pedals προς έναν δυνατό ενισχυτή τύπου tweed Fender. Τα λίγα effects που προτιμούσε ήταν Fuzz-Face, Octavia, TS-808 Tube Screamer, wah-wah και περιστρεφόμενα ηχεία τύπου Leslie, μέσα από συνδυασμούς Fender Vibroverb ή Super Reverb, Marshall και Dumble. Ό,τι όμως έκανε πραγματικά τη διαφορά ήταν τα δυνατά χέρια του και η επιθετική επαφή με τις χορδές — έπαιζε πολύ δυνατά, και αυτό, όχι το gear, είναι που κανείς δεν έχει καταφέρει να αντιγράψει πιστά. Ο David Gilmour στους Pink Floyd στηρίχθηκε σε μια Stratocaster, ένα fuzz τύπου Big Muff και εκτεταμένο delay για βαθιά, αιωρούμενα solo. Στην πράξη το rig του ήταν πιο σύνθετο: EMG active single-coil πικαπ με SPC booster για τα solo και EXG booster για τον καθαρό ήχο, ένα παλιό preamp μπάσου Alembic που ζέσταινε το σήμα πριν μπει σε Hiwatt ενισχυτές, σχεδόν κάθε overdrive και fuzz που υπάρχει για τα solo του, ένα περιστρεφόμενο ηχείο τύπου Leslie, και τελικά Lexicon PCM-70 και TC2290 για το χαρακτηριστικό 'space-rock' ambient του ήχο. Ο The Edge των U2 έχτισε σχεδόν όλη την ταυτότητά του πάνω σε δωδεκάτης-δέκατης όγδοης (dotted-eighth) επαναλήψεις delay πάνω σε καθαρούς έως ελαφρώς driven ενισχυτές, μετατρέποντας μια απλή συγχορδία σε καταρράκτη ρυθμικών ηχών. Στις πρώτες ηχογραφήσεις χρησιμοποιούσε Electro-Harmonix Deluxe Memory Man delay units, ενώ αργότερα πέρασε σε ένα rack μεγέθους ψυγείου με σειρά analog και digital effects, μέσα από πολλαπλά Vox AC30. Τέλος, ο Eddie Van Halen έφτιαξε το περίφημο 'brown sound' συνδυάζοντας έναν τροποποιημένο high-gain ενισχυτή με flanger. Το αρχικό του rig ήταν μια χειροποίητη Strat-style κιθάρα με ένα και μόνο χαμηλής ισχύος humbucker στη γέφυρα και ένα non-locking tremolo, μέσα σε έναν τροποποιημένο Marshall. Το κρίσιμο σημείο είναι ότι το εκπληκτικό sustain και η δύναμη που έβγαζε προέρχονταν κυρίως από τα δάχτυλά του, όχι από υπερβολικό gain — κάτι που πολλοί μιμητές αγνόησαν, χρησιμοποιώντας πολύ περισσότερο distortion από αυτόν ως συντόμευση για την ίδια ένταση. Το κοινό μάθημα και των έξι rigs είναι διπλό: πρώτον, ο εμβληματικός ήχος συνήθως γεννιέται από λίγα στοιχεία πιεσμένα σωστά (ένας cranked ενισχυτής, ένα fuzz, ένα delay) και όχι από σωρεία gear. Δεύτερον, το context του συγκροτήματος καθόριζε την επιλογή: ο Edge και ο Andy Summers μπόρεσαν να χτίσουν ήχους γεμάτους flanger και πολλαπλά delay επειδή έπαιζαν σε τριμελή σχήματα με ντράμερ που κρατούσαν κυρίως snare, toms και hi-hat, αφήνοντας έναν τεράστιο ηχητικό χώρο για τα effects τους να αναπνεύσουν — χώρος που δεν θα υπήρχε σε ένα πυκνό μείγμα με πλήκτρα και δεύτερη κιθάρα."
