                              - generic [ref=f1e2573]:
                                - paragraph [ref=f1e2574]: "Σήμερα είδαμε τρία pitch effects — octave pedal, harmonizer, pitch-shifter — που όλα προσθέτουν ή αντικαθιστούν τη θεμελιώδη νότα με μια φωνή σε συγκεκριμένο, σταθερό μουσικό διάστημα, σε αντίθεση με το chorus που ταλαντεύει συνεχώς το ύψος μέσω LFO. Το octave είναι το απλούστερο (πάντα ίδιο διάστημα, καμία γνώση τονικότητας), ο harmonizer προσθέτει αρμονία σε διάστημα που μπορεί να είναι είτε σταθερό (dumb) είτε προσαρμοσμένο στην κλίμακα (smart), και ο pitch-shifter μπορεί να κάνει είτε το ένα είτε το άλλο, ή να μετατοπίσει ολόκληρο το σήμα. Το κλειδί που πρέπει να μείνει: pitch effect όταν θέλετε πάχος και ευκρίνεια χωρίς wavering· chorus όταν θέλετε το κλασικό, ζωντανό «κύμα» πολλών οργάνων."
