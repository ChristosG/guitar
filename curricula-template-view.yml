                              - generic [ref=f1e1725]:
                                - paragraph [ref=f1e1726]: "Το πιο συχνό λάθος είναι να ταυτίζει ο μαθητής το volume με το gain: ανεβάζει τη συνολική ένταση περιμένοντας περισσότερο distortion, ενώ στην πραγματικότητα χρειάζεται να ανεβάσει το preamp gain ή το drive του πεταλιού και να αφήσει το master volume να ελέγχει μόνο την ένταση δωματίου. Δεύτερο συχνό λάθος είναι να μπερδεύει overdrive, distortion και fuzz σαν να είναι το ίδιο πράγμα — του θυμίζουμε ότι διαφέρουν στη σκληρότητα και τη συμμετρία του clipping, όχι μόνο στην «ποσότητα» παραμόρφωσης. Τρίτο, πολλοί μαθητές νομίζουν ότι ένα πεντάλ distortion μπροστά από καθαρό ενισχυτή θα ακούγεται πάντα ακριβώς σαν cranked tube amp· στην πράξη η φυσική του clipping είναι διαφορετική (κυρίως solid-state hard clipping εναντίον tube soft clipping), κάτι που εξηγεί γιατί πολλοί παίκτες προτιμούν να στοιβάζουν πεντάλ πάνω σε ήδη ελαφρώς οδηγημένο preamp αντί να βασίζονται αποκλειστικά στο πεντάλ. Τέλος, υπάρχει η τάση της υπερβολής: όπως σημειώνεται στο υλικό, πάρα πολύ distortion «θα θολώσει» τον ήχο, θα κάνει τις γρήγορες νότες να 'κολλήσουν' η μία στην άλλη, και θα βυθίσει την κιθάρα μέσα στο μείγμα του συγκροτήματος αντί να την αναδείξει."
