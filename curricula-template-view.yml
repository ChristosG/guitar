                              - generic [ref=f1e2128]:
                                - paragraph [ref=f1e2129]: "Οι ασκήσεις χτίζονται πάνω στην ίδια λογική: πρώτα ξεχωρίζεις το κάθε επίπεδο gain με το αυτί, μετά δουλεύεις τη στοίβα με τα χέρια σου. Τα τρία επίπεδα, ένα riff (8 min) Παίξε το ίδιο riff (power chords σε Am, τέσσερα μέτρα, σταθερό τέμπο 90bpm) πρώτα μέσα από overdrive, μετά distortion, μετά fuzz, με τον ενισχυτή στην ίδια ρύθμιση κάθε φορά. Μετά την κάθε φορά, γράψε μία λέξη που περιγράφει τι άκουσες διαφορετικό στην επίθεση (attack) και στο sustain. Δοκιμή καθαρίσματος με το volume knob (6 min) Με ενεργό το overdrive, χαμήλωσε το volume knob της κιθάρας στο μισό ενώ παίζεις αργές νότες, και άκου πόσο καθαρίζει ο ήχος. Επανάλαβε ακριβώς την ίδια κίνηση με το distortion ενεργό και μετά με το fuzz ενεργό — σημείωσε πόσο λιγότερο καθαρίζουν. Πρώτο stacking: OD μπροστά από distortion (10 min) Σύνδεσε ένα χαμηλού gain overdrive πριν από ένα distortion. Άκου πρώτα το distortion μόνο του σε ένα riff, μετά πρόσθεσε το overdrive από πάνω με χαμηλό δικό του gain αλλά με το output ανεβασμένο. Ρύθμισε το output του overdrive μέχρι να βρεις το σημείο όπου προσθέτει πύκνωση χωρίς να γίνεται θολό. Δεύτερο stacking: clean boost μπροστά από fuzz (6 min) Αν έχεις διαθέσιμο ένα clean boost ή ένα overdrive με το gain του στο μηδέν (λειτουργώντας σαν boost), βάλ' το μπροστά από το fuzz και άκου πώς αλλάζει η ένταση οδήγησης του fuzz — ιδιαίτερα στο sustain και στην πυκνότητα των αρμονικών."
