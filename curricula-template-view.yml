                              - generic [ref=f1e4184]:
                                - paragraph [ref=f1e4185]: "Μέχρι το επόμενο μάθημα (ή για προσωπική εξάσκηση αν αυτό ήταν το τελευταίο μάθημα του course): άκουσε 20 λεπτά ηχογραφήσεις από δύο διαφορετικές εποχές του ίδιου καλλιτέχνη — π.χ. πρώιμο Clapton στο Bluesbreakers album δίπλα σε κάτι πιο πρόσφατο με πιο σύγχρονο εξοπλισμό — και σημείωσε τι αλλάζει στο tone πέρα από το εξοφλητικό «είναι παλιό/είναι καινούριο». Αν έχεις πρόσβαση σε modeler ή amp-sim plugin, δοκίμασε να φτιάξεις ένα preset που πλησιάζει ένα από τα iconic tones που έχετε καλύψει στο module, και έλα έτοιμος να το παίξεις. Το κριτήριο επιτυχίας δεν είναι η τέλεια αντιγραφή, αλλά να μπορείς να εξηγήσεις με λόγια ποιο στοιχείο της αλυσίδας (guitar, amp, cab, effects, touch) συνεισφέρει τι."
