                        - generic [ref=f1e2861]:
                          - generic [ref=f1e2862]:
                            - paragraph [ref=f1e2863]: Ο μαθητής μαθαίνει να ξεχωρίζει το spring, το plate και το αλγοριθμικό (hall/room) reverb ακούγοντας τον μηχανισμό πίσω από τον καθένα, και εξασκείται στο να διαλέγει σωστή ποσότητα reverb ανάλογα με τον χώρο και το μουσικό context. Η άσκηση συνδέεται άμεσα με το προηγούμενο μάθημα πάνω στο delay, αφού και τα δύο εφέ μοιράζονται θέση στο τέλος της αλυσίδας σήματος.
                            - button "Επέκταση με συνομιλία" [ref=f1e2866]
