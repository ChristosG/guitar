                          - generic [ref=f1e2241]:
                            - paragraph [ref=f1e2242]: Ο μαθητής μαθαίνει πώς ένα LFO (low-frequency oscillator) κρύβεται πίσω από κάθε modulation effect και πώς αλλάζει διαφορετική ιδιότητα του σήματος σε καθένα — delay time, φάση, ένταση ή και τα δύο μαζί στην περίπτωση του rotary. Μέχρι το τέλος του μαθήματος θα ξεχωρίζει με το αυτί chorus από flanger, flanger από phaser, και tremolo από vibrato.
