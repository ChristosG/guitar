                              - generic [ref=f1e2019]:
                                - paragraph [ref=f1e2020]: "Ανοίγουμε τη συζήτηση ρωτώντας τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά ανάμεσα σε πραγματικό και φαινομενικό sustain, γιατί αυτή είναι η βασική ιδέα του μαθήματος και θέλουμε να βεβαιωθούμε ότι έχει καθίσει πριν προχωρήσουμε στο επόμενο μάθημα για τα gain effects. Q: Τι ακριβώς κάνει έναν compressor να δίνει την εντύπωση ότι μια νότα «κρατάει περισσότερο»; A: Λειτουργεί σαν αυτόματο volume pedal: κατεβάζει την αρχική δυνατή ένταση και μετά ανεβάζει σταδιακά την ένταση καθώς η νότα σβήνει, ώστε να μένει σταθερά ακουστή περισσότερη ώρα. Η ίδια η νότα δεν διαρκεί περισσότερο — γι' αυτό λέγεται «apparent» sustain. Q: Ποια είναι η διαφορά ανάμεσα σε distortion και sustain όπως τη διαβάσαμε στο βιβλίο του Ross; A: Το distortion περιγράφει έναν τύπο ήχου (τις αρμονικές γύρω από τη νότα που το αυτί αναγνωρίζει ως «παραμόρφωση»), ενώ το sustain αναφέρεται στο πόσο καιρό παραμένει ακουστή η νότα. Το distortion μπορεί μερικές φορές να αυξήσει το sustain, αλλά το sustain μπορεί να αυξηθεί και χωρίς καθόλου distortion — αυτό κάνει ο compressor. Q: Γιατί ο compressor μπαίνει πρώτος στην αλυσίδα σήματος, πριν από distortion και τα υπόλοιπα εφέ; A: Επειδή ο compressor ενισχύει ό,τι προηγείται του στην αλυσίδα — αν μπει μετά το distortion, θα ανεβάσει και τον θόρυβο που παράγει το distortion. Μπαίνοντας πρώτος, στέλνει ένα πιο ομοιόμορφο σήμα στα επόμενα εφέ. Q: Ποιο είναι το βασικό μειονέκτημα της υπερβολικής compression; A: Περιορίζει τη δυναμική και το attack του παίκτη — δηλαδή «ομογενοποιεί» το προσωπικό touch, αφού μεγάλο μέρος της προσωπικότητας ενός παίκτη βρίσκεται στο πώς χτυπά τις χορδές."
