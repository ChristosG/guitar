                              - generic [ref=f1e1949]:
                                - paragraph [ref=f1e1950]: "Το πιο συχνό λάθος είναι να περιμένει ο μαθητής πραγματικό sustain από τον compressor — να νομίζει ότι η νότα «κρατάει περισσότερο» με την έννοια που κρατάει μια καλά φτιαγμένη κιθάρα με καλό nut και σωστό setup. Όπως εξηγεί ο Ross, η νότα δεν διαρκεί περισσότερο· απλώς παραμένει πιο δυνατή για περισσότερη ώρα — γι' αυτό λέγεται «apparent» sustain. Η διόρθωση: κάνε ξανά το πείραμα του warm-up (χειροκίνητο «γύρισμα έντασης») για να ξαναθυμηθεί τη διαφορά. Δεύτερο συχνό λάθος: να αφήνει ο μαθητής τον compressor ανοιχτό με πολύ υψηλό sustain σε όλο το σετ, οπότε όλο το παίξιμο ακούγεται «επίπεδο» και χωρίς προσωπικότητα — χάνεται ακριβώς αυτό που κάνει το touch ενός παίκτη αναγνωρίσιμο. Η διόρθωση είναι να δουλεύει πάντα με λιγότερο sustain απ' όσο νομίζει ότι χρειάζεται, και να το αυξάνει μόνο όταν το κομμάτι το απαιτεί πραγματικά (π.χ. country pedal-steel εφέ, ή clean sustained μελωδίες). Τρίτο λάθος, πιο τεχνικό: να τοποθετεί τον compressor μετά το distortion pedal στην αλυσίδα. Ο κανόνας είναι compressors πρώτα, γιατί ενισχύουν και τον θόρυβο ό,τι προηγείται τους — αν μπει μετά το distortion, θα ενισχύσει και τον θόρυβο του distortion. Τέλος, να θυμάται ο μαθητής την προειδοποίηση: ένας compressor δεν ξεχωρίζει μουσική από θόρυβο· αν μείνει ανοιχτός χωρίς να παίζει κανείς, θα ανεβάσει την ένταση του θορύβου του δωματίου ή του hum της κιθάρας — καλό είναι να μπαίνει bypass όταν δεν παίζει."
