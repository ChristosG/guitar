                          - generic [ref=f1e1620]:
                            - paragraph [ref=f1e1621]: Ο μαθητής θα κατανοήσει τη φυσική πίσω από το clipping —soft και hard— και τη διαφορά ανάμεσα σε preamp και power amp distortion, βλέποντας πώς αυτή η ιστορία οδήγησε από το τυχαίο 'σπάσιμο' μιας λυχνίας μέχρι το σημερινό πεντάλ distortion πάνω στο pedalboard. Θα ακούσει, στην πράξη, γιατί ένα cranked tube amp και ένα πεντάλ μπροστά από καθαρό αμπλιφαέρ δεν είναι ποτέ ακριβώς το ίδιο πράγμα.
