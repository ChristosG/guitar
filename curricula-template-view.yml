                              - generic [ref=f1e1167]:
                                - paragraph [ref=f1e1168]: "Σήμερα είδαμε ότι ο ενισχυτής δεν είναι ένα κουτί αλλά δύο σκηνικά: το preamp, που ανεβάζει και σχηματίζει το σήμα, και το power amp, που το σπρώχνει στα ηχεία με το δικό του, πιο \"φυσικό\" distortion όταν πιέζεται. Ανάμεσά τους κάθεται ο tone stack, που σκαλίζει τη συχνότητα πριν αυτή φτάσει στο power section. Και μάθαμε τι είναι gain staging: η απόφαση για το πού ακριβώς στην αλυσίδα θα συμβεί το distortion — preamp gain, master volume, ή ολόκληρος ο ενισχυτής καυτός — μια απόφαση που αλλάζει τον χαρακτήρα, όχι μόνο την ποσότητα, του ήχου."
