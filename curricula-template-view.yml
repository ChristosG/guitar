                              - generic [ref=f1e2481]:
                                - paragraph [ref=f1e2482]: "Τα pitch effects είναι μια οικογένεια εφέ που, σε αντίθεση με τα εφέ διαμόρφωσης που είδαμε στα προηγούμενα μαθήματα, δεν επεξεργάζονται τη χροιά ή τον χρόνο του σήματος — αλλάζουν την ίδια τη νότα. Όπως το θέτει η βιβλιοθήκη μας: \"Pitch effects — octave pedals, harmonizers, and pitch-shifters — add a note above or below the played pitch, or shift the whole signal to a different key, for thickening or special effects\" (S1). Πρόκειται για τρεις παραλλαγές της ίδιας βασικής ιδέας, με αυξανόμενη πολυπλοκότητα. Το octave pedal είναι το πιο απλό μέλος: ανιχνεύει τη θεμελιώδη συχνότητα της παιζόμενης νότας και παράγει ένα αντίγραφο μία ή δύο οκτάβες πάνω ή κάτω, το οποίο αναμειγνύεται με το πρωτότυπο σήμα. Επειδή η οκτάβα είναι πάντα το ίδιο διάστημα (12 ημιτόνια), το pedal δεν χρειάζεται να «ξέρει» τίποτα για την κλίμακα ή την τονικότητα — δουλεύει το ίδιο σε κάθε νότα που παίζετε. Το harmonizer είναι πιο σύνθετο: προσθέτει μια φωνή σε συγκεκριμένο μουσικό διάστημα (τρίτη, πέμπτη, έκτη κ.λπ.) πάνω ή κάτω από τη θεμελιώδη, δημιουργώντας αρμονία εν κινήσει. Υπάρχουν δύο βασικές κατηγορίες: οι «dumb» harmonizers, που προσθέτουν πάντα το ίδιο σταθερό διάστημα ανεξάρτητα από την τονικότητα του κομματιού, και οι «smart» harmonizers, που είναι προγραμματισμένοι με την κλίμακα ή την τονικότητα και προσαρμόζουν αυτόματα το διάστημα ώστε η προστιθέμενη νότα να παραμένει διατονική — π.χ. άλλοτε μικρή και άλλοτε μεγάλη τρίτη, ανάλογα με τη βαθμίδα της κλίμακας (S9). Το pitch-shifter, τέλος, μπορεί είτε να προσθέσει δεύτερη φωνή σε σταθερό διάστημα σαν τον harmonizer, είτε να μετατοπίσει ολόκληρο το σήμα σε άλλο ύψος, αντικαθιστώντας εντελώς την αρχική νότα. Γιατί να προτιμήσετε pitch effect αντί για chorus, τη στιγμή που το αποτέλεσμα μπορεί να ακούγεται συγγενικό; Η διαφορά είναι θεμελιώδης. Το chorus καθυστερεί το σήμα κατά μερικά χιλιοστά του δευτερολέπτου και συνεχώς μεταβάλλει, μέσω ενός LFO, αυτή την καθυστέρηση, με αποτέλεσμα η πρόσθετη φωνή να «περιπλανιέται» ελαφρώς πάνω-κάτω από το ύψος της αρχικής νότας, προσομοιώνοντας πολλά όργανα που παίζουν ελαφρώς εκτός συγχρονισμού. Το pitch shifting λειτουργεί διαφορετικά: \"Unlike chorus, the detuned, 'pitch shifted' note stays constant rather than fluctuating above or below the original\" (S2). Η προστιθέμενη νότα κρατά σταθερό, ακριβές ντετούναρισμα ή διάστημα, χωρίς την ταλάντωση του chorus. Αυτό σημαίνει πως ο ήχος είναι λιγότερο «υγρός» (lush) από ένα chorus ή flanger, αλλά διατηρεί μεγαλύτερη καθαρότητα και ευκρίνεια — ιδανικό όταν θέλετε να παχύνετε έναν ήχο χωρίς να θολώσετε το attack και το pitch-tracking της νότας, όπως σε ένα σόλο ή σε καθαρές συγχορδίες. Ο Michael Ross περιγράφει ακριβώς αυτή την εφαρμογή όταν αναζητούσε τον γεμάτο, κουδουνιστό ήχο των σύγχρονων country δίσκων και ανακάλυψε πως δεν ήταν chorus αλλά pitch shifting: \"Country pickers were beefing up their tone without the wavering of chorus. Pitch shifting does not sound as lush as chorus or flanging but it can fatten solo tones while retaining definition\" (S2)."
