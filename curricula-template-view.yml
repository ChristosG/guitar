                              - generic [ref=f1e926]:
                                - paragraph [ref=f1e927]: "Το πιο συχνό λάθος είναι να ψάχνει ο μαθητής λύση στο gear για κάτι που είναι στην πραγματικότητα τεχνική. Ακούγεται σαν να λέει ότι ο ήχος του είναι λεπτός, μήπως χρειάζεται άλλο pickup ή νέο ενισχυτή — ενώ συχνά η αιτία είναι πολύ λεπτή πένα, πολύ ελαφριές χορδές, ή διστακτικό attack. Η διόρθωση εδώ είναι να δοκιμάσει πρώτα πένα και χορδές, και μετά το gear, ακριβώς όπως προτείνει ο Ross πριν από κάθε αγορά. Δεύτερο συχνό λάθος: το να παίζει κανείς πάντα με την ίδια πίεση και γωνία πένας σε κάθε φωνή και context, χάνοντας δυναμικό εύρος — αυτό παράγει συγχορδίες που ακούγονται εκτός συντονισμού γιατί κάθε δάχτυλο ή χτύπημα δεν έχει ίδια πίεση. Η διόρθωση είναι συνειδητή δουλειά πάνω στην ομοιομορφία της πίεσης, ειδικά σε συγχορδίες. Τρίτο λάθος: η παραμέληση των χορδών — παίκτες που παραπονιούνται για έλλειψη λαμπρότητας ή προβλήματα κουρδίσματος αλλά δεν έχουν αλλάξει χορδές εδώ και μήνες. Η διόρθωση είναι απλή: νέες χορδές, τεντωμένες σωστά πριν το κούρδισμα σταθεροποιηθεί."
