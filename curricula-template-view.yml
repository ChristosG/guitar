                                - paragraph [ref=f1e2921]: "Πρώτα, στο spring reverb του ενισχυτή (ή σε pedal τύπου spring emulation): παίζω ένα καθαρό arpeggio σε G σε μέτριο tempo με το reverb dial στο 3/10, μετά στο 6/10, μετά στο 9/10, ώστε ο μαθητής να ακούσει πώς η αντήχηση αρχίζει να 'φουσκώνει' και τελικά να καλύπτει τις νότες. Δείχνω επίσης το 'sproi-oi-oiing' σκόπιμα, χτυπώντας δυνατά ένα power chord στο E με το reverb ψηλά, για να αναγνωρίζεται ξεκάθαρα το φαινόμενο. Έπειτα περνάω σε plate reverb (rack unit ή pedal σε λειτουργία plate) και παίζω τις ίδιες φράσεις — ο μαθητής πρέπει να ακούσει πόσο πιο 'λείο' και συμπαγές είναι το decay σε σχέση με το ανομοιόμορφο, πιο 'μεταλλικό' spring. Χρησιμοποιώ χαμηλό mix (γύρω στο 15-20%) για ρυθμικό παίξιμο, δείχνοντας πώς το plate μπορεί να μείνει σχεδόν αθόρυβο στο μείγμα ενώ προσθέτει βάθος. Τέλος, περνάω σε αλγοριθμικό hall reverb (π.χ. σε ένα φθηνό ψηφιακό unit τύπου Alesis Microverb, που δίνει άμεσα στερεοφωνική αίσθηση όταν τροφοδοτεί δύο ενισχυτές) και παίζω αργά, sustained νότες με μεγάλο decay time, ώστε ο μαθητής να ακούσει το 'ambient' αποτέλεσμα — νότες που μοιάζουν να αιωρούνται μέσα σε έναν τεράστιο, σχεδόν μη πραγματικό χώρο. Συγκρίνω το ίδιο πέρασμα σε μικρό 'room' decay έναντι μεγάλου 'hall' decay, για να φανεί καθαρά η διαφορά μεγέθους χώρου."
