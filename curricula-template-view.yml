                              - generic [ref=f1e310]:
                                - paragraph [ref=f1e311]: "Οι ασκήσεις εδώ δεν χρειάζονται καμία τεχνολογία — μόνο αυτί και υπομονή. Στόχος είναι ο μαθητής να μάθει να ακούει το όργανό του σαν ακουστικό instrument πρώτα, πριν καν σκεφτεί effects ή amp settings. Τεστ ξεβυσμένης χτύπας (G.E. Smith test) (5 min) Ο μαθητής χτυπάει μία φορά μια ανοιχτή συγχορδία E ή A στην κιθάρα του, εντελώς ξεβυσμένη, και περιγράφει φωναχτά τι ακούει: φωτεινό ή σκοτεινό, γεμάτο ή λεπτό, πόσο κρατάει το sustain. Επαναλαμβάνει στο δεύτερο και τρίτο τάστο του λαιμού. Μέτρηση sustain (8 min) Παίζει μια μεμονωμένη νότα στην έκτη χορδή, ανοιχτή, και μετράει με το ρολόι πόσα δευτερόλεπτα ακούγεται καθαρά προτού σβήσει — πρώτα ξεβυσμένη, μετά μέσα από καθαρό ήχο σε χαμηλή ένταση. Καταγράφει τους δύο χρόνους. Σύγκριση τύπων σώματος (10 min) Αν υπάρχει διαθέσιμη δεύτερη κιθάρα διαφορετικού τύπου (solid/semi-hollow/hollow), ο μαθητής παίζει την ίδια συγχορδία και στις δύο, ξεβυσμένος, και περιγράφει τη διαφορά στην αντήχηση με δικά του λόγια, χωρίς τεχνικούς όρους πρώτα, μετά συνδέοντάς τα με τη θεωρία. Γραπτή περιγραφή του δικού του οργάνου (5 min) Ο μαθητής γράφει τρεις λέξεις-περιγραφή για τη δική του κιθάρα ξεβυσμένη (π.χ. «γεμάτη, ζεστή, κοντό sustain») και εξηγεί ποιο νομίζει ότι είναι το ξύλο/τύπος σώματος που το προκαλεί, βάσει όσων ακούσαμε σήμερα."
