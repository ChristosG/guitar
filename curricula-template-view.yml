                              - generic [ref=f1e455]:
                                - paragraph [ref=f1e456]: "Στο προηγούμενο μάθημα είδαμε ότι μια ηλεκτρική κιθάρα πρέπει πρώτα να ακούγεται καλά ακουστικά, πριν καν μπει σε πρίζα — «an electric guitar that does not sound great acoustically will never sound great electrically», όπως το θέτει ο Michael Ross. Σήμερα πάμε ένα βήμα πιο βαθιά μέσα σε αυτό το ακουστικό όργανο: στον λαιμό, στα τάστα, στο nut και στο setup — τα σημεία όπου το ξύλο συναντά τις χορδές και καθορίζει αν αυτές θα δονηθούν σωστά ή όχι. Ο λαιμός συνήθως κατασκευάζεται από maple, rosewood, mahogany ή ebony, και το ξύλο επηρεάζει τον ήχο. Το maple δίνει πιο φωτεινό (brighter) ήχο αλλά φθείρεται και αποχρωματίζεται πιο γρήγορα ως fingerboard· το rosewood δίνει πιο σκούρο, πιο ζεστό ήχο· το ebony δίνει τη φωτεινότητα του maple χωρίς τα προβλήματα φθοράς, γι' αυτό συχνά συνδυάζεται με mahogany πλάτη για να μετριαστεί αυτή η φωτεινότητα. Πέρα όμως από το είδος του ξύλου, η «σταθερότητα» του λαιμού είναι εξίσου κρίσιμη: ξύλο που δεν έχει «γεράσει» σωστά (aged ή kiln dried) μπορεί να στρεβλώσει ή να συστραφεί με τον καιρό. Ένας λαιμός από τη δεκαετία του '50 που είναι ίσιος σήμερα, θα παραμείνει ίσιος — γιατί αν επρόκειτο να στρεβλώσει, θα το είχε ήδη κάνει. Για να αντισταθμιστούν οι μικρές κινήσεις του ξύλου με τη θερμοκρασία και την υγρασία, σχεδόν κάθε λαιμός έχει μέσα του μια μεταλλική ράβδο, το truss rod. Ο λαιμός μπορεί να «κυρτώσει» με δύο τρόπους: bowing (υπερβολική κοιλότητα προς τα εμπρός, που κάνει το action να νιώθεται πολύ ψηλά γύρω από το 5ο-9ο τάστο) και backbowing (αντίστροφη κύρτωση, που προκαλεί fret-out ή buzz σε αυτή την περιοχή). Το σφίξιμο του truss rod διορθώνει το bowing, το χαλάρωμά του διορθώνει το backbow. Είναι σημαντικό να θυμόμαστε πάντα ότι πολλοί λαιμοί χρειάζονται μια ελαφριά κοιλότητα για να παίζουν σωστά — δεν είναι όλοι οι απόλυτα ίσιοι λαιμοί οι καλύτεροι λαιμοί. Η πρακτική δοκιμή είναι πάντα καλύτερη από το «κοίταγμα» του λαιμού από τη μία άκρη. Τα τάστα (frets) επηρεάζουν εξίσου τον ήχο και την παιξιμότητα. Τα αρχικά Fender frets ήταν λεπτά και χαμηλά, κατάλληλα για strumming και flatpicking με βαριά χορδή και υψηλό action, χωρίς πολλά bends. Τα Gibson frets ήταν πιο φαρδιά αλλά και πάλι χαμηλά. Αργότερα, τη δεκαετία του '60, έγιναν δημοφιλή τα ψηλότερα τάστα, γιατί επέτρεπαν χαμηλό action αλλά και άνετο bending, αφού το δάχτυλο μπορεί να «μπει κάτω» από τη χορδή πιο εύκολα. Όμως τα ψηλά τάστα απαιτούν πιο ελαφρύ άγγιγμα: μόλις η χορδή ακουμπήσει σταθερά το τάστο, η νότα ακούγεται σωστά· επιπλέον πίεση την ανεβάζει (sharp). Αυτό είναι δύσκολο να το ακούσει κανείς σε μονές νότες, αλλά είναι πολύ εμφανές σε συγχορδίες — αν η πίεση κάθε δαχτύλου δεν είναι ίδια, η συγχορδία ακούγεται εκτός τόνου. Στο ακραίο άκρο αυτής της λογικής βρίσκονται οι scalloped λαιμοί, όπου το ξύλο ανάμεσα στα τάστα είναι σκαλισμένο σε βαθούλωμα, δημιουργώντας ουσιαστικά υπερ-ψηλά τάστα· δίνουν μεγαλύτερη εκφραστικότητα στο vibrato και στο bending, αλλά απαιτούν πολλή εξάσκηση για να παίζονται σε τόνο. Φθαρμένα ή ανομοιόμορφα τάστα προκαλούν buzzing, fret-out (η νότα κόβεται απότομα) και προβλήματα τονισμού. Η λύση είναι το leveling ή «P&D» (polish and dress): οι τεχνικοί τρίβουν τα ψηλότερα τάστα στο ύψος του πιο φθαρμένου και τα «στέφουν» ξανά σε αιχμηρό σχήμα ώστε η χορδή να έχει ένα καθαρό σημείο επαφής. Όταν τα τάστα έχουν φθαρεί τόσο πολύ που δεν αντέχουν άλλο leveling, χρειάζεται πλήρες fret job. Το nut, το λεπτό κομμάτι (bone, synthetic bone, graphite ή brass) ανάμεσα στο κεφάλι και το fingerboard, επηρεάζει τον ήχο λιγότερο από όσο νομίζουν οι περισσότεροι — και μόνο στις ανοιχτές χορδές, αφού μόλις μια χορδή πατηθεί σε τάστο το nut δεν παίζει πλέον κανένα ρόλο. Αυτό όμως που έχει τεράστια σημασία είναι πόσο καλά είναι κομμένο: αν οι εγκοπές είναι πολύ στενές οι χορδές «πιάνονται» και βγαίνουν εκτός τόνου ειδικά στο bending ή στο κούρδισμα με το βραχίονα (whammy bar)· αν είναι πολύ φαρδιές, η χορδή κουνιέται μέσα στο nut και χάνει sustain. Ένα καλά κομμένο nut, από καλό υλικό, είναι προϋπόθεση για μια κιθάρα που «κρατάει» τη νότα και μένει στο κούρδισμα. Όλα αυτά συγκεντρώνονται στο setup, που ο Michael Ross ονομάζει «the free tone upgrade most players skip» — και το ίδιο επισημαίνει το πρόγραμμα σπουδών μας. Ένα σωστό setup περιλαμβάνει τέσσερα βασικά στοιχεία: το intonation (η απόσταση από το nut ως το 12ο τάστο πρέπει να ισούται με την απόσταση από το 12ο τάστο ως το bridge saddle, ρύθμιση που γίνεται πάντα με καινούριες χορδές), το κόψιμο ή άνοιγμα του nut όπου χρειάζεται, το action (το ύψος των χορδών πάνω από τα τάστα — υψηλότερο action αφήνει τις χορδές να αντηχούν καλύτερα αλλά δυσκολεύει το παίξιμο, οπότε είναι πάντα συμβιβασμός) και η ρύθμιση του truss rod για να διορθωθεί τυχόν bow ή backbow. Μια κιθάρα με σωστό setup παίζει στο τόνο σε όλο το μήκος του λαιμού και αφήνει τη δυναμική του παίκτη να περάσει καθαρά — χωρίς setup, ακόμα και το καλύτερο pickup ή ο καλύτερος ενισχυτής δεν θα σώσουν τον ήχο."
