                              - generic [ref=f1e3889]:
                                - paragraph [ref=f1e3890]: Θα δείξω τις τρεις συνταγές πάνω στο ίδιο riff, για να ακούγεται καθαρά η διαφορά. Παίζω πρώτα ένα open-position blues lick σε A (θέσεις 5ου-7ου τάστου στη χορδή Ε) με το amp ρυθμισμένο bass 5, mid 7-8, treble 5 — δηλαδή φουσκωμένο midrange γύρω στα 750 Hz, ελαφρύ crunch. Ακούστε πώς το solo "βγαίνει μπροστά", σαν φωνή. Έπειτα, χωρίς να αλλάξω κιθάρα, παίζω ένα palm-muted power chord riff (E5-G5-A5) στις χαμηλές χορδές, αλλά τώρα γυρίζω το amp σε bass 7, mid 2-3, treble 7 — το κλασικό scooped προφίλ. Θα ακούσετε πώς το ίδιο ηχείο, με ίδιο gain, γίνεται πιο σφιχτό στο μπάσο και πιο κοφτερό στο πάνω άκρο, αλλά χάνει εκείνη τη "φωνή" που είχε το blues παράδειγμα — αυτό είναι επίτηδες, γιατί με πολύ distortion το φουσκωμένο mid θα γινόταν χαοτικό. Τέλος, παίζω ένα λαμπερό, staccato funk comping σε Em9 με clean ήχο, treble γυρισμένο ψηλά (7-8) και bass χαμηλωμένο (3-4) για να μη "βουλιάζει" το groove, ενισχύοντας την ευκρίνεια κάθε χτυπήματος της πένας. Σε κάθε παράδειγμα κρατάω τον ίδιο ρυθμό χεριού και μόνο αλλάζω τα κουμπιά του tone stack — έτσι ακούγεται καθαρά ότι η διαφορά είναι EQ, όχι τεχνική.
