                              - generic [ref=f1e844]:
                                - paragraph [ref=f1e845]: "Στα προηγούμενα μαθήματα αυτού του module είδαμε πώς το ξύλο, η κατασκευή και τα pickups διαμορφώνουν τον χαρακτήρα μιας κιθάρας πριν καν πατήσουμε distortion ή reverb. Σήμερα κλείνουμε τον κύκλο της «κιθάρας ως πηγής ήχου» με τα δύο πιο φθηνά, πιο παραμελημένα, και -σύμφωνα με τον Michael Ross- πιο αποτελεσματικά εργαλεία τόνου που υπάρχουν: την πένα και τις χορδές. Ο ίδιος γράφει χαρακτηριστικά ότι πολλοί κιθαρίστες ξοδεύουν εκατοντάδες ή χιλιάδες δολάρια σε νέους λαιμούς, σώματα, pickups ή ακόμα και ολόκληρες κιθάρες αναζητώντας έναν ήχο που μπορεί να λυθεί for as little as twenty-five cents — δηλαδή με μια απλή αλλαγή πένας. Ξεκινάμε από την πένα. Το πάχος της πένας (thin, medium, heavy) αλλάζει άμεσα τον χαρακτήρα του ήχου: μια λεπτή πένα δίνει έναν πιο λαμπερό, πιο φωτεινό, αλλά και πιο αδύναμο ήχο, ενώ μια χοντρή πένα δίνει πιο σκοτεινό, πιο παχύ τόνο. Ο Ross προτείνει μια απλή δοκιμή στο μαγαζί: αγοράζεις μια thin, μια medium και μια heavy πένα από το ίδιο υλικό, παίζεις την ίδια συγχορδία ακουστικά με την καθεμία, και ακούς προσεκτικά τη διαφορά — όπως γράφει, you may have just saved yourself thousands of dollars and years of frustration. Πέρα από το πάχος, και το υλικό της πένας (πλαστικό, nylon, tortex, graphite, μέταλλο) επηρεάζει τον ήχο εξίσου σημαντικά όσο μια αλλαγή pickup ή σώματος. Το ίδιο ακριβώς ισχύει για τις χορδές. Πιο λεπτό gauge δίνει πιο φωτεινό και λεπτό ήχο, πιο χοντρό gauge δίνει πιο σκοτεινό και πιο γεμάτο ήχο — με τίμημα τη δυσκολία στο παίξιμο. Ο Ross αφηγείται μια χαρακτηριστική ιστορία: ένας πελάτης λέει πως έχει μια παλιά Strat ίδια με του Stevie Ray Vaughan, ξέρει όλα του τα licks, χρησιμοποιεί τον ίδιο ενισχυτή και τα ίδια effects, και ρωτάει γιατί δεν ακούγεται σαν αυτόν. Η απάντηση ήταν απλή: ο πελάτης έπαιζε με .008 χορδές, ενώ ο Vaughan έπαιζε με .013 — ένα τεράστιο χάσμα σε πάχος και άρα σε ένταση, sustain και βάρος του ήχου. Οι χορδές διαφέρουν επίσης σε υλικό (nickel, stainless steel για ηλεκτρική, bronze ή phosphor bronze για ακουστική) και σε κατασκευή — roundwound, flatwound, half-round — με τις flatwound και half-round να δίνουν λιγότερο finger noise και πιο σκοτεινό ήχο. Η ηλικία των χορδών μετράει εξίσου: παλιές, οξειδωμένες χορδές χάνουν φωτεινότητα και δυσκολεύουν το κούρδισμα, γι' αυτό και η συχνότητα αλλαγής τους εξαρτάται από την εφίδρωση του παίκτη, το πόσο συχνά παίζει, την υγρασία του κλίματος και τη μάρκα της χορδής. Όμως όλα αυτά -πένα, χορδές, ξύλο, pickups- παραμένουν δευτερεύοντα μπροστά στο μεγαλύτερο μεταβλητό του tone: το ίδιο το χέρι. Όπως ορίζεται ήδη στη βάση αυτού του course, το tone είναι το αποτέλεσμα μιας αδιάκοπης αλυσίδας δακτύλων, οργάνου, καλωδίου, effects, ενισχυτή, ηχείου και δωματίου, όμως, όπως λέγεται εκεί, the single biggest variable is the player: το attack της πένας, το vibrato των δακτύλων, το palm muting και τα dynamics αλλάζουν τον ήχο περισσότερο σχεδόν από κάθε pedal ή ρύθμιση ενισχυτή — αυτή είναι η προέλευση της παροιμιώδους έκφρασης πως tone is in the hands. Ο Ross δίνει σάρκα σε αυτή την ιδέα με τέσσερις πρακτικές αρχές. Πρώτον, Authority: δεν σημαίνει απαραίτητα δυνατό χτύπημα, αλλά δέσμευση σε κάθε νότα — είτε παίζεις σαν τον Robben Ford με, όπως το περιγράφει, an attack of doom, είτε σαν τον Jim Hall με νότες που φαίνεται να επιπλέουν έξω από την κιθάρα. Δεύτερον, Picky picky: η γωνία της πένας ως προς τις χορδές (παράλληλη ή υπό γωνία) αλλάζει τον τόνο, όπως και το σημείο που παίζεις πάνω στο σώμα — κοντά στη γέφυρα για φωτεινότητα, κοντά στο λαιμό για ζεστασιά, ή ακόμα κι όπως έκανε ο Jeff Beck, παίζοντας ψηλά πάνω στις χαμηλές χορδές αντί χαμηλά στις ψηλές. Τρίτον, Sensitivity to the music: το blues ζητάει βαθιά δέσμευση με όλο το χέρι σαν τον Stevie Ray Vaughan, ενώ το jazz legato ζητάει ελαφρύτερο άγγιγμα και slides. Τέταρτον, Sensitivity to yourself: το άγγιγμά σου λέει κάτι για σένα ως μουσικό — και αυτό, όχι το gear, είναι που τελικά ακούγεται σε κάθε ηχογράφηση."
