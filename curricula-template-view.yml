                              - generic [ref=f1e566]:
                                - paragraph [ref=f1e567]: "Είδαμε ότι ο λαιμός δεν είναι απλώς ένα κομμάτι ξύλου που κρατάει τα τάστα: το είδος του ξύλου (maple, rosewood, ebony) χρωματίζει τον ήχο, η σταθερότητά του καθορίζει αν θα μείνει ίσιος με τα χρόνια, και το truss rod μέσα του διορθώνει bow και backbow. Τα τάστα —ύψος, πλάτος, φθορά— επηρεάζουν πόσο εύκολα μπορείς να κάνεις bend, πόσο ελαφριά πρέπει να πατάς, και αν η κιθάρα θα βουίζει ή θα κόβει νότες. Το nut, αν και έχει μικρή επιρροή στον ήχο των πατημένων νοτών, είναι κρίσιμο για το πώς κρατιέται το κούρδισμα. Και το setup —intonation, action, truss rod— είναι η φθηνότερη και πιο παραμελημένη αναβάθμιση tone που υπάρχει."
