                              - generic [ref=f1e2421]:
                                - paragraph [ref=f1e2422]: "Άνοιξε τη συζήτηση ζητώντας από τον μαθητή να εξηγήσει με δικά του λόγια τη διαφορά ανάμεσα σε δύο εφέ που μόλις άκουσε, πριν του δώσεις την απάντηση-κλειδί. Q: Ποια είναι η βασική διαφορά στον μηχανισμό ανάμεσα σε chorus και flanger, αφού και τα δύο βασίζονται σε καθυστέρηση; A: Το chorus χρησιμοποιεί μεγαλύτερη βασική καθυστέρηση (~20ms) με μικρή διακύμανση (έως 5ms) για να προσομοιώσει πολλά όργανα· ο flanger χρησιμοποιεί πολύ μικρότερη βασική καθυστέρηση (5-10ms) σαρωμένη σε πολύ ευρύτερο εύρος (1-20ms) και έχει επιπλέον feedback/regeneration που δίνει τη μεταλλική comb-filter σάρωση. Q: Γιατί ο phaser ακούγεται διαφορετικά από τον flanger, παρόλο που και οι δύο έχουν «swirl»; A: Ο phaser δεν περιέχει καθόλου κύκλωμα καθυστέρησης — σαρώνει τη φάση του σήματος μέσα από all-pass φίλτρα, χωρίς να επηρεάζει το ύψος της νότας, γι' αυτό ακούγεται πιο λεπτός και λιγότερο μεταλλικός από τον flanger. Q: Ποια ιδιότητα του σήματος διαμορφώνει το tremolo, και ποια το vibrato; A: Το tremolo διαμορφώνει ρυθμικά την ένταση (το πλάτος) του σήματος. Το αληθινό vibrato διαμορφώνει ρυθμικά το ύψος (pitch) της νότας, όχι την ένταση. Q: Τι κάνει το rotary effect μοναδικό σε σχέση με τα υπόλοιπα modulation effects; A: Το rotary συνδυάζει ταυτόχρονα διαμόρφωση πλάτους ΚΑΙ ύψους, μαζί με ένα φυσικό φαινόμενο Doppler που προκύπτει από την πραγματική περιστροφή ενός ηχείου και κέρατος (Leslie-style), κάτι που κανένα άλλο modulation effect δεν αναπαράγει με τον ίδιο τρόπο. Q: Τι ελέγχει το κοντρόλ feedback/regeneration σε έναν flanger; A: Ανακυκλώνει το καθυστερημένο σήμα μέσα από τον εαυτό του, εντείνοντας τον μεταλλικό χαρακτήρα του εφέ — όσο πιο ψηλά το ανεβάζεις, τόσο πιο έντονο και «jet plane» γίνεται το sweep."
