                          - generic [ref=f1e4035]:
                            - paragraph [ref=f1e4036]: "Το τελευταίο μάθημα του course βάζει το vintage gear δίπλα στη σύγχρονη τεχνολογία amp modeling και profiling, για να καταλάβει ο μαθητής τι πραγματικά κερδίζει και τι χάνει σε κάθε επιλογή. Κλείνουμε τον κύκλο συνδέοντας τα πάντα με αυτό που είπαμε από την πρώτη ενότητα: το tone είναι πρώτα απ' όλα στα χέρια."
