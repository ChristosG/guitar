                              - generic [ref=f1e2894]:
                                - paragraph [ref=f1e2895]: "Το reverb δεν είναι απλώς μια σειρά από επαναλήψεις όπως το delay· προσομοιώνει τις χιλιάδες, σχεδόν ταυτόχρονες ανακλάσεις ενός ήχου μέσα σε έναν φυσικό χώρο — τοίχους, οροφή, δάπεδο, αντικείμενα — που το αυτί μας δεν τις ακούει ως ξεχωριστές επαναλήψεις αλλά ως 'μέγεθος' και 'χαρακτήρα' του χώρου. Όπως σημειώνεται στη βιβλιογραφία, ένα delay unit είναι περιορισμένο στο να αναπαράγει πραγματική αμπιάνς ακριβώς επειδή οι επαναλήψεις του είναι διακριτές και ισόχρονες — καλό για volume swells ή ελαφρύ strumming, αλλά όχι για δυνατό picking ή σφιχτή, funky κιθαριστική δουλειά, όπου οι επαναλήψεις γίνονται πολύ ευδιάκριτες. Το reverb λύνει αυτό το πρόβλημα. Το πρώτο μηχανικό reverb που αναπτύχθηκε ήταν το spring reverb, ενσωματωμένο σχεδόν σε κάθε βιντατζ ενισχυτή. Ένα transducer μετατρέπει το ηλεκτρικό σήμα σε μηχανική ενέργεια, το στέλνει μέσα από ένα ή περισσότερα ελατήρια, και ένα δεύτερο transducer το μετατρέπει πίσω σε ηλεκτρικό σήμα. Ο χρόνος που χρειάζεται το σήμα να διασχίσει το ελατήριο προσθέτει καθυστέρηση, ενώ το ίδιο το ελατήριο αλλοιώνει τη συχνοτική απόκριση με τρόπο πιο ανομοιόμορφο από ένα delay — κι αυτό ακριβώς είναι που το κάνει να ακούγεται πιο φυσικό. Όσο περισσότερα ελατήρια, τόσο πιο φυσικό το αποτέλεσμα· όσο μακρύτερα τα ελατήρια, τόσο μεγαλύτερος ο χρόνος αντήχησης. Τα spring reverb με λυχνίες (tube-driven) έχουν μια ζεστασιά που δύσκολα αναπαράγει ακόμα και ακριβό ψηφιακό reverb, αλλά έχουν και το γνωστό μειονέκτημα: το χαρακτηριστικό 'sproi-oi-oiing' σε δυνατό attack. Για τον κλασικό ήχο τύπου Duane Eddy, όμως, παραμένουν ασυναγώνιστα. Το plate reverb δεν χρησιμοποιεί ελατήριο αλλά μια δονούμενη μεταλλική πλάκα, και προσομοιώνει μια πυκνή, λεία, χωρίς 'βρωμιά' αντήχηση — γι' αυτό και έγινε αγαπημένο εργαλείο στούντιο για φωνητικά και κιθάρα σε παραγωγές που θέλουν λείο decay χωρίς τη μηχανική 'ανωμαλία' του spring. Στη σύγχρονη πρακτική το plate προσομοιώνεται ψηφιακά σε πολλά reverb units και πρόσθετα λογισμικού, αλλά η λογική παραμένει ίδια: πυκνό, ελεγχόμενο decay, ιδανικό όταν θέλεις αντήχηση που δεν τραβάει την προσοχή στον εαυτό της. Το αλγοριθμικό reverb (ambient, room, hall) ήρθε με την ψηφιακή τεχνολογία και επέτρεψε την προσομοίωση σχεδόν οποιουδήποτε μεγέθους και τύπου χώρου — από ένα μικρό γκαράζ μέχρι μια αίθουσα συναυλιών ή έναν εντελώς συνθετικό, μη ρεαλιστικό χώρο. Η βιβλιογραφία σημειώνει ότι αυτού του τύπου το reverb είναι υπεύθυνο για τον 'αέρινο' ήχο πολλών jazz δίσκων της ECM, όπου ο μηχανικός μπορεί να τοποθετήσει τον ήχο οπουδήποτε μέσα σε έναν εικονικό χώρο. Τα μεγάλα, αργά decay 'hall' ή 'ambient' reverbs δημιουργούν συνεχή, ατμοσφαιρικά υφάσματα ήχου, ενώ πιο σύντομα, στεγνά 'room' reverbs δίνουν απλώς την αίσθηση ενός φυσικού δωματίου χωρίς να φαίνονται σαν εφέ. Και στα τρία, ισχύει ο ίδιος κανόνας θέσης στην αλυσίδα σήματος που είδαμε στο προηγούμενο μάθημα με το delay: το reverb μπαίνει τελευταίο, είτε επειδή βρίσκεται ήδη μέσα στον ενισχυτή, είτε γιατί τοποθετημένο μετά τα gain και modulation στάδια αφήνει το σήμα καθαρό και ευδιάκριτο πριν 'απλωθεί' μέσα στον χρόνο."
