                                - paragraph [ref=f1e2943]: Οι ασκήσεις χτίζονται πάνω στην ακουστική αναγνώριση και μετά περνούν σε πρακτική εφαρμογή μέσα σε μουσικό context, ακολουθώντας τη λογική ότι το reverb πρέπει να επιλέγεται ανάλογα με τον χώρο και το τραγούδι, όχι μηχανικά. Αναγνώριση τύπου reverb με κλειστά μάτια (6 min) Ο δάσκαλος παίζει τρία σύντομα περάσματα — ένα με spring, ένα με plate, ένα με αλγοριθμικό hall — χωρίς να αποκαλύψει ποιο είναι ποιο. Ο μαθητής προσπαθεί να τα αναγνωρίσει και να εξηγήσει τι άκουσε (μεταλλικό/boingy, λείο/συμπαγές, ή μεγάλο/ατμοσφαιρικό). Simulate soundcheck vs γεμάτο club (8 min) Ο μαθητής ρυθμίζει reverb amount σε ένα ρυθμικό riff σαν να παίζει σε άδεια αίθουσα (λίγο reverb χρειάζεται γιατί ο χώρος ήδη αντηχεί), μετά προσαρμόζει προς τα πάνω σαν να είναι γεμάτο και απορροφητικό club. Στόχος είναι να νιώσει πόσο αλλάζει η ανάγκη για reverb ανάλογα με τον πραγματικό χώρο. Plate reverb σε ρυθμικό comping (6 min) Παίξε ένα comping πάνω σε jazz-blues πρόοδο με πολύ χαμηλό plate reverb, ώστε να προσθέτει βάθος χωρίς να θολώνει τον ρυθμό. Hall reverb σε sustained solo (8 min) Παίξε αργές, τραβηγμένες νότες πάνω σε backing track με μεγάλο hall/ambient decay, εστιάζοντας στο πώς οι νότες 'αιωρούνται' και πότε αρχίζουν να μπερδεύονται μεταξύ τους.
