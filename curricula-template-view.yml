                              - generic [ref=f1e540]:
                                - paragraph [ref=f1e541]: "Το πιο συχνό λάθος είναι η υπερβολική πίεση στο πάτημα τάστων, ειδικά σε κιθάρες με ψηλά τάστα: ο μαθητής νομίζει ότι «πρέπει να πατήσει δυνατά» για καθαρό ήχο, ενώ στην πραγματικότητα η επιπλέον πίεση μετά το σημείο επαφής μόνο ανεβάζει τη νότα εκτός τόνου — ιδιαίτερα εμφανές σε συγχορδίες όπου η ανομοιόμορφη πίεση κάθε δαχτύλου κάνει τη συγχορδία να ακούγεται «βρώμικη». Η διόρθωση είναι να δείξουμε στον μαθητή πόσο ελάχιστη πίεση χρειάζεται πραγματικά — αρκεί η χορδή να ακουμπήσει σταθερά το τάστο. Ένα δεύτερο συχνό λάθος είναι να συγχέει κανείς πρόβλημα τονισμού (bad string, worn frets) με πρόβλημα κουρδίσματος (tuning machines), και να κατηγορεί πρώτα τα κλειδιά όταν η κιθάρα δεν κρατάει τον τόνο. Όπως τονίζεται στη βιβλιογραφία, ο σωστός έλεγχος είναι πρώτα τα windings στα κλειδιά, μετά η ηλικία των χορδών, μετά το intonation, και μετά η πίεση των δαχτύλων — τα κλειδιά ελέγχονται τελευταία. Τρίτο λάθος: μαθητές (και μερικές φορές δάσκαλοι) βλέπουν έναν λαιμό με ελαφριά κοιλότητα και βιάζονται να «τον ισιώσουν» με το truss rod, χωρίς πρώτα να παίξουν και να ακούσουν αν πραγματικά υπάρχει πρόβλημα παιξιμότητας. Πολλοί λαιμοί χρειάζονται μια μικρή κοιλότητα για να παίζουν σωστά· η διόρθωση είναι πάντα το «άκουσε πρώτα, ρύθμισε μετά»."
