                              - generic [ref=f1e3727]:
                                - paragraph [ref=f1e3728]: "Οι ασκήσεις αυτής της ενότητας δεν προσθέτουν νέο εξοπλισμό ή τεχνική - δουλεύουν πάνω στην ικανότητα του μαθητή να ακούει το ίδιο σήμα σε δύο διαφορετικά ακουστικά περιβάλλοντα και να προσαρμόζει τη ρύθμιση ανάλογα. Ξεκινάμε από το πιο απτό (EQ σε σχέση με μείγμα), προχωράμε στην ένταση σε σχέση με το ρυθμικό όργανο, και κλείνουμε με μια μικρή γεύση στούντιο νοοτροπίας. A/B mids: δωμάτιο εναντίον μπάντας (8 min) Ρύθμισε δύο πλήρως διαφορετικά EQ settings στο amp (ένα scooped, ένα με παρόντα mids). Παίξε το ίδιο riff πρώτα μόνος, μετά πάνω σε ένα backing track δυνατά. Σημείωσε ποιο setting 'επιβιώνει' μέσα στο μείγμα. Live volume matching με τα ντραμς (7 min) Αν υπάρχει backing track ή metronome/drum loop, ρύθμισε την ένταση του amp ώστε να ακούγεται άνετα πάνω από τον ρυθμό, χωρίς να παίζεις υπερβολικά δυνατά. Στόχος είναι να νιώσει ο μαθητής πώς η ένταση οδηγείται από τα ντραμς και όχι από το πόσο δυνατά θέλει να ακούγεται μόνος του. Στούντιο νοοτροπία: παίξε 'καθαρά' για τον μηχανικό (8 min) Ηχογράφησε (με κινητό αν δεν υπάρχει άλλο μέσο) ένα rhythm pass χωρίς κανένα εφέ πάνω από ένα καθαρό ή ελαφρώς overdriven tone. Άκουσέ το πίσω και συζήτησε τι θα ζητούσε ο μαθητής από έναν μηχανικό ('πιο πρίμο', 'πιο μεσαία') αντί να αλλάξει ο ίδιος τα knobs στο amp."
