                              - generic [ref=f1e1769]:
                                - paragraph [ref=f1e1770]: Μέχρι το επόμενο μάθημα, πέρασε 15-20 λεπτά τη μέρα με τον ενισχυτή σου (ή ένα amp modeling αν δεν έχεις tube amp) δοκιμάζοντας τη διαφορά preamp gain / master volume σε τουλάχιστον τρία διαφορετικά σημεία ρύθμισης, και κράτα νοερές σημειώσεις για το πώς αλλάζει η αίσθηση κάτω από τα δάχτυλά σου —όχι μόνο ο ήχος. Αν έχεις ένα πεντάλ distortion ή overdrive, δοκίμασε το ίδιο πείραμα με το πεντάλ μπροστά από καθαρό κανάλι και συνέκρινε. Θα ξέρεις ότι το 'πιάνεις' όταν μπορείς να αναγνωρίσεις με κλειστά μάτια αν η παραμόρφωση που ακούς προέρχεται κυρίως από preamp ή από power amp, βασισμένος μόνο στο πόσο 'σφιχτό' ή 'χαλαρό' ακούγεται το attack της νότας.
                                - button "Επέκταση με συνομιλία" [ref=f1e1773]
