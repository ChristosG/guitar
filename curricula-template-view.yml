                              - generic [ref=f1e2273]:
                                - paragraph [ref=f1e2274]: "Στο προηγούμενο μάθημα είδαμε πώς τα gain effects και το compression δουλεύουν πάνω στο πλάτος και τη μορφή του κύματος. Τα modulation effects δουλεύουν διαφορετικά: όλα βασίζονται σε έναν LFO (low-frequency oscillator), δηλαδή έναν ταλαντωτή χαμηλής συχνότητας που μεταβάλλει συνεχώς και κυκλικά μια ιδιότητα του σήματος στον χρόνο, προσθέτοντας κίνηση σε έναν ήχο που διαφορετικά θα ήταν στατικός. Αυτό που διαφοροποιεί το ένα modulation effect από το άλλο είναι ποια ακριβώς ιδιότητα διαμορφώνει ο LFO — delay time, φάση, ένταση, ή και πλάτος και ύψος μαζί. Σχεδόν κάθε πεντάλ διαμόρφωσης έχει δύο βασικά κοντρόλ: rate (ή speed), που καθορίζει πόσο γρήγορα κυκλοφορεί ο ταλαντωτής, και depth (ή width), που καθορίζει πόσο μακριά ταξιδεύει η παράμετρος από το κεντρικό σημείο της. Το chorus παίρνει το σήμα, το διπλασιάζει, καθυστερεί το αντίγραφο περίπου 20 χιλιοστά του δευτερολέπτου, και μετά μεταβάλλει συνεχώς αυτή την καθυστέρηση κατά ένα εύρος έως 5ms πάνω-κάτω μέσω του LFO, πριν το αναμείξει ξανά με το dry σήμα. Αυτό προσομοιώνει το φαινόμενο μιας δωδεκάχορδης κιθάρας ή δύο κιθαριστών που παίζουν το ίδιο πράγμα ελαφρώς εκτός συγχρονισμού και εκτός κουρδίσματος — το πλούσιο, «απλωμένο» άκουσμα δεν προέρχεται από τις επιπλέον χορδές αυτές καθαυτές, αλλά από τη μικρή χρονική και τονική τους απόκλιση. Το chorus είναι ιδανικό σε καθαρούς ήχους, δίνοντας ένα λαμπερό, φαρδύ αποτέλεσμα. Ο flanger λειτουργεί με παρόμοια λογική αλλά με πολύ μικρότερη βασική καθυστέρηση — περίπου 5 έως 10ms — σαρωμένη σε πολύ ευρύτερο εύρος, από 1 έως και 20ms. Αυτή η στενή, γρήγορα μεταβαλλόμενη καθυστέρηση δημιουργεί μια χαρακτηριστική comb-filter σάρωση, το γνωστό «jet plane» sweep. Ο flanger διαθέτει επιπλέον ένα κοντρόλ feedback ή regeneration, που ανακυκλώνει το καθυστερημένο σήμα μέσα από τον εαυτό του, τονίζοντας τον μεταλλικό χαρακτήρα του εφέ όσο το ανεβάζεις. Ο phaser μοιάζει ηχητικά με τον flanger αλλά λειτουργεί εντελώς διαφορετικά: δεν περιέχει καθόλου κύκλωμα καθυστέρησης. Αντ' αυτού, περνά το σήμα μέσα από μια σειρά all-pass φίλτρων που μετατοπίζουν τη φάση του σε ένα σαρωμένο ρυθμό, παράγοντας ένα στροβιλιστικό αποτέλεσμα που είναι πιο λεπτό και λιγότερο μεταλλικό από τον flanger, χωρίς να επηρεάζεται καθόλου το ύψος της νότας. Το tremolo και το vibrato μπερδεύονται συχνά επειδή ακούγονται συγγενικά, αλλά διαμορφώνουν διαφορετική ιδιότητα: το tremolo μεταβάλλει ρυθμικά την ένταση (το πλάτος) του σήματος — δηλαδή ο LFO ανοιγοκλείνει την ένταση σαν παλμό, από ένα απαλό «wobble» μέχρι ένα κοφτό «stutter». Το αληθινό vibrato αντίθετα λυγίζει ρυθμικά το ύψος της νότας πάνω-κάτω, χωρίς να αγγίζει την ένταση. Τέλος, το rotary effect, εμπνευσμένο από το φυσικό περιστρεφόμενο ηχείο Leslie, συνδυάζει και τα δύο είδη διαμόρφωσης ταυτόχρονα — πλάτους και ύψους — μαζί με ένα φυσικό φαινόμενο Doppler που προκύπτει από την πραγματική περιστροφή του ηχείου και του κέρατος, παράγοντας ένα πολύπλοκο στροβιλιστικό αποτέλεσμα παραδοσιακά συνδεδεμένο με το εκκλησιαστικό όργανο, αλλά και με ορισμένους κιθαριστικούς ήχους."
