                              - generic [ref=f1e3301]:
                                - paragraph [ref=f1e3302]: "Ο δάσκαλος στήνει live ένα μικρό μοντέλο 4CM με δύο καλώδια guitar-to-pedalboard-to-amp-input και δύο ακόμα pedalboard-to-loop-send/return, δείχνοντας πώς ένα overdrive pedal μπαίνει στην κανονική είσοδο (πριν το preamp) ενώ ένα delay pedal μπαίνει στο effects loop (μετά το preamp, πριν την power section). Παίζει το ίδιο riff σε Em πρώτα με το delay μπροστά στην κανονική είσοδο πάνω από το ήδη distorted σήμα — ο μαθητής ακούει πώς θολώνει — και μετά το ίδιο riff με το delay στο loop, όπου οι επαναλήψεις μένουν καθαρές και ξεχωριστές. Στη συνέχεια, με δύο μικρούς practice amps διαθέσιμους στο studio, ο δάσκαλος δείχνει μια απλή εκδοχή wet/dry/wet: μία κιθάρα, ένα Y-cable πριν το delay pedal, το dry sound σε έναν amp και το 100% wet sound (μόνο delay, χωρίς dry mix) στον άλλο amp, ρυθμισμένο σε πολύ μικρό delay time (περίπου 15-30ms) όπως περιγράφει ο Ross για να «φουσκώσει» ο ήχος χωρίς να ακούγεται σαν ξεχωριστή επανάληψη. Ο μαθητής ακούει τη διαφορά ανάμεσα σε mono και σε αυτό το ψευτο-στερεοφωνικό αποτέλεσμα και σημειώνει πόσο πιο 'μεγάλη' ακούγεται η κιθάρα."
