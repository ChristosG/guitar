                              - generic [ref=f1e2792]:
                                - paragraph [ref=f1e2793]: "Σήμερα είδαμε τρεις γενιές delay — tape, analog, digital — και τρεις εφαρμογές που χτίζονται πάνω στις ίδιες τρεις παραμέτρους: χρόνο, επαναλήψεις, μείγμα. Slapback: κοντό, μία επανάληψη, δυνατό μείγμα, για πάχος χωρίς αισθητή ηχώ. Dotted-eighth: συγχρονισμένο με το tempo, πολλές επαναλήψεις, μέτριο μείγμα, για ρυθμικό καταρράκτη. Ping-pong: στερεοφωνικό, για πλάτος. Το κοινό νήμα είναι ότι το αυτί σου, όχι ο αριθμός στην οθόνη, αποφασίζει πότε μια ρύθμιση «κολλάει»."
