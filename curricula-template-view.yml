                              - generic [ref=f1e831]:
                                - paragraph [ref=f1e832]: "Πριν μπούμε σε θεωρία, ζεσταίνουμε το χέρι με κάτι πολύ απλό αλλά διδακτικό: μια αργή, καθαρή εναλλαγή ανάμεσα σε ένα open E και ένα open A chord, χτυπημένα σε τέσσερα τέταρτα το καθένα, σε αργό tempo γύρω στα 70 bpm, χωρίς κανένα effect ενεργό — καθαρή κιθάρα, καθαρός ενισχυτής. Ο μαθητής παίζει το ίδιο μοτίβο τρεις φορές: πρώτα χτυπώντας δυνατά και σταθερά, μετά πολύ απαλά, και τέλος με τη φυσική του ένταση. Το ζητούμενο δεν είναι τεχνική άνεση αλλά αφουγκρασμα: να ακούσει πόσο αλλάζει ο χαρακτήρας του ήχου μόνο από το πόσο δυνατά χτυπάει τις χορδές, πριν αγγίξουμε καν πένα ή χορδές σαν μεταβλητές. Αυτό προετοιμάζει το αυτί για το βασικό μάθημα: ότι το χέρι είναι ήδη ένα ισχυρότατο εργαλείο διαμόρφωσης του tone."
