                              - generic [ref=f1e1255]:
                                - paragraph [ref=f1e1256]: "Στο προηγούμενο μάθημα είδαμε ότι ο ενισχυτής είναι συνήθως το μεγαλύτερο ενιαίο στάδιο διαμόρφωσης tone στην αλυσίδα, με τον preamp να σχηματοποιεί το σήμα, το tone stack να το φιλτράρει, και τον power amp να προσθέτει τη δική του συμπίεση καθώς οδηγείται προς το clipping. Σήμερα δεν ξαναμπαίνουμε σε αυτά τα στάδια — τα παίρνουμε δεδομένα και κοιτάμε πώς οι μεγάλοι κατασκευαστές τα συνδύασαν με διαφορετικό τρόπο για να φτιάξουν τέσσερις εντελώς διαφορετικές φωνές. Η οικογένεια Fender είναι το σημείο αναφοράς για clean-headroom ήχο: μεγάλη καθαρή δυναμική περιοχή πριν αρχίσει η παραμόρφωση, scooped-mid χαρακτήρα (δηλαδή τα μεσαία είναι ελαφρώς βυθισμένα σε σχέση με τα μπάσα και τα πρίμα) και ένα λαμπερό, sparkly top end. Το ιστορικό ναυαρχίδα είναι το Fender Twin, αλλά η πιο γνωστή σειρά είναι η λεγόμενη blackface — Deluxe Reverb, Super Reverb, Vibroverb, Vibroluxe, Twin Reverb, Pro Reverb — ονομασία που προέρχεται από το μαύρο πάνελ γύρω από τα κουμπιά μετά την εξαγορά της Fender από την CBS στα μέσα της δεκαετίας του '60. Πριν από αυτές υπήρχαν οι tweed ενισχυτές, όπως ο θρυλικός 4x10 Bassman, που έγινε αργότερα η βασική έμπνευση για τον πρώτο Marshall. Επειδή η Fender έχει τόσο μεγάλο headroom, ανταποκρίνεται εξαιρετικά καλά σε pedals μπροστά της· ο ίδιος ο ενισχυτής μένει καθαρός και αφήνει τα pedals να κάνουν τη δουλειά της παραμόρφωσης — γι' αυτό είναι τόσο δημοφιλής σε blues, country, funk και σε γενικότερα πλαίσια όπου χρειάζεσαι φωτεινότητα και άρθρωση. Η οικογένεια Marshall πηγαίνει στην αντίθετη κατεύθυνση: σπρώχνει τα μεσαία προς τα εμπρός και σπάει νωρίτερα σε distortion, δίνοντας το κλασικό crunch του ροκ. Ιστορικά, ο πρώτος Marshall, το JTM45 του 1962, χτίστηκε ρητά πάνω στο σχέδιο του Fender Bassman. Η μεγάλη στιγμή που όρισε τον ήχο του rock guitar ήρθε το 1966 όταν ο Eric Clapton έπαιξε μια Gibson Les Paul μέσα από έναν 50-watt Marshall combo με δύο κάσες δώδεκα ιντσών, παίζοντας τόσο δυνατά ώστε ο μηχανικός ήχου να του ζητήσει να χαμηλώσει — κι εκείνος αρνήθηκε. Αυτός ο ήχος έγινε το πρότυπο για τη γενιά που ακολούθησε. Ο Jim Marshall τροποποίησε τα κυκλώματά του για πιο φωτεινό, πιο δυνατό ήχο με πληρέστερο distortion, και το 1965 κυκλοφόρησε το 100-watt Super Lead — το Plexi — που, όταν συνδυάστηκε με μία ή δύο κάσες 4x12, δημιούργησε το περίφημο Marshall stack. Αργότερα, το 1981, το JCM800 έφερε master volume σε αυτή τη φιλοσοφία, επιτρέποντας το ίδιο crunch σε πιο λογικές εντάσεις. Το αποτέλεσμα σε όλες τις γενιές Marshall είναι το ίδιο: παρουσιαστικά μεσαία που κόβουν μέσα σε ένα μείγμα ροκ μπάντας — ακριβώς το αντίθετο από το scooped Fender. Η Vox, με ναυαρχίδα το AC30, χτίζει μια τρίτη, εντελώς ξεχωριστή φωνή: chimey, γυάλινο πρίμα και μια χαρακτηριστική class-A βαθμίδα ισχύος που δίνει μια πιο ζωντανή, σχεδόν συμπιεσμένη αίσθηση στο attack της νότας. Το AC30 κυκλοφόρησε το 1959 και ξαναβγήκε το 1960 σε τρικάναλη μορφή, γίνοντας ταυτόσημο με τον ήχο της British Invasion. Βρίσκεται τονικά κάπου ανάμεσα σε Fender και Marshall — όχι τόσο καθαρό-headroom όσο η Fender, όχι τόσο μεσαιοβαρύ όσο η Marshall — και είναι η επιλογή καλλιτεχνών όπως ο Brian May και ο The Edge για έναν ήχο που είναι φωτεινός αλλά όχι σκληρός. Τέλος, η οικογένεια high-gain (Mesa/Boogie, Soldano, Peavey 5150-style, ENGL, Diezel) είναι προϊόν μιας εντελώς διαφορετικής φιλοσοφίας σχεδίασης: το cascading gain. Στις αρχές της δεκαετίας του '70, ο ιδρυτής της Mesa/Boogie, Randall Smith, τροποποιούσε Fender ενισχυτές προσθέτοντας πολλαπλά, διαδοχικά στάδια preamp gain που ξεχειλίζουν το ένα μέσα στο άλλο, παράγοντας πολύ περισσότερο distortion από όσο μπορούσε ποτέ ένα μονό στάδιο. Αυτό γέννησε τη σειρά Mark και τον όρο high-gain amp. Η φιλοσοφία αυτή τελειοποιήθηκε τη δεκαετία του '80 από τεχνικούς όπως ο Mike Soldano (SLO-100) και αργότερα ενσωματώθηκε σε αμπ σχεδιασμένα ειδικά για metal, όπως το Peavey 5150 που σχεδιάστηκε μαζί με τον Eddie Van Halen. Ο χαρακτήρας εδώ είναι κορεσμένος αλλά σφιχτός: πολύ gain, ελεγχόμενα μπάσα, καθαρή άρθρωση ακόμα και σε πυκνά power chords — ιδανικό για σύγχρονο rock και metal rhythm playing, όπου χρειάζεσαι μαζική παραμόρφωση χωρίς να χάνεις καθαρότητα."
