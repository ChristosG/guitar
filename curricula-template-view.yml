                              - generic [ref=f1e727]:
                                - paragraph [ref=f1e728]: "Το πιο συχνό λάθος είναι να πιστεύει ο μαθητής ότι humbucker = «καλύτερο» και single coil = «κατώτερο», απλώς επειδή ο humbucker δεν κάνει hum. Στην πραγματικότητα είναι δύο διαφορετικά εργαλεία για διαφορετική δουλειά· ο Hendrix, ο Jeff Beck, ο Clapton και δεκάδες άλλοι έπαιξαν χρόνια με single coils και το κοινό τους ποτέ δεν ζήτησε επιστροφή χρημάτων επειδή άκουγε λίγο hum σε δίσκο. Δεύτερο συχνό λάθος: ο μαθητής μπερδεύει coil-split με coil-tap — δεν είναι το ίδιο πράγμα. Το coil-split παίρνει έναν πλήρη humbucker και βγάζει από το κύκλωμα το ένα πηνίο, αφήνοντας ένα ενεργό single coil (με ό,τι hum αυτό συνεπάγεται)· το coil-tap είναι κάτι διαφορετικό, μια δεύτερη έξοδος μέσα στα windings ενός ήδη single coil pickup, που δίνει πιο φωτεινό, πιο χαμηλού output ήχο χωρίς να αλλάζει τον αριθμό των ενεργών πηνίων. Τρίτο λάθος, πιο πρακτικό: όταν δοκιμάζουν series/parallel ή coil-split για πρώτη φορά, πολλοί μαθητές περιμένουν «τέλεια» απομίμηση του άλλου τύπου pickup — δεν θα το πετύχουν ποτέ 100%, γιατί η γεωμετρία και η θέση των πηνίων παραμένουν διαφορετικές. Ο στόχος είναι μια χρήσιμη παραλλαγή, όχι πιστή αντιγραφή."
