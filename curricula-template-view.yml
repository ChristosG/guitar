                              - generic [ref=f1e3517]:
                                - paragraph [ref=f1e3518]: "Θα παίξω κάθε rig ως προσέγγιση με το gear που έχουμε στην τάξη, ώστε να ακούσεις τη διαφορά τεχνικής, όχι μόνο εξοπλισμού. Πρώτα, Hendrix: πικάπ γέφυρας, wah ανοιχτό στη μέση της κίνησής του, fuzz ενεργό, παίζω ένα riff τύπου 'Voodoo Child' με έμφαση στο bend και στο vibrato του δαχτύλου — άκου πώς το wah λειτουργεί σαν φωνή πάνω στο fuzz. Δεύτερο, Clapton 'woman tone': γυρίζω το tone knob της κιθάρας στο 2 (σχεδόν κλειστό), επιλέγω το neck humbucker, παίζω ένα αργό, παρατεταμένο bending lick στη 12η θέση με πολύ crunch από τον ενισχυτή — θα ακούσεις τον ήχο να γίνεται σκοτεινός και σχεδόν σαν σαξόφωνο. Τρίτο, SRV: βαριά downstroke επίθεση σε ένα shuffle riff στο Mi, όσο πιο δυνατά μπορώ χωρίς να χάνω τον έλεγχο — θα νιώσεις πώς η ίδια η δύναμη της επαφής παράγει compression χωρίς κανένα pedal. Τέταρτο, Gilmour: sustained νότες με ελαφρύ overdrive και dotted-eighth delay ρυθμισμένο περίπου στα 375ms σε 120 bpm, ώστε οι επαναλήψεις να πέφτουν ανάμεσα στους παλμούς — μια νότα γίνεται μελωδική γραμμή. Πέμπτο, The Edge: μια απλή αρπέζ συγχορδία (π.χ. Ρε σε ανοιχτή θέση) μέσα από το ίδιο dotted-eighth delay αλλά με καθαρό ήχο — άκου πώς τρεις νότες γίνονται κατακλυσμός. Έκτο, Van Halen: ένα απλό tapping lick σε cranked gain, παίζοντας πρώτα με ίδια δυναμική σε όλες τις νότες και μετά με έντονη διαφοροποίηση δυναμικής, για να ακούσεις πώς η άρθρωση από τα δάχτυλα αλλάζει τελείως το αποτέλεσμα, ακόμα και με την ίδια ρύθμιση gain."
                                - link "Getting Great Guitar Sounds, σελ. 70" [ref=f1e3520] [cursor=pointer]:
