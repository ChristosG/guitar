                              - generic [ref=f1e3622]:
                                - paragraph [ref=f1e3623]: "Άνοιξε τη συζήτηση ζητώντας από τον μαθητή να εξηγήσει με δικά του λόγια το κοινό νήμα ανάμεσα στα έξι rigs, πριν περάσεις στις πιο στοχευμένες ερωτήσεις παρακάτω. Q: Πώς πέτυχε ο Eric Clapton το 'woman tone' στην εποχή των Cream, και σε ποιο πικάπ/knob αντιστοιχεί; A: Γύρισε το tone knob σχεδόν εντελώς κλειστό σε κιθάρα με humbucker (neck πικάπ), μέσα σε cranked/overdriven ενισχυτή — παράγοντας παχύ, σκοτεινό, φωνητικό sustain. Q: Γιατί είναι λάθος να πούμε ότι ο ήχος του Hendrix ήταν πάντα 'πολύ fuzz'; A: Πολλά κομμάτια του (π.χ. 'Little Wing') είναι χτισμένα σε καθαρό ή ελαφρώς overdriven ήχο· ζωντανά χρησιμοποιούσε λίγα effects (Fuzz Face, Octavia, Uni-Vibe, wah), όχι μόνιμο βαρύ fuzz. Q: Ποιο ήταν το βασικό συστατικό στο 'brown sound' του Van Halen, πέρα από το gear; A: Η τεχνική/δύναμη των δαχτύλων του — πολλοί μιμητές χρησιμοποιούν πολύ περισσότερο gain απ' όσο εκείνος, χάνοντας την άρθρωσή του. Q: Γιατί μπόρεσαν ο Edge και ο Andy Summers να χτίσουν ήχους γεμάτους delay/flanger χωρίς να 'πνίγονται' στο μείγμα; A: Έπαιζαν σε τριμελή σχήματα με ντράμερ που κρατούσαν λιτό ρυθμό (snare, toms, hi-hat), αφήνοντας μεγάλο ηχητικό χώρο για τα effects. Q: Ποιο στοιχείο του rig του Stevie Ray Vaughan θεωρείται πιο δύσκολο να αντιγραφεί από gear, σύμφωνα με το κείμενο; A: Η δυνατή, επιθετική επαφή του με τις χορδές — τα δυνατά του χέρια, όχι απλώς οι βαριές χορδές ή τα pedals."
