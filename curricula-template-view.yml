                              - generic [ref=f1e3911]:
                                - paragraph [ref=f1e3912]: "Οι ασκήσεις χωρίζονται σε δύο μέρη: πρώτα εξασκούμαστε στις τρεις συνταγές EQ πάνω σε δικό σου υλικό, και μετά δουλεύουμε την κρίση για το πότε ένα effect βοηθά ή βλάπτει. Blues/Classic Rock EQ (6 min) Παίξε ένα δικό σου lead lick ή solo φράση πάνω σε backing track blues σε A. Ρύθμισε το amp με φουσκωμένο midrange (γύρω στα 750 Hz αν έχεις EQ pedal) και άκου αν το solo \"τραγουδάει\" και ξεχωρίζει. Δοκίμασε να σκάψεις το mid για σύγκριση και σημείωσε τη διαφορά. Metal Scoop (6 min) Παίξε palm-muted power chords σε δρόπ ή κανονικό tuning με distortion. Σκάψε το mid, φούσκωσε bass και treble ελαφρά. Στόχος: τα riffs να μένουν καθαρά και σφιχτά, όχι θολά, ακόμα κι όταν παίζεις γρήγορα palm-muted 8άρια. Funk/Country Bright Clean (5 min) Παίξε staccato, ρυθμικά accents με clean ήχο. Ανέβασε treble, κατέβασε bass ελαφρά, πρόσθεσε λίγη compression αν έχεις pedal, για να ακούγεται κάθε χτύπημα καθαρό και percussive. Effect ή όχι effect; (8 min) Πάρε μια φράση δικής σου επιλογής και παίξε την σε δύο υποθετικά σενάρια: (α) ζωντανά σε γεμάτη club με μπάντα, (β) μόνος σου σε ηχηρή, μισοάδεια αίθουσα. Αποφάσισε δυνατά ποιο effect (αν κάποιο) θα κρατούσες σε κάθε σενάριο και γιατί, πριν το δοκιμάσεις."
