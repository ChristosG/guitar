                              - generic [ref=f1e2255]:
                                - paragraph [ref=f1e2256]: Πριν αγγίξουμε οποιοδήποτε πεντάλ διαμόρφωσης, παίξε πέντε λεπτά εντελώς dry — χωρίς κανένα εφέ, μόνο κιθάρα και καθαρός ήχος amp. Άρπισε μια σειρά από ανοιχτές συγχορδίες με προσθήκες 9ης (π.χ. Asus2, Em9, Cadd9) σε αργό τέμπο, δίνοντας προσοχή στο πώς ηχεί κάθε νότα μόνη της, χωρίς κίνηση γύρω της. Αυτό είναι σημαντικό γιατί τα modulation effects δουλεύουν πάνω σε καθαρό ή ελαφρώς driven ήχο πιο αποτελεσματικά — δηλαδή πάνω ακριβώς σε αυτό που μόλις έπαιξες. Το αυτί σου χρειάζεται μια σταθερή αναφορά «στεγνού» ήχου πριν ακούσει πώς η διαμόρφωση προσθέτει κίνηση πάνω του.
                                - link "Guitar Tone & Gear — Course Spine, σελ. 1" [ref=f1e2258] [cursor=pointer]:
                                  - /url: /el/library/b2d791ca-08dc-468d-acf5-89c19098274e?page=1
