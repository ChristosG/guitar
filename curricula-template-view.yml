                              - generic [ref=f1e1080]:
                                - paragraph [ref=f1e1081]: "Στο προηγούμενο module είδαμε ότι η ίδια η κιθάρα είναι ο πρώτος κρίκος στην αλυσίδα του tone. Τώρα περνάμε στον κρίκο που συνήθως έχει τη μεγαλύτερη επιρροή απ' όλους: τον ενισχυτή. Ένας λυχνιακός ενισχυτής δεν είναι ένα ενιαίο κουτί που απλώς \"κάνει πιο δυνατή\" την κιθάρα — είναι δύο ξεχωριστά στάδια ενισχυτή, καθένα με δικό του χαρακτήρα, συνδεδεμένα σε σειρά: το preamp και το power amp. Το preamp είναι το πρώτο στάδιο. Δουλειά του είναι να πάρει το ασθενές σήμα που έρχεται από τα pickups και να το ανεβάσει σε επίπεδο αρκετό ώστε να μπορεί να \"οδηγήσει\" το power amp. Σε αυτό το στάδιο γίνεται και το μεγαλύτερο μέρος της διαμόρφωσης του tone: εδώ βρίσκονται τα gain stages, εδώ προστίθενται overdrive gain stages αν το κύκλωμα το προβλέπει, και εδώ, σε πολλά αμπ, μπαίνουν τα effects. Το πιο κοινό preamp tube είναι η λυχνία 12AX7. Όταν οδηγείς το preamp πολύ δυνατά, παίρνεις ένα πιο ομαλό, πιο αρμονικά πλούσιο distortion — αυτό είναι το \"preamp gain\" που γυρίζεις με το κουμπί που συνήθως λέγεται απλώς Gain ή Drive. Ανάμεσα στο preamp και στο power amp βρίσκεται ο tone stack: τα κουμπιά Bass, Middle, Treble. Δεν είναι ένα ουδέτερο EQ — κάθε κατασκευαστής το καλωδιώνει διαφορετικά, οπότε τα ίδια νούμερα σε ένα Fender και σε ένα Marshall δεν παράγουν το ίδιο αποτέλεσμα, και τα τρία κουμπιά αλληλεπιδρούν μεταξύ τους αντί να λειτουργούν ανεξάρτητα. Ο tone stack σκαλίζει τη συχνότητα του σήματος πριν αυτό φτάσει στο power section, οπότε ό,τι κάνεις εδώ επηρεάζει και το πώς θα \"σπάσει\" αργότερα το power amp. Το power amp είναι το δεύτερο στάδιο. Παίρνει το ήδη διαμορφωμένο σήμα από το preamp και το ενισχύει σε επίπεδο αρκετό για να οδηγήσει τα ηχεία — δηλαδή αρκετό για να ακουστεί στο βάθος της αίθουσας ή στην επόμενη πολιτεία, όπως λέει χαρακτηριστικά ο Michael Ross. Εδώ δουλεύουν λυχνίες ισχύος όπως οι EL34, EL84, 6L6 ή 6V6, μαζί με τον output transformer. Όταν σπρώχνεις το power amp σε υψηλή ένταση, δεν παίρνεις απλώς πιο δυνατό ήχο· παίρνεις power sag —μια φυσική συμπίεση όσο το τροφοδοτικό \"κάμπτεται\" κάτω από το φορτίο— και ένα distortion πιο συμμετρικό, πιο \"φυσικό\" στο αυτί, διαφορετικό από το preamp distortion. Εδώ μπαίνει η έννοια του gain staging: η τέχνη του να αποφασίζεις πού ακριβώς στην αλυσίδα θα συμβεί το distortion — στο preamp, στο master volume, ή σπρώχνοντας ολόκληρο τον ενισχυτή καυτό. Δεν είναι το ίδιο πράγμα να πάρεις distortion γεμίζοντας το preamp gain με το master χαμηλά, ή να το πάρεις γυρίζοντας όλο τον ενισχυτή στο τέρμα. Η ιστορία το επιβεβαιώνει: οι πρώτοι ενισχυτές, όπως ο θρυλικός Marshall Super Lead, είχαν ένα μόνο κουμπί έντασης — για να πάρεις distortion έπρεπε να σπρώξεις ολόκληρο τον ενισχυτή, preamp και power amp μαζί, σε εξωφρενική ένταση. Ο Eric Clapton το 1966, παίζοντας μια Les Paul μέσα σε ένα 50-watt Marshall combo με δύο δωδεκάρια ηχεία, πήρε τον ήχο που καθόρισε το rock guitar tone ακριβώς έτσι: παίζοντας δυνατά, αρνούμενος να χαμηλώσει όταν ο μηχανικός ήχου του το ζήτησε. Αργότερα εμφανίστηκε το master volume: δύο ξεχωριστά κουμπιά, ένα για να ελέγχεις πόσο σπάει το preamp και ένα δεύτερο, μετά το preamp, για να ελέγχεις τη συνολική ένταση εξόδου. Αυτό επέτρεψε να πάρεις distortion σε λογική ένταση δωματίου. Το επόμενο βήμα ήταν το \"cascading gain\" — πολλαπλά preamp gain stages σε σειρά, τεχνική που πρωτοπόρησε η Mesa/Boogie, και που οδήγησε στους σύγχρονους high-gain ενισχυτές."
