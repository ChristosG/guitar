                                - paragraph [ref=f1e355]: Σήμερα μάθαμε ότι η κιθάρα είναι ο πρώτος κρίκος στην αλυσίδα του tone, και ότι μια κιθάρα που δεν ακούγεται καλά ξεβυσμένη δεν θα ακουστεί ποτέ πραγματικά σπουδαία μέσα από ενισχυτή. Είδαμε πώς ο τύπος σώματος —solid, semi-hollow, hollow— καθορίζει την ισορροπία ανάμεσα σε αντήχηση/sustain και αντοχή στο feedback, και πώς η πυκνότητα του ξύλου (βαριά ξύλα όπως mahogany έναντι ελαφρών όπως alder) επηρεάζει το πόσο γεμάτο ή καθαρό ακούγεται το όργανο ανάλογα με την ένταση. Κρατάμε επίσης τη σημαντική επιφύλαξη ότι στο ηλεκτρικό όργανο τα pickups και η ενίσχυση κυριαρχούν περισσότερο απ' ό,τι το ξύλο — κάτι που θα εξερευνήσουμε στο επόμενο μάθημα.
