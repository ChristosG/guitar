# Public-exposure override for Guitar Tutor Copilot (guitar.cgrigoriadis.online).
#
# THIS FILE IS NOW ALMOST EMPTY, AND THAT IS THE POINT.
#
# It used to carry `NEXT_PUBLIC_API_BASE: https://guitar-api.cgrigoriadis.online`
# as a build arg, because Next.js inlines that value into the CLIENT BUNDLE at
# build time. But there is only ONE `web` container — it serves `localhost:8790`
# AND, through nginx, `guitar.cgrigoriadis.online`. A build-time constant can
# therefore hold exactly one value, and whichever one you bake, the OTHER
# environment breaks:
#
#   baked http://localhost:8791   -> the DEPLOYED site tells every visitor's
#     browser to call the visitor's OWN localhost. Nothing errors server-side —
#     the API log is empty, because nothing ever arrives. The user just sees
#     "Couldn't reach the server."
#   baked https://guitar-api.…    -> LOCALHOST then calls the public API
#     cross-SITE (different eTLD+1), so the SameSite=Lax session cookie is not
#     sent on XHR at all. Login succeeds, the app flashes onto /today, and the
#     very next request is unauthenticated. A logout loop that looks like a bug
#     in the gate.
#
# Both of those happened, hours apart, and looked like unrelated problems.
#
# So the build arg is GONE. `apps/web/src/lib/api.ts` now resolves the API base
# in the BROWSER, from `window.location` — localhost talks to localhost, the
# deployed host talks to its own `guitar-api.` subdomain. One image, both
# environments, and no build flag anyone can forget. Rebuilding `web` with plain
# `docker compose build web` is now SAFE.
#
# What remains is the one thing that genuinely differs between the two, and
# cannot be derived: THE COOKIE DOMAIN.
#
#   Prod serves the app from TWO subdomains — `guitar.` (Next.js) and
#   `guitar-api.` (FastAPI) — and the API sets the session cookie. A host-only
#   cookie is sent back to `guitar-api.` on every XHR (so the API authorises
#   fine) but is INVISIBLE to the Next.js middleware on `guitar.`, which reads it
#   to decide whether to bounce to /login. That is a permanent redirect loop for
#   a user who is, in fact, logged in.
#
#   `.cgrigoriadis.online` (leading dot) makes ONE cookie cover both hosts.
#
#   It is NOT in `.env`, because `.env` is shared with local dev and a
#   `Domain=.cgrigoriadis.online` cookie cannot be set from `localhost` at all —
#   pinning it there fixes prod by breaking every dev login.
#
#   `app/auth/session.py::_cookie_kwargs` treats this as a CANDIDATE, applying it
#   only when the request actually arrives on that host, so even a stray
#   COOKIE_DOMAIN in a dev shell cannot break localhost.
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml \
#       up -d --build web api

services:
  api:
    environment:
      COOKIE_DOMAIN: .cgrigoriadis.online
      COOKIE_SECURE: "true"
