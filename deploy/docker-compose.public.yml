# Public-exposure override for Guitar Tutor Copilot (guitar.cgrigoriadis.online).
# Kept SEPARATE from the root docker-compose.yml so the shared base compose is
# unchanged and any other local session running plain `docker compose up` is
# unaffected — same convention as /mnt/nvme2TB/gdpr/deploy/docker-compose.public.yml.
#
# This app has no auth/OIDC (unlike Θέμις's public override, which also has to
# coordinate Keycloak + API issuer/CORS) — the ONE thing that needs to change for
# prod is `NEXT_PUBLIC_API_BASE`, which Next.js inlines into the client bundle at
# BUILD time (apps/web/Dockerfile's own comment: "runtime env_file is too late for
# client bundles"). `cors_origins` on the API side already defaults to include
# https://guitar.cgrigoriadis.online (apps/api/app/config.py) — no API-side change
# needed here at all, so this override touches ONLY the `web` service's build args.
#
# Usage (see deploy/README.md step 3 for the full go-live sequence):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml \
#       build web
#   docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml \
#       up -d --no-deps web
#
# Roll back to the dev-local build: re-run with base compose only (drop the -f
# override) and rebuild — `docker compose build web` restores the
# NEXT_PUBLIC_API_BASE=http://localhost:8791 default from .env/docker-compose.yml.

services:
  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE: https://guitar-api.cgrigoriadis.online
