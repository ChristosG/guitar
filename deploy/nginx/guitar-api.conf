# Guitar Tutor Copilot API — guitar-api.cgrigoriadis.online -> FastAPI on 127.0.0.1:8791
#
# The browser calls this directly (REST only — confirmed no SSE/StreamingResponse
# anywhere in apps/api/app; apps/web/src/lib/api.ts's single `fetch` chokepoint is plain
# request/response). CORS is owned by the FastAPI app itself (CORSMiddleware,
# apps/api/app/main.py; allowlist already includes https://guitar.cgrigoriadis.online per
# apps/api/app/config.py's `cors_origins` default) — nginx must NOT add CORS headers here
# or they will duplicate/conflict with the app's own.
#
# *** Timeouts are ORDINARY, not extended, unlike themis-api's SSE-oriented 420s blanket:
# `POST /curricula/generate` used to be the one slow, LLM-guided-JSON-blocking call here
# (49-179s/call, per apps/api/app/llm/qwen.py's timeout=300 override) — that was the whole
# reason deploy-recon.md flagged a Cloudflare ~100-120s edge-timeout risk. Plan 8
# (2026-07-09-async-generation-and-deploy.md, Tasks 1-5, done + e2e-verified) removed that
# risk at the architecture level instead of the DNS-proxy-mode level: the endpoint now
# enqueues a `GenerationJob` and returns 202 near-instantly (apps/api/app/routers/
# curriculum.py's `generate_curriculum_endpoint`); the actual slow LLM call runs in a
# BackgroundTasks runner off the request path entirely, and the frontend polls
# `GET /jobs/{id}` (fast DB read) until it flips to succeeded/failed. Every request this
# vhost proxies today — enqueue, poll, and the rest of the REST surface (knowledge
# ingest/ask, students, artifacts) — is a quick, bounded call.
#
# ^^^ THAT PARAGRAPH WENT STALE (Plan 11). Two things changed after it was written:
#   1. SSE. `POST /chat/{id}/messages/stream` (apps/api/app/routers/chat.py) streams tokens.
#      nginx buffers proxied responses BY DEFAULT, which would hold the whole stream and
#      hand it over in one lump — reintroducing exactly the dead pause streaming exists to
#      kill. Its own location block below turns buffering off.
#   2. Sync artifact generation. Approving `generate_artifact` in chat runs a blocking
#      guided-JSON call, live-measured at ~85s (Plan 5 Task 6). A 60s read timeout would
#      504 it. Raised to 120s.
#
# CLOUDFLARE CEILING — READ THIS: the free-tier edge proxy times out around 100s and is
# NOT adjustable. An ~85s artifact generation fits, but with little headroom. If artifact
# approval ever starts 524-ing at the edge, the fix is to make artifact generation async
# (202 + GET /jobs/{id}, exactly as curriculum generation already is — the whole machinery
# exists) rather than to grey-cloud the subdomain and lose the Cloudflare protection.
#
# HTTP-only until: sudo certbot --nginx -d guitar.cgrigoriadis.online -d guitar-api.cgrigoriadis.online

server {
    server_name guitar-api.cgrigoriadis.online;
    include snippets/cloudflare-origin-allow.conf;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 30m;   # knowledge-source (PDF) uploads — apps/api/app/routers/knowledge.py

    # SSE: the chat token stream. Buffering MUST be off or nginx holds the whole response
    # and delivers it at once (Plan 11 C4 — the dead pause is the thing we removed).
    location /chat/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;    # sync generate_artifact is ~85s (was 60s -> 504)
    }

    listen 80;
    listen [::]:80;
}
