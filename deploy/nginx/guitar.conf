# Guitar Tutor Copilot — guitar.cgrigoriadis.online -> Next.js web on 127.0.0.1:8790
#
# Model: Cloudflare (orange-cloud) -> home IP:443 -> THIS nginx -> web container.
# Structurally mirrors themis.cgrigoriadis.online.conf / zelofood.cgrigoriadis.online.conf
# (both read live from /etc/nginx/sites-available/ during Plan 8 Task 6 recon) — same
# origin-lockdown include, HSTS/security headers, gzip, and /_next/static/ cache-forever
# split. See deploy-recon.md §2/§B for the sibling precedent this was drafted from.
#
# HTTP-only on purpose so `nginx -t` passes before any TLS cert exists. At go-live, run
#   sudo certbot --nginx -d guitar.cgrigoriadis.online -d guitar-api.cgrigoriadis.online
# (BOTH domains, one cert — see deploy/README.md step 6: this is the same combined-SAN
# pattern already live for themis/themis-api, whose vhosts both point at
# /etc/letsencrypt/live/themis.cgrigoriadis.online/) which injects the 443 server block +
# HTTP->HTTPS redirect here.

server {
    server_name guitar.cgrigoriadis.online;
    # Origin lockdown: only answer Cloudflare edge IPs (direct-to-origin -> 403).
    include snippets/cloudflare-origin-allow.conf;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # --- Security headers ---
    # CSP is the one header this app didn't need before (deploy-recon.md §5b found zero
    # CSP anywhere in this stack or any sibling vhost). It exists here specifically so
    # AlphaTab (apps/web/src/components/artifacts/tab-view.tsx) keeps working:
    #   - worker-src/child-src 'blob:'  -> AlphaTab's synth always spins up a Web Worker
    #     (confirmed in tab-view.tsx's own comments: createWorkerPlayer() is unconditional
    #     regardless of core.useWorkers), instantiated from a `new Blob([...])` wrapping an
    #     `importScripts('.../alphaTab.min.js')` classic-worker fallback — that is a
    #     `blob:`-scheme worker, not same-origin, so plain 'self' would NOT cover it.
    #   - connect-src includes the API's own HTTPS origin, not just 'self': every browser
    #     call in this app (apps/web/src/lib/api.ts's single `fetch` chokepoint — Knowledge/
    #     Students/Curricula/Artifacts/Jobs-poll, all of it) goes directly to
    #     guitar-api.cgrigoriadis.online, a genuinely different origin from this vhost.
    #     'self'-only here would CSP-block the entire app, not just AlphaTab.
    #   - script-src/style-src need 'unsafe-inline': next-themes (src/components/
    #     theme-provider.tsx) injects a small inline <script> to set the theme class
    #     pre-hydration (no-flash), and AlphaTab injects an inline <style> for its
    #     @font-face + cursor-overlay rules (confirmed: `createElement("style")` present
    #     in the shipped public/alphatab/alphaTab.min.js). Neither this app's proxy.ts nor
    #     next.config.ts wires a nonce through to either library, so 'unsafe-inline' is the
    #     pragmatic choice for this PoC rather than a larger nonce-plumbing change (out of
    #     scope for a deploy-artifacts task) — same-origin restrictions on *external*
    #     script/style sources are still enforced, which is the main thing CSP buys here.
    #   - font-src/media-src 'self': AlphaTab's Bravura font + sonivox.sf2 soundfont are
    #     vendored under public/alphatab/ (same-origin, confirmed via `find`), not CDN.
    #   - img-src MUST include the API's HTTPS origin. This is NOT optional and was the
    #     one genuinely stale line in this file: the Library Reader (Plan 9) renders every
    #     scanned page of the tutor's book as <img src="https://guitar-api.../media/pages/
    #     {page_id}.jpg"> — a CROSS-ORIGIN image. With the original `img-src 'self' data:`
    #     the browser would block every one of them and the book would render as broken
    #     images in production while working perfectly on localhost (where there is no CSP).
    #     `data:` stays as a cheap, low-risk allowance.
    #   - object-src 'none', base-uri 'self', form-action 'self', frame-ancestors 'self':
    #     standard hardening with no functional cost to this app.
    # Verified against next.config.ts (no headers()) and proxy.ts (only sets
    # Cache-Control) — this app sets no CSP of its own, so there is nothing to conflict
    # with here (no double-CSP risk).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://guitar-api.cgrigoriadis.online; font-src 'self'; media-src 'self'; connect-src 'self' https://guitar-api.cgrigoriadis.online; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No camera/mic/geolocation use anywhere in apps/web/src (confirmed via grep) — deny
    # all three outright, tighter than zelofood's precedent (which keeps geolocation=(self)
    # for its own delivery-address feature; not applicable here).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    # Immutable Next.js build assets (content-hashed names) - safe to cache forever.
    # NOTE (nginx add_header inheritance): because this location sets its own add_header
    # (Cache-Control below), it does NOT inherit the server-level add_header lines above
    # (nginx only inherits add_header from an outer block when the current block adds
    # none of its own). Same pattern already live on themis/zelofood today — CSP/HSTS
    # absence on a *.js/*.css subresource response is a non-issue in practice (CSP is
    # enforced against the navigated document's policy, not per-subresource-response), so
    # this is intentionally left matching sibling precedent rather than duplicating every
    # header into this block too.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> Next.js: HTML pages, and /alphatab/* (AlphaTab's vendored font/
    # soundfont/worker-script assets, served from apps/web/public/ - NOT content-hashed,
    # so NOT routed through the immutable block above; they fall through here with
    # whatever Cache-Control Next's static file serving applies by default).
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
